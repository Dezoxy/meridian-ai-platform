<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} - Meridian adjuster</title>
<link rel="stylesheet" href="/adjuster/static/adjuster.css">
</head>
<body>
{% if signin is defined and signin %}
<p class="banner">Synthetic data only.</p>
{% else %}
<p class="banner">Synthetic data only. No sign-in yet: anyone who reaches this page can decide (T-69).</p>
{% endif %}
<nav><a href="/adjuster/claims">Claims that wait for an adjuster</a></nav>
{% if sign_out is defined and sign_out %}
<form method="post" action="/auth/sign-out"><button type="submit">Sign out</button></form>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
