[project]
name = "meridian"
version = "0.0.0"
description = "Enterprise agentic AI platform with a claims-triage reference workload."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Microsoft Agent Framework, the second agent framework (S037). Only
    # meridian.runtime and meridian.workloads may import it, never
    # meridian.platform (import-linter, ADR 2). Pinned at the version the S037
    # spike measured (spikes/s037-agent-framework-host); it brings msgspec and
    # python-dotenv and no provider SDK. The Agent Runtime's second host and
    # the claim-brief workload import it.
    "agent-framework-core==1.19.0",
    "azure-identity==1.26.0",
    # Reads the dates of the service's own certificate (common/certlife.py) and
    # makes the test certificates (tests/meridian/tlssupport.py); already
    # locked, through azure-identity and msal, so pinned directly here.
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "mcp==2.3.0",
    "openai==3.24.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-sdk==1.45.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    # Checks a user's bearer token (S021, common/signin.py): RS256 only, the
    # algorithms list fixed in code. Already locked, through mcp and msal, so
    # pinned directly at the version the lock holds; the crypto extra is the
    # RSA support, on the locked cryptography.
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    # The gateway's shared rate windows (S066, T-45): synchronous client only, no
    # hiredis extra. Imported only under meridian.platform.gateway.
    "redis==8.1.0",
    "typer==0.27.2",
    "uvicorn==0.54.0",
]

[project.scripts]
meridian = "meridian.platform.cli:app"

# The runtime finds a workload's graph factory here by the registry's agent ID
# and accepts only entry points published by this distribution (T-40).
[project.entry-points."meridian.graphs"]
claims-triage = "meridian.workloads.claims_triage.graph:build"
claim-brief = "meridian.workloads.claim_brief.workflow:build"

# `meridian eval run` finds a workload's evaluation plugin here by the workload's
# name and accepts only entry points published by this distribution (T-80).
[project.entry-points."meridian.evaluations"]
claims-triage = "meridian.workloads.claims_triage.evaluation_http:EVALUATION"
claim-brief = "meridian.workloads.claim_brief.evaluation:EVALUATION"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "import-linter==2.15",
    "pytest-timeout==2.4.0",
    "pytest-cov==7.1.0",
]

[tool.ruff]
target-version = "py313"
# The vendored kit and harness Python are not project code.
extend-exclude = ["scripts", "tests/test_*.py", ".claude", ".agents", ".codex"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/meridian/**" = ["S101", "S603", "S607"]
"tests/synthetic/**" = ["S101", "S603", "S607"]
"spikes/**/tests/**" = ["S101", "S603"]
# Not cryptographic: a seeded random.Random is what makes the data reproducible.
"data/synthetic/generator/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests/meridian", "tests/synthetic"]
# tests/meridian holds dbsupport.py, shared by the database fixtures and tests.
pythonpath = ["data/synthetic", "tests/meridian"]
addopts = "--import-mode=importlib"
# Every test, its fixtures included, is stopped after this many seconds, so a
# hang fails instead of stalling a run (pytest-timeout, S074). Measured on the
# development machine on 2026-10-07 in whole-suite runs of 20,015 tests with six
# workers: the slowest test took 45.0 s, and 52.4 s with coverage on, which is
# how CI runs it (test_a_fake_model_records_and_replays_the_whole_golden_set).
# Ten times 52.4 s is 524 s, rounded up to 600; a loaded machine must not fail
# a healthy test, and the limit is never under 120 s. A test slower by design
# carries its own `pytest.mark.timeout`: the paid opt-in recordings and the
# live Azure test carry 0, which is no limit. `signal` stops a test with an exception in the
# worker's main thread, where pytest-xdist runs it, so the worker lives and
# the tests after it run; `thread` would end the whole worker process. A child
# process a test started is not stopped by it, only by the test's own cleanup.
# tests/meridian/test_pytest_timeout_gate.py compares these two values.
timeout = 600
timeout_method = "signal"

# Line coverage of the package, measured only under COVERAGE=1 (the Makefile's
# switch, which CI sets); see [tool.coverage.report] for the floor. The paid
# opt-in tests are skipped in every run CI makes, and no source file is omitted
# for them: what only they would reach counts as uncovered, inside the floor.
# The measuring core is the interpreter's own monitoring (sys.monitoring,
# PEP 669), which coverage.py 7.16 supports for line coverage on Python 3.12 and
# later (it does not measure branches on 3.13, and this measures lines only, and
# it has no dynamic contexts). It costs far less than the trace function. It is
# set here, not in the environment, so that every pytest-xdist worker, which
# reads this file as the main process does, uses it.
[tool.coverage.run]
source = ["src/meridian"]
core = "sysmon"

[tool.coverage.report]
skip_empty = true
# Two decimals, or coverage.py rounds the total to a whole number before it
# compares it with the floor, which makes 97.5 pass a floor of 98.
precision = 2
# The floor: 99.11 % of 13,783 statements were covered in the whole suite on
# 2026-10-07 (20,015 tests, six workers, the database and Redis present), the
# same 122 missed lines with the trace function and with the monitoring core
# (20,028 tests). That rounded down is 99, and one point is taken off for the
# variation between runs.
# pytest-cov applies it when `--cov` is given (COVERAGE=1) and not otherwise;
# tests/meridian/test_ci_config.py compares it with a constant.
fail_under = 98

[tool.importlinter]
root_package = "meridian"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "platform never imports the agent framework (ADR 2)"
type = "forbidden"
source_modules = ["meridian.platform"]
# ADR 2 says langchain*, but import-linter wildcards replace whole module names
# only, so each distribution is listed: the core packages, the provider
# adapters for this platform's providers and the retrieval integrations.
forbidden_modules = [
    "langgraph",
    "langgraph_sdk",
    "langchain",
    "langchain_core",
    "langchain_community",
    "langchain_text_splitters",
    "langchain_postgres",
    "langchain_openai",
    "langchain_mistralai",
    "langchain_aws",
    "langchain_anthropic",
    # The second framework (S037): its package is agent_framework.
    "agent_framework",
    # Its adapters are separate top-level modules, named like their
    # distributions, and none is locked (a test over uv.lock holds that). The
    # list is the ``all`` extra of agent-framework-core 1.19.0 (its METADATA);
    # test_import_contracts.py fails when a release adds another.
    "agent_framework_a2a",
    "agent_framework_ag_ui",
    "agent_framework_anthropic",
    "agent_framework_azure_ai_search",
    "agent_framework_azure_contentunderstanding",
    "agent_framework_azure_cosmos",
    "agent_framework_azurefunctions",
    "agent_framework_bedrock",
    "agent_framework_chatkit",
    "agent_framework_claude",
    "agent_framework_copilotstudio",
    "agent_framework_declarative",
    "agent_framework_devui",
    "agent_framework_durabletask",
    "agent_framework_foundry",
    "agent_framework_foundry_hosting",
    "agent_framework_foundry_local",
    "agent_framework_gemini",
    "agent_framework_github_copilot",
    "agent_framework_hyperlight",
    "agent_framework_mem0",
    "agent_framework_mistral",
    "agent_framework_monty",
    "agent_framework_ollama",
    "agent_framework_openai",
    "agent_framework_orchestrations",
    "agent_framework_purview",
    "agent_framework_redis",
    "agent_framework_tools",
]

[[tool.importlinter.contracts]]
name = "workloads build on the platform, never the reverse"
type = "layers"
# Highest first: a layer may import the ones below it, never the ones above.
# The runtime host that runs LangGraph graphs sits between the two (S009): it
# may import the platform, and only workloads may import it.
layers = [
    "meridian.workloads",
    "meridian.runtime",
    "meridian.platform",
]

[[tool.importlinter.contracts]]
name = "only the gateway imports a provider SDK (hard rule 4, T-19)"
type = "forbidden"
# Every first-party package except meridian.platform.gateway. import-linter has
# no "all except" form, so each is listed; test_import_contracts.py fails when a
# new package under src/meridian/platform/ is missing from this list.
source_modules = [
    "meridian.workloads",
    "meridian.runtime",
    "meridian.platform.claims_mcp",
    "meridian.platform.cli",
    "meridian.platform.common",
    "meridian.platform.evaluation",
    "meridian.platform.guardrails",
    "meridian.platform.knowledge_mcp",
    "meridian.platform.migrations",
    "meridian.platform.policy_mcp",
    "meridian.platform.registry",
    "meridian.platform.toolserver",
]
# Indirect imports count: a chain through the gateway's adapter is a violation.
# Each distribution is listed because wildcards replace whole module names only.
forbidden_modules = [
    "openai",
    "mistralai",
    "anthropic",
    "boto3",
    "botocore",
    "litellm",
    # `azure` is a namespace package and import-linter refuses a subpackage of
    # an external package, so `azure.identity` and `azure.core` cannot be named:
    # `azure` covers every azure.* distribution.
    "azure",
    # The second framework's adapters that make a model call (S037): each wraps
    # a provider SDK import-linter cannot see into, and none is locked.
    "agent_framework_anthropic",
    "agent_framework_bedrock",
    "agent_framework_claude",
    "agent_framework_copilotstudio",
    "agent_framework_foundry",
    "agent_framework_foundry_local",
    "agent_framework_gemini",
    "agent_framework_github_copilot",
    "agent_framework_mistral",
    "agent_framework_ollama",
    "agent_framework_openai",
    # Not a provider SDK: the client of the rate windows' store (S066, T-45),
    # which only the gateway talks to. It is in this list, and not in the
    # adapter contract's below, because the gateway's own rate store imports it.
    "redis",
]

[[tool.importlinter.contracts]]
name = "inside the gateway only the Azure OpenAI adapter imports a provider SDK"
type = "forbidden"
source_modules = ["meridian.platform.gateway"]
# The list of the contract above; azure is in it, so app.py reaches the
# credential through the adapter's check_token.
forbidden_modules = [
    "openai",
    "mistralai",
    "anthropic",
    "boto3",
    "botocore",
    "litellm",
    "azure",
    "agent_framework_anthropic",
    "agent_framework_bedrock",
    "agent_framework_claude",
    "agent_framework_copilotstudio",
    "agent_framework_foundry",
    "agent_framework_foundry_local",
    "agent_framework_gemini",
    "agent_framework_github_copilot",
    "agent_framework_mistral",
    "agent_framework_ollama",
    "agent_framework_openai",
]
# Direct imports only: the rest of the gateway may import the adapter, which
# imports openai and azure. The adapter's own imports are the ignored edges.
allow_indirect_imports = true
ignore_imports = [
    "meridian.platform.gateway.providers.azure_openai -> openai",
    "meridian.platform.gateway.providers.azure_openai -> azure",
]

[[tool.importlinter.contracts]]
name = "the claim brief imports no HTTP client (S037)"
type = "forbidden"
# A step of the workload's own class could hold something that posts to a model
# itself, which the second host's rule about step classes cannot see (it is about
# inheritance). The standard library's clients cannot be named here;
# tests/meridian/workloads/claim_brief/test_brief_import_allowlist.py holds those
# and the four names the package may import of the framework.
source_modules = ["meridian.workloads.claim_brief"]
forbidden_modules = ["httpx", "requests", "aiohttp"]
# Direct imports only: the package imports the runtime, which imports httpx for
# its own clients.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the gateway imports neither the evaluation package nor the CLI"
type = "forbidden"
# A deployed service must not depend on the package that loads workloads and
# holds a client of the gateway (S050, T-78). What both need, the JSON file
# reader, lives in meridian.platform.common.jsonfile. Indirect imports count.
source_modules = ["meridian.platform.gateway"]
forbidden_modules = [
    "meridian.platform.evaluation",
    "meridian.platform.cli",
]

[[tool.importlinter.contracts]]
name = "only the sign-in modules import the JWT library (S021)"
type = "forbidden"
# The check of a person's bearer token is the one place a token is parsed and a
# signature verified; PyJWT was already installed through mcp and msal, and an
# import of it elsewhere would be a second, unreviewed check. The same source
# list as the provider contract, with the gateway added, because import-linter
# has no "all except" form; test_import_contracts_signin.py fails when a new
# package under src/meridian/platform/ is missing from it.
source_modules = [
    "meridian.workloads",
    "meridian.runtime",
    "meridian.platform.cli",
    "meridian.platform.common",
    "meridian.platform.evaluation",
    "meridian.platform.gateway",
    "meridian.platform.guardrails",
    "meridian.platform.knowledge_mcp",
    "meridian.platform.migrations",
    "meridian.platform.policy_mcp",
    "meridian.platform.registry",
    "meridian.platform.toolserver",
]
forbidden_modules = ["jwt"]
# The three modules that parse and verify are the ignored edges: the access
# token's check, the key set's reader and the ID token's check at the pages'
# callback (signinidtoken; signinflow calls it and imports no JWT library). An
# ignored edge leaves the graph, so a chain through them (signinguard -> signin
# -> jwt) is no violation either.
ignore_imports = [
    "meridian.platform.common.signin -> jwt",
    "meridian.platform.common.signinkeys -> jwt",
    "meridian.platform.common.signinidtoken -> jwt",
]

[[tool.importlinter.contracts]]
name = "services and graph code do not import the sign-in modules (S021)"
type = "forbidden"
# People sign in at the Claims API (the page and JSON routes); services identify
# each other by certificate (meridian.platform.common.identity), and a person's
# token, cookie or principal never crosses a service boundary. The sources are
# the gateway, the runtime, the tool servers and the graph code of the
# workloads; the Claims API's own modules (claims_triage.app and its routers)
# are the ones that may import them. Indirect imports count.
source_modules = [
    "meridian.platform.gateway",
    "meridian.runtime",
    "meridian.platform.toolserver",
    "meridian.platform.knowledge_mcp",
    "meridian.platform.policy_mcp",
    "meridian.platform.claims_mcp",
    "meridian.workloads.claim_brief",
    "meridian.workloads.claims_triage.graph",
]
forbidden_modules = [
    "meridian.platform.common.signin",
    "meridian.platform.common.signinkeys",
    "meridian.platform.common.signinsession",
    "meridian.platform.common.signinguard",
    "meridian.platform.common.signinflow",
    "meridian.platform.common.signinstate",
    "meridian.platform.common.signinidtoken",
]

[[tool.importlinter.contracts]]
name = "the shared platform code does not import the gateway"
type = "forbidden"
# The gateway imports meridian.platform.common (env, http, identity), so a
# reverse import is a cycle. A setting both need, such as the environment's
# variable name, is therefore repeated in common with a test that ties the two
# copies (test_signin_session.py), until it moves into common.env. Indirect
# imports count.
source_modules = ["meridian.platform.common"]
forbidden_modules = ["meridian.platform.gateway"]
