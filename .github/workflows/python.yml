name: Python / Lint and test

# The Python gates: ruff (lint and format check), the import-linter contracts
# that keep the agent framework out of platform packages (ADR 2), and pytest,
# which includes a test that plants a deliberate violation and expects the
# contracts to catch it. Runs on every pull request and on main. Read-only.
# The job name is meant to be a required status check in the protect-main
# ruleset; rename the job and the ruleset entry in the same change.
#
# There are deliberately no path filters. A required check that a path filter
# skips never reports, and GitHub then blocks every pull request that touches
# no Python, such as a documentation-only change, waiting for it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-26.04
    # The tests run in parallel (make pytest, four workers). Measured over the
    # 47 successful runs of 2026-10-04 (S057): 4 min 59 s to 7 min 30 s, the
    # median 6 min 47 s, of which the Tests step is all but half a minute. The
    # limit is twice the slowest: it ends a job that hangs and is no budget, so
    # a run that comes near it is a finding. The suite grew from 4 min 50 s to
    # this in a day; measure again before the median passes 10 minutes.
    timeout-minutes: 15
    env:
      # The database tests (S009) run against the service container below;
      # MERIDIAN_REQUIRE_DB makes a missing database a failure, not a skip.
      MERIDIAN_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      MERIDIAN_REQUIRE_DB: "1"
      # The gateway's shared rate windows (S066) run against the Redis service
      # container below; MERIDIAN_REQUIRE_DB makes a missing Redis a failure too.
      MERIDIAN_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # The version of Terraform the step below installs (S079). The tests of
      # three modules' variable validations run `terraform console`; this is the
      # version the modules require (`~> 1.16` in each versions.tf) and the one
      # the development machine runs, and tests/meridian/test_ci_config.py checks
      # the first. Renovate's reader takes the comment's line.
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: "1.16.5"
    services:
      postgres:
        # Throwaway and unreachable from outside the job, so trust auth keeps
        # a password out of the file. Same image as `make pytest-db`:
        # PostgreSQL 17.11 with pgvector 0.8.7 on Debian trixie (the knowledge
        # store, S012): the same PostgreSQL and OS release as the
        # CloudNativePG image kind runs, and one pgvector patch ahead of it.
        image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-start-period 5s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Throwaway and unreachable from outside the job. A service container
        # takes no command, so it runs with the image's defaults (snapshots to
        # its own disk, gone with it); `make pytest-db` switches them off, and
        # no test depends on either. Same image as `make pytest-db` (Redis
        # 8.10.2 on Alpine 3.23; a test compares the two strings).
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-start-period 2s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-uv has published no floating major tag since v8, so the pin is a
      # full version. Renovate's actions group bumps it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # --locked fails when uv.lock is out of date with pyproject.toml.
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint, format check and import contracts
        run: make lint
      # The chart tests render the chart and fail without helm (never skip), and
      # `make helm-lint` lints it. The version is the one infra/kind/README.md
      # documents (tests/meridian/test_helm_chart.py compares them).
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0
      - name: Lint the Helm chart
        run: make helm-lint
      # promtool, from the Makefile's pinned image, checks the alert rules and
      # runs their unit tests (S024); the runner has Docker.
      - name: Check the alert rules
        run: make alerts
      # The variable validations of the three Terraform modules run `terraform
      # console` on scratch copies of their files: no provider is downloaded, no
      # credential or cloud login exists, and no `init` runs. The marker of those
      # tests fails under CI when the program is missing, so this step cannot
      # drop out unseen (tests/meridian/terraformsupport.py). The wrapper is off:
      # the tests read the program's own output.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Tests
        run: make pytest
        env:
          # The Makefile's default is the development machine's (10); this
          # runner has four cores.
          PYTEST_WORKERS: "4"
          # make hands this to pytest, which then prints the slowest tests: what
          # one test adds to the job can be read from any run (S057).
          PYTEST_ARGS: --durations=25
          # The recorded evaluation test writes its report here (S017, S050).
          MERIDIAN_EVAL_REPORT: ${{ runner.temp }}/claims-triage-report.json
          # The injection stack test writes its report here (S032).
          MERIDIAN_EVAL_INJECTION_REPORT: ${{ runner.temp }}/claims-triage-injection-report.json
      # The test compares the report too; this runs the same comparison as the
      # command a reader runs (meridian eval compare) on the file the test wrote.
      - name: Evaluation gate
        run: >-
          make eval-compare
          EVAL_REPORT="$RUNNER_TEMP/claims-triage-report.json"
          EVAL_INJECTION_REPORT="$RUNNER_TEMP/claims-triage-injection-report.json"
      - name: Registry validation
        run: make registry
