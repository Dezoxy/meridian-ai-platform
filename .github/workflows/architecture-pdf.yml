name: Docs / Architecture PDF

# Publishes the architecture Documentation tab and every view as a PDF on a
# GitHub release, when an operator starts it on main, and beside it the brief:
# the same without the documents docs/architecture/pdf-brief.txt lists and
# with the decisions as an index. One release per edition: the edition is the
# last commit to docs/architecture, and the tag is architecture-<edition>. It
# runs `make pdf` and `make pdf-brief`, so the image pins at the top of the
# Makefile apply here exactly as they do locally.
#
# On a pull request that changes this workflow, the PDF scripts or the
# Makefile, only the build job runs, so the build is proven in CI before a
# release depends on it. Nothing is published from a pull request.
#
# Release access follows repository access. In a public repository, the PDF is
# public.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/architecture-pdf.yml"
      - "scripts/**"
      - "Makefile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      pdf: ${{ steps.build.outputs.pdf }}
      brief: ${{ steps.build.outputs.brief }}
      edition: ${{ steps.build.outputs.edition }}
      project: ${{ steps.build.outputs.project }}
    steps:
      # A release must document main. "Run workflow" lets the operator pick a
      # branch, so refuse anything else before doing any work.
      - name: Refuse a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Architecture PDFs are published from main only; this run was started on ${REF}." >&2
          exit 1

      # Full history: the edition is the last commit to docs/architecture, which
      # a shallow clone may not contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The same command as a local build: export PNG and JSON with the pinned
      # Structurizr image, assemble, render with Pandoc and Eisvogel.
      - name: Build the PDF and the brief
        id: build
        shell: bash
        run: |
          set -euo pipefail
          make pdf
          make pdf-brief
          generated=docs/architecture/generated
          shopt -s nullglob
          pdfs=("${generated}"/*.pdf)
          briefs=("${generated}"/*-architecture-brief-*.pdf)
          if [[ "${#pdfs[@]}" -ne 2 || "${#briefs[@]}" -ne 1 ]]; then
            echo "::error::expected the PDF and its brief in ${generated}, found ${#pdfs[@]} PDFs, ${#briefs[@]} of them a brief" >&2
            exit 1
          fi
          brief="$(basename "${briefs[0]}")"
          # The two names differ in "-brief" alone, so they are one edition.
          pdf="${brief/-architecture-brief-/-architecture-}"
          if [[ ! -f "${generated}/${pdf}" ]]; then
            echo "::error::the brief ${brief} has no PDF ${pdf} beside it" >&2
            exit 1
          fi
          # payment-platform-architecture-2026-09-18-af49b21.pdf -> af49b21
          edition="${pdf%.pdf}"
          edition="${edition##*-}"
          if [[ "${pdf}" == *-dirty.pdf || -z "${edition}" ]]; then
            echo "::error::unexpected PDF name ${pdf}: a CI checkout should never be dirty" >&2
            exit 1
          fi
          project="$(jq -r '.name // "Architecture"' "${generated}/workspace.json")"
          mkdir -p "${RUNNER_TEMP}/pdf"
          cp "${generated}/${pdf}" "${generated}/${brief}" "${RUNNER_TEMP}/pdf/"
          {
            echo "pdf=${pdf}"
            echo "brief=${brief}"
            echo "edition=${edition}"
            echo "project=${project}"
          } >> "${GITHUB_OUTPUT}"
          ls -la "${RUNNER_TEMP}/pdf"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-pdf
          path: ${{ runner.temp }}/pdf/*.pdf
          retention-days: 14

  # Only this job can write, and only when an operator started the workflow on
  # main. It publishes the two PDFs the build job produced; it builds nothing.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: architecture-pdf
          path: ${{ runner.temp }}/pdf

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PDF: ${{ needs.build.outputs.pdf }}
          BRIEF: ${{ needs.build.outputs.brief }}
          EDITION: ${{ needs.build.outputs.edition }}
          PROJECT: ${{ needs.build.outputs.project }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="architecture-${EDITION}"
          # One release per edition: a second run for an unchanged model says
          # so and publishes nothing.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists: the model has not changed since it was published." >&2
            exit 1
          fi
          # The tag points at the edition commit: the model state the PDF shows.
          edition_sha="$(gh api "repos/${GH_REPO}/commits/${EDITION}" --jq .sha)"
          gh release create "${tag}" "${RUNNER_TEMP}/pdf/${PDF}" "${RUNNER_TEMP}/pdf/${BRIEF}" \
            --target "${edition_sha}" \
            --title "${PROJECT} architecture, edition ${EDITION}" \
            --notes "Architecture documentation built from main at ${MAIN_SHA}, as the full edition and as a brief that says on its first page what it leaves out. Edition ${EDITION} is the last commit to docs/architecture. Share them only with people who may read this repository."
          echo "published ${tag}: ${PDF} and ${BRIEF}"
