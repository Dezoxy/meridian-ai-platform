name: Docs / Consistency

# The documentation gate, Structurizr validation of the architecture model,
# the derived-diagram sync check, a render of every Mermaid block and a
# secret scan. Runs on every pull request and on main. Read-only. Each job
# name is a required status check in the protect-main ruleset; rename one and
# update the ruleset in the same change.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-26.04
    # The guard's cases run one after another, one start of the hook each: 4 min
    # 17 s for 2,889 cases on 2026-10-08, and the 3,824 of S020's rules passed
    # the old limit of 5. A parallel loop would bring it back under two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The mechanical half of docs-sync, then the checker's and the harness's
      # own regression tests.
      - name: Check documentation against the tree
        run: make docs
      - name: Tests
        run: make test
      - name: Bash guard regression cases
        run: bash tests/test_guard_bash.sh

  model:
    name: architecture model
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Same pinned image as local runs (Makefile STRUCTURIZR_IMAGE).
      - name: Validate and inspect the Structurizr workspace
        run: make check

  diagrams:
    name: derived diagrams
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Regenerates every view-derived Mermaid block from the model and fails
      # when a committed block differs: run `make mermaid-views` and commit.
      - name: Regenerate derived Mermaid blocks
        run: make mermaid-views
      - name: Derived blocks are current
        run: git diff --exit-code -- '*.md'
      # Renders every Mermaid block in the Markdown with the Makefile's pinned
      # image (MERMAID_IMAGE) and fails on one that does not parse, which
      # GitHub would only show as an error box on the pushed page.
      - name: Every Mermaid block renders
        run: make mermaid-render

  secrets:
    name: secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Full history: gitleaks scans every commit, not only the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The scanner version is pinned to the one used locally: .gitleaks.toml
      # uses the [[allowlists]] syntax, which gitleaks reads from 8.25 on, and
      # the action's bundled default was older.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
          GITLEAKS_VERSION: "8.30.1"
