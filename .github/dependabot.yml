# Keeps the GitHub Actions used by the workflows, the locked Python
# dependencies and the Dockerfile's digest-pinned base images current. The
# kind charts and images in infra/kind/pins.env are not watched (S006).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
