# Keeps the GitHub Actions used by the workflows and the locked Python
# dependencies current. Container dependencies are added when they exist (plan
# step S019).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
