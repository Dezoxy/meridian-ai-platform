{{- /*
The scheduled sweep (S052): `python -m meridian.workloads.claims_triage.sweep`,
one pass every five minutes, as the database role claims_sweep (Secret
claims-sweep-db, never the owner's). A pass refers a claim whose documents are
overdue to an adjuster, fails a claim stranded in submitted or triaging, ends a
run nobody resumes and deletes the checkpoints of a finished run. It needs
PostgreSQL and nothing else: no call to a service, no registry, no model.
The release holds it with the services. Unlike a Job's, a CronJob's spec can
change in place, and the next Job it starts carries the change, so its name has
no image tag.
  concurrencyPolicy Forbid  governs only what the schedule starts: a scheduled
                            pass is skipped while another is running. A Job
                            made by hand (`kubectl create job
                            --from=cronjob/meridian-sweep`) runs beside a
                            scheduled one, which is why the role's connection
                            limit allows two pods; the CronJob owns it, so the
                            next scheduled pass is skipped while it runs
  activeDeadlineSeconds     120, under half the period: a hung connection ends
                            the pass, because Forbid would otherwise skip
                            every later run behind it
  startingDeadlineSeconds   a run the controller could not start within 120 s
                            is skipped; the next one is five minutes away
  backoffLimit 0            the next run is the retry
  history limits            one success and the last three failures; a by-hand
                            Job counts, as the CronJob owns it. A success is
                            removed when the next one finishes, about five
                            minutes later; make smoke reads the last finished
  ttlSecondsAfterFinished   a day: what keeps a failure for the morning, and
                            the last success of a suspended CronJob, which no
                            later Job pushes out
The pod takes the migration Job's shape: the 'db-ca' volume holds only the CA's
public certificate, no service-account token, no extra privilege, a read-only
root filesystem and a writable /tmp. No PodDisruptionBudget, as for the Jobs. The
schedule, the deadline and the documents' deadline are values.

Telemetry (S064). With telemetry.otlpEndpoint set, the pod sends the six gauges
of what its pass found (meridian_sweep_last_pass) to the collector before it
exits, and gets what a service gets for that, from the same helpers: the address,
and with telemetry.caConfigMap the mounted authority and the variable that names
it. Its NetworkPolicy then also allows the collector's port (networkpolicy.yaml).
With no address it gets none of the three and sends nothing.
  OTEL_EXPORTER_OTLP_TIMEOUT  sweep.telemetryTimeoutSeconds, the SDK's deadline
                              for one export, in SECONDS (the variable's unit
                              at the pinned exporter; 5000 would be 83 minutes).
                              Retries run inside that one deadline, so it bounds
                              what a collector that does not answer can cost the
                              pass's exit: the flush and the shutdown each try
                              once, so a few times the value, far inside
                              activeDeadlineSeconds. The chart refuses a value
                              that is not above 0 and under that deadline. It is
                              the sweep's alone: a service's exports run in the
                              background and need no bound. Rendered only with
                              an address
  OTEL_RESOURCE_ATTRIBUTES    service.instance.id=claims-sweep (C3). Each pass is
                              a new process, and the SDK gives a process a
                              random instance ID, which Prometheus keeps as the
                              `instance` label: every pass would write six new
                              series, and no rule or panel could read them
                              without knowing it. With one fixed ID the six
                              series are the same from pass to pass, and the
                              sample with the later timestamp is kept, which
                              is what "the last pass" means. A sample that
                              arrives with an earlier timestamp is refused as
                              out of order (the collector logs it). Only a Job
                              run by hand can overlap a scheduled one
                              (concurrencyPolicy: Forbid). The SDK
                              takes the ID from this variable and the service's
                              name from the code, so the variable cannot rename
                              the service (tested). A service must not get it:
                              two replicas would write one series. Rendered only
                              with an address, with the timeout
*/ -}}
{{- $timeout := float64 .Values.sweep.telemetryTimeoutSeconds }}
{{- if not (and (gt $timeout 0.0) (lt $timeout (float64 .Values.sweep.activeDeadlineSeconds))) }}
{{- fail (printf "sweep.telemetryTimeoutSeconds is %v, which is not above 0 and under sweep.activeDeadlineSeconds (%v): it is the SDK's deadline for one export, in seconds, and a send that could outlast the pass's deadline would end the pass as a failure" .Values.sweep.telemetryTimeoutSeconds .Values.sweep.activeDeadlineSeconds) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-sweep
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meridian.labels" "meridian-sweep" | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: meridian-sweep
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meridian.labels" "meridian-sweep" | nindent 4 }}
spec:
  schedule: {{ .Values.sweep.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "meridian.labels" "meridian-sweep" | nindent 8 }}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.sweep.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "meridian.labels" "meridian-sweep" | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: meridian-sweep
          automountServiceAccountToken: false
          securityContext:
            {{- include "meridian.podSecurityContext" . | nindent 12 }}
          containers:
            - name: sweep
              image: {{ include "meridian.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: [python, -m, meridian.workloads.claims_triage.sweep]
              env:
                {{- include "meridian.secretEnv" (dict "name" "MERIDIAN_DATABASE_URL" "secret" .Values.sweep.dbSecret) | nindent 16 }}
                - name: MERIDIAN_SWEEP_DOCUMENTS_DEADLINE_DAYS
                  value: {{ include "meridian.documentsDeadlineDays" . | quote }}
                {{- with include "meridian.telemetryEnv" . | trim }}
                {{- . | nindent 16 }}
                {{- end }}
                {{- if .Values.telemetry.otlpEndpoint }}
                - name: OTEL_EXPORTER_OTLP_TIMEOUT
                  value: {{ $timeout | quote }}
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: service.instance.id=claims-sweep
                {{- end }}
              resources:
                {{- toYaml .Values.sweep.resources | nindent 18 }}
              securityContext:
                {{- include "meridian.containerSecurityContext" . | nindent 18 }}
              volumeMounts:
                {{- include "meridian.caMount" . | nindent 16 }}
                {{- include "meridian.tmpMount" . | nindent 16 }}
                {{- with include "meridian.telemetryCaMount" . | trim }}
                {{- . | nindent 16 }}
                {{- end }}
          volumes:
            {{- include "meridian.caVolume" . | nindent 12 }}
            {{- include "meridian.tmpVolume" . | nindent 12 }}
            {{- with include "meridian.telemetryCaVolume" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
