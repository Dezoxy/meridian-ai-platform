{{- /*
One ServiceAccount, Deployment, Service and PodDisruptionBudget per entry of
`services` in values.yaml, all named after the service (no release prefix: the
cluster holds objects of these names already). The pod takes no service-account
token. Each reads its own database role's Secret and the CA's public
certificate, and sets the variables its values list. The root filesystem is
read-only; the pod's /tmp is the one writable path. Their NetworkPolicies are in
networkpolicy.yaml.

Each pod also mounts its own certificate (the Secret <name>-tls that
certificates.yaml asks cert-manager for) at /etc/meridian/tls, read-only (S055),
with mode 0440 and the pod's fsGroup, so the key is readable by the service's
own user and group alone (S056). Every service gets the three file paths in
MERIDIAN_TLS_*, so its /healthz turns 503 near its certificate's end whether
it calls another service or not. A service with `tls: true` in the values
serves TLS and asks its callers for a certificate: its command in the values
starts the TLS start module (S069), the template appends uvicorn's flags to it
and sets the probes' scheme to HTTPS. The port, the container's port name and the Service do not change. A
service that another workload calls (a serviceUrl or a serviceMap of any
service's or Job's env names it) must set `tls: true`, or the chart fails: no
value turns identity off. The Claims API, which nobody inside the chart calls,
stays plain HTTP.

With telemetry.caConfigMap set (S063), each pod also mounts the one key of that
ConfigMap, the collector's authority, read-only at /etc/meridian/telemetry-ca
and gets OTEL_EXPORTER_OTLP_CERTIFICATE, the SDK's variable for the file its
exporters trust, so the https address of telemetry.otlpEndpoint is verified.
The directory is not the service's own certificate's: that CA signs the
services, not the collector. A pod verifies against this file alone. The address,
the variable, the mount and the volume are the helpers meridian.telemetryEnv,
meridian.telemetryCaMount and meridian.telemetryCaVolume, which the sweep's
CronJob includes too (S064); the Jobs include none, they send nothing.
tests/meridian/test_kind_manifests.py ties every name below to the code.

The Model Gateway keeps its rate windows in its own process unless the rate store
is on (S066, rate-store.yaml). Without the store a second replica would allow the
full limits each (threat model T-45), so the chart fails for more than one. With
`rateStore.enabled` the windows are shared, the gateway is given the store's
address (MERIDIAN_GATEWAY_RATE_STORE_URL, from the key `uri` of the Secret
rateStore.secret, through a required reference: no `optional`, and the variable
is never rendered with a value of its own or an empty one, which would stop the
gateway's start; a values `env` item of that name is refused for every service,
the store on or off) and more replicas are allowed. Without the store the guard does
not cover a rolling update, during which Kubernetes runs a second pod for some
seconds and each allows the full windows. That is left as it is on purpose: the
alternative, `maxSurge: 0`, takes the gateway down for those seconds. With the
store the two pods share the windows, so the overlap costs nothing (T-45).

With `signin.mode: staff` (S021, Y4b, _signin.tpl) the Claims API's container,
and no other, also gets the sign-in and session variables, its pod a
dnsConfig and the generation as a pod annotation; the credential and the
cookie's key come from keys of the Secret signin.secret. A values `env` item of
any service that names a MERIDIAN_SIGNIN or MERIDIAN_SESSION variable is refused.
*/ -}}
{{- range $name, $service := .Values.services }}
{{- $signinOn := include "meridian.signinStaffOn" $ }}
{{- $signinStaff := and (eq $name "claims-api") $signinOn }}
{{- if and (eq $name "model-gateway") (gt (int $service.replicas) 1) (not $.Values.rateStore.enabled) }}
{{- fail (printf "services.model-gateway.replicas is %v, but without the rate store the gateway keeps its rate windows in one process, so each replica would allow the full limits (threat model T-45): it runs one replica, or set rateStore.enabled=true (and rateStore.image) to share the windows between replicas" $service.replicas) }}
{{- end }}
{{- $callers := include "meridian.callers" (dict "root" $ "name" $name) | fromJsonArray }}
{{- if and $callers (not $service.tls) }}
{{- fail (printf "services.%s.tls is not true, but it is called by %s (a serviceUrl or a serviceMap in their env names it): a service that is called must set `tls: true`, serve TLS and check its caller's certificate, and no value turns identity off. Only a service that nobody inside the chart calls, like claims-api, may stay plain HTTP" $name (join ", " $callers)) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: {{ include "meridian.revisionHistoryLimit" $ }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "meridian.labels" $name | nindent 8 }}
      {{- if $signinStaff }}
      annotations:
        meridian.local/signin-generation: {{ include "meridian.signinGeneration" $ | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- if $signinStaff }}
      {{- include "meridian.signinDnsConfig" $ | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "meridian.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "meridian.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            {{- toYaml $service.command | nindent 12 }}
            {{- if $service.tls }}
            {{- include "meridian.tlsFlags" $ | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          env:
            {{- include "meridian.secretEnv" (dict "name" "MERIDIAN_DATABASE_URL" "secret" $service.dbSecret) | nindent 12 }}
            {{- range $service.env }}
            {{- if eq .name "MERIDIAN_GATEWAY_RATE_STORE_URL" }}
            {{- fail (printf "services.%s.env sets MERIDIAN_GATEWAY_RATE_STORE_URL: the rate store's address holds the gateway's password and comes from the key `uri` of the Secret rateStore.secret and from nowhere else, so no values file may carry it (with the store off the variable does not exist, and with it on the chart adds it from the Secret)" $name) }}
            {{- end }}
            {{- if eq .name "MERIDIAN_CLAIMS_UPLOADS" }}
            {{- fail (printf "services.%s.env sets MERIDIAN_CLAIMS_UPLOADS: the switch of the upload route comes from route.uploads.enabled and from nowhere else, which also turns on the edge's route and limits for it, so no values env item may set it" $name) }}
            {{- end }}
            {{- if eq .name "MERIDIAN_CLAIMS_DOWNLOADS" }}
            {{- fail (printf "services.%s.env sets MERIDIAN_CLAIMS_DOWNLOADS: the switch of the download route comes from route.downloads.enabled and from nowhere else, which also turns on the edge's rule and limit for it and the guard that keeps it local, so no values env item may set it" $name) }}
            {{- end }}
            {{- include "meridian.signinEnvRefusal" (dict "service" $name "name" .name) }}
            {{- include "meridian.envItem" (dict "root" $ "item" .) | nindent 12 }}
            {{- end }}
            {{- if and (eq $name "claims-api") $.Values.route.uploads.enabled }}
            - name: MERIDIAN_CLAIMS_UPLOADS
              value: "on"
            {{- end }}
            {{- if and (eq $name "claims-api") $.Values.route.downloads.enabled }}
            - name: MERIDIAN_CLAIMS_DOWNLOADS
              value: "on"
            {{- end }}
            {{- if $signinStaff }}
            {{- include "meridian.signinEnv" $ | nindent 12 }}
            {{- end }}
            {{- if include "meridian.usesRateStore" (dict "root" $ "name" $name) }}
            {{- include "meridian.secretEnv" (dict "name" "MERIDIAN_GATEWAY_RATE_STORE_URL" "secret" (include "meridian.rateStore" $ | fromJson).secret) | nindent 12 }}
            {{- end }}
            {{- with include "meridian.telemetryEnv" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "meridian.tlsEnv" (dict "root" $ "mounts" true "serves" $service.tls) | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: MERIDIAN_TLS_RESTART_SHARE
              value: {{ include "meridian.restartShare" (dict "root" $ "name" $name) | quote }}
          readinessProbe:
            {{- include "meridian.probe" (dict "probe" $.Values.probes.readiness "tls" $service.tls) | nindent 12 }}
          livenessProbe:
            {{- include "meridian.probe" (dict "probe" $.Values.probes.liveness "tls" $service.tls) | nindent 12 }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          securityContext:
            {{- include "meridian.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            {{- include "meridian.caMount" . | nindent 12 }}
            {{- include "meridian.tmpMount" . | nindent 12 }}
            {{- include "meridian.tlsMount" $ | nindent 12 }}
            {{- with include "meridian.telemetryCaMount" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "meridian.caVolume" $ | nindent 8 }}
        {{- include "meridian.tmpVolume" $ | nindent 8 }}
        {{- include "meridian.tlsVolume" $name | nindent 8 }}
        {{- with include "meridian.telemetryCaVolume" $ | trim }}
        {{- . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
{{- /*
The budget: with one replica, maxUnavailable 1 permits the one pod's eviction,
so it does not block a node drain and protects nothing yet; it starts to matter
with a second replica. minAvailable 1 on a single replica would block every
drain, which on AKS blocks a node upgrade.
*/}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
