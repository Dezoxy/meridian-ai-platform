{{- /*
One ServiceAccount, Deployment, Service and PodDisruptionBudget per entry of
`services` in values.yaml, all named after the service (no release prefix: the
cluster holds objects of these names already). The pod takes no service-account
token. Each reads its own database role's Secret and the CA's public
certificate, and sets the variables its values list. The root filesystem is
read-only; the pod's /tmp is the one writable path. Their NetworkPolicies are in
networkpolicy.yaml.
tests/meridian/test_kind_manifests.py ties every name below to the code.

The Model Gateway keeps its rate windows in one process: with a second replica
each one would allow the full limits (threat model T-45), so the chart fails.
The guard does not cover a rolling update, during which Kubernetes runs a second
pod for some seconds and each allows the full windows. That is left as it is on
purpose: the alternative, `maxSurge: 0`, takes the gateway down for those
seconds. The plan's backlog holds it (T-45).
*/ -}}
{{- range $name, $service := .Values.services }}
{{- if and (eq $name "model-gateway") (gt (int $service.replicas) 1) }}
{{- fail (printf "services.model-gateway.replicas is %v, but the gateway keeps its rate windows in one process, so each replica would allow the full limits (threat model T-45): it runs one replica" $service.replicas) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "meridian.labels" $name | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "meridian.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "meridian.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            {{- toYaml $service.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          env:
            {{- include "meridian.secretEnv" (dict "name" "MERIDIAN_DATABASE_URL" "secret" $service.dbSecret) | nindent 12 }}
            {{- range $service.env }}
            {{- include "meridian.envItem" (dict "root" $ "item" .) | nindent 12 }}
            {{- end }}
            {{- with $.Values.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            {{- toYaml $.Values.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml $.Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          securityContext:
            {{- include "meridian.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            {{- include "meridian.caMount" . | nindent 12 }}
            {{- include "meridian.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "meridian.caVolume" $ | nindent 8 }}
        {{- include "meridian.tmpVolume" $ | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
{{- /*
The budget: with one replica, maxUnavailable 1 permits the one pod's eviction,
so it does not block a node drain and protects nothing yet; it starts to matter
with a second replica. minAvailable 1 on a single replica would block every
drain, which on AKS blocks a node upgrade.
*/}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "meridian.labels" $name | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
