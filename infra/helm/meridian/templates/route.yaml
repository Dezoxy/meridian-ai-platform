{{- /*
The only route on the edge: the Claims API, on a *.localhost name on kind. The
Agent Runtime and the Model Gateway have none and stay reachable only in the
cluster. A request with another Host header (127.0.0.1:8088, a rebinding page)
matches no route and gets 404 (threat model T-01). Plain HTTP until the edge
gets its certificates. Rendered only when `route.enabled`. With
`route.uploads.enabled` there is a second HTTPRoute for the same service, for
the upload paths alone (below).
*/ -}}
{{- if and .Values.route.uploads.enabled (not .Values.route.enabled) }}
{{- fail "route.uploads.enabled is true, but route.enabled is false: the upload route is a second route on the edge and has nothing to stand beside; turn the route on (route.enabled, route.hostname, route.parentRef) or turn uploads off" }}
{{- end }}
{{- if and .Values.route.downloads.enabled (not .Values.route.uploads.enabled) }}
{{- fail "route.downloads.enabled is true, but route.uploads.enabled is false: the download serves the files the upload route stores and has nothing to serve without it; turn uploads on or turn downloads off" }}
{{- end }}
{{- /*
The local-only guard for both file switches. Until sign-in exists (S021) the
upload route takes a file from anyone who reaches the host and the download
serves every stored file to anyone who reaches the host, by walking the claim
IDs (threat model T-38, T-69). So the chart turns either switch on only for a
route host name that ends in `.localhost`: a name that resolves to the machine
itself and cannot be reached from another one. On kind the edge's port is bound
to 127.0.0.1 as well (infra/kind/cluster.yaml). S021 removes this guard when sign-in
exists. What it does not stop: a forwarded port, or the variable set by hand
outside the chart.
*/ -}}
{{- if or .Values.route.uploads.enabled .Values.route.downloads.enabled }}
{{- if not (hasSuffix ".localhost" .Values.route.hostname) }}
{{- fail (printf "route.uploads.enabled or route.downloads.enabled is true, but route.hostname %q does not end in .localhost: until sign-in exists (S021) the upload and download routes take and serve files for anyone who reaches the host, so the chart turns them on only for a name that resolves to this machine; use a *.localhost name or turn them off" .Values.route.hostname) }}
{{- end }}
{{- end }}
{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meridian.labels" "claims-api" | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "route.parentRef.name is required when route.enabled" .Values.route.parentRef.name }}
      namespace: {{ required "route.parentRef.namespace is required when route.enabled" .Values.route.parentRef.namespace }}
  hostnames:
    - {{ required "route.hostname is required when route.enabled" .Values.route.hostname }}
  rules:
    - backendRefs:
        - name: claims-api
          port: {{ .Values.port }}
---
{{- /*
Envoy buffers each request in full and answers 413 above the limit, so an
oversized body never reaches the Claims API.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: claims-api
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: claims-api
  requestBuffer:
    limit: {{ .Values.route.requestBufferLimit }}
{{- if .Values.route.uploads.enabled }}
---
{{- /*
The upload route (S070, T-38): the same host, Gateway, Service and port as the
route above, for POST to the two paths that take a claimant's file, and nothing
else. Its own BackendTrafficPolicy gives it a larger request buffer and a rate
limit; the route above keeps its 64 Ki for every other request.

Which route serves an upload path. The route above has no `matches`, which the
Gateway API reads as PathPrefix "/": every path satisfies it, the upload paths
too. A request that matches both goes to the more specific match. The Gateway
API's own precedence is Exact, then the longest PathPrefix, then method, headers
and query; a RegularExpression path is an implementation-specific match type,
and Envoy Gateway's own order of path matches (not checked against its
sources or a running proxy yet) is Exact, then RegularExpression, then
PathPrefix. So, if that holds, the regular
expressions below win over the prefix "/" and an upload never meets the 64 Ki
buffer. Only a cluster shows it (the plan's run on
kind: a body of 100 Ki to the upload path must get through, the same body to
/claims/CLM-0001/documents must be 413). A request that matches the regular
expression but not the method (a GET) falls back to the first route.

Why the match cannot take another path. Envoy matches the whole path (the query
string apart) against the expression, so `^...$` is the stricter reading and not
a different one. The expression names the claim ID's shape (CLM-, four digits:
models.py's pattern) and the literal `/files`; `/` is only in the literal
places, so no other segment, suffix, `..` or empty segment is inside the match
(tests/meridian/test_helm_uploads_route.py holds a list of paths that must not
match). A path that does not match is served by the first route, at 64 Ki. The
second match is the HTML twin of the first, the claimant's own page (the
documents route has /claimant/claims/{claim_id}/documents beside
/claims/{claim_id}/documents), behind the same switch.

The NetworkPolicies do not change. The Claims API's ingress from the edge
(networkpolicy.yaml, gated on route.enabled alone) names the edge's pods and the
chart's port, not a route: a second route to the same Service and port is the
same traffic from the same pods. tests/meridian/test_helm_uploads_route.py
renders the policies with uploads on and off and holds them equal.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claims-api-uploads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meridian.labels" "claims-api" | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.parentRef.name }}
      namespace: {{ .Values.route.parentRef.namespace }}
  hostnames:
    - {{ .Values.route.hostname }}
  rules:
    - matches:
        - method: POST
          path:
            type: RegularExpression
            value: ^/claims/CLM-[0-9]{4}/files$
        - method: POST
          path:
            type: RegularExpression
            value: ^/claimant/claims/CLM-[0-9]{4}/files$
      backendRefs:
        - name: claims-api
          port: {{ .Values.port }}
{{- if .Values.route.downloads.enabled }}
    {{- /*
    The download (S070 F4b): a second rule of this route, named so that a
    policy can target it alone, for GET and HEAD of
    /adjuster/claims/{claim_id}/files/{file_id}. The claim ID has the shape of the
    others and the file ID is the app's own (a lower-case, hyphenated UUID:
    file_download.FILE_ID_PATTERN, which a test holds equal to this). Why a rule of
    this route and not a third match of the first rule: a BackendTrafficPolicy
    attaches to a whole HTTPRoute or, by `sectionName`, to one rule of it, and the
    first rule's policy carries the uploads' 1,126,400 byte buffer and six
    requests a minute for every match of that rule. A GET of a file would spend
    the uploads' allowance and be buffered at the uploads' size. The Gateway
    API's HTTPRouteRule `name` (CRDs of the Gateway API v1.6.1 the pinned
    Envoy Gateway v1.9.2 chart installs) and the policy's `sectionName` ("HTTPRoute:
    HTTPRouteRule name", in the policy's CRD) were read there; neither was run
    on a cluster, nor was which of the route's policy and the rule's policy an
    Envoy Gateway applies to this rule ("only the most specific configuration
    takes effect", the policy CRD says of merging). The kind run reads it: 31
    GETs of a file in a minute must end in a 429 and an upload must still be
    counted by the uploads' limit alone. Should the rule's policy not attach, the
    route's own applies and the download is limited by the uploads' bucket,
    which is stricter, not looser. A route of its own would need no such
    reading, at the price of a second route to explain.
    */}}
    - name: downloads
      matches:
        - method: GET
          path:
            type: RegularExpression
            value: ^/adjuster/claims/CLM-[0-9]{4}/files/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        - method: HEAD
          path:
            type: RegularExpression
            value: ^/adjuster/claims/CLM-[0-9]{4}/files/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      backendRefs:
        - name: claims-api
          port: {{ .Values.port }}
{{- end }}
---
{{- /*
The upload route's own limits, in a policy of its own so that the first one is
not touched. The buffer is the app's UPLOAD_BODY_LIMIT_BYTES (values.yaml says
how the two are held equal): Envoy buffers a body up to it and answers 413 above
it. The rate limit is Local: Envoy's own token bucket, no extra service. A rule
with no clientSelectors applies to all traffic of the targeted route, so the
route has one bucket for every caller, six requests a minute by default, and
Envoy answers 429 past it. There is no caller identity to key on before
sign-in (S021): one busy claimant can use the whole allowance, and that is the
point, since it bounds how fast the store fills. With more than one Envoy proxy
pod each counts for itself.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: claims-api-uploads
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: claims-api-uploads
  requestBuffer:
    limit: {{ .Values.route.uploads.requestBufferLimit | quote }}
  rateLimit:
    local:
      rules:
        - limit:
            requests: {{ .Values.route.uploads.rateLimit.requests }}
            unit: {{ .Values.route.uploads.rateLimit.unit }}
{{- if .Values.route.downloads.enabled }}
---
{{- /*
The download rule's own limit (S070 F4b), a policy that targets the rule named
`downloads` of the uploads route and nothing else (`sectionName`; see the rule
above for what was read and what only a cluster shows). A local rate limit, as the
uploads': one bucket for every caller of the rule, per proxy pod, 30 a minute by
default. The buffer is the first route's own, 64Ki, and no larger: a GET has no
body, so the uploads' buffer is neither needed nor wanted here.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: claims-api-downloads
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: claims-api-uploads
      sectionName: downloads
  requestBuffer:
    limit: {{ .Values.route.requestBufferLimit }}
  rateLimit:
    local:
      rules:
        - limit:
            requests: {{ .Values.route.downloads.rateLimit.requests }}
            unit: {{ .Values.route.downloads.rateLimit.unit }}
{{- end }}
{{- end }}
{{- end }}
