# Values of the Meridian chart: what is true on any cluster. What is kind's
# (the gateway's mode, the route's host, the collector's address) is in
# infra/kind/values/meridian.yaml.
#
# No value here is a secret. Helm keeps the values of a release in a Secret of
# the namespace and this repository is public: a value names a Secret (and
# Kubernetes reads it), it never holds a password or a connection string.
# tests/meridian/test_helm_chart.py checks that.

# The image every container runs, one reference for all of them, from the
# command line (deploy.sh passes the image it just built):
#   digest      <repository>@<digest>, sha256: and 64 hex digits. The pinned
#               reference, and the only one for an image from a registry.
#   tag         <repository>:<tag>, accepted only with pullPolicy Never: a tag
#               names an image loaded into the node, and that image is never
#               pulled. A tag in a registry can be moved, a digest cannot.
# One of the two is required; a digest wins when both are set. A Job's name
# ends in the tag, or in the first 12 hex digits of the digest without one.
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# The port every service listens on, and its Service answers on. The
# in-cluster addresses are <scheme>://<service>.<release namespace>.svc:<port>,
# https for a service that sets `tls` below, http for the others.
port: 8000

# Who a service is, to the one it calls (S055, templates/certificates.yaml).
# Each workload that has an identity gets one cert-manager Certificate, in the
# Secret <name>-tls, with the URI spiffe://<trustDomain>/ns/<namespace>/sa/<name>.
# Both values are required and empty here: a cluster's values file sets them
# (kind's is infra/kind/values/meridian.yaml), and the chart fails while either
# is empty. There is no value that turns identity off.
#   trustDomain   the SPIFFE trust domain, a DNS name; no scheme, no path
#   issuer        the cert-manager issuer that signs the certificates:
#                   name   the issuer's name
#                   kind   ClusterIssuer or Issuer
identity:
  trustDomain: ""
  issuer:
    name: ""
    kind: ""

# How long each of those certificates lasts and when cert-manager renews it
# (S062, templates/_helpers.tpl: meridian.certificateLifetime checks both).
#   duration      whole hours and minutes (2160h, 1h30m; no days, no seconds).
#                 90 days by default, which is also the most the issuer's
#                 policy signs (maxDuration of meridian-services in
#                 infra/kind/manifests/certificate-policy.yaml): a duration
#                 above 2160h or below 1h, cert-manager's shortest, fails the
#                 render. It is always rendered, because the policy cannot
#                 decide a request that names none.
#   renewBefore   how long before the end cert-manager renews. Empty leaves it
#                 out and cert-manager's default stays, a third of the
#                 lifetime (30 days of 90); set, it must be shorter than
#                 duration and not under 5m (cert-manager's webhook refuses
#                 less) or the render fails.
# A service does not reload its certificate: from the smaller of 24 hours and a
# sixth of the certificate's lifetime before its end (RESTART_MARGIN and
# RESTART_FRACTION in src/meridian/platform/common/certlife.py) it reads the
# file again, and when the file holds a newer certificate /healthz answers 503
# and the kubelet restarts the container. That margin is the application's and
# no value here changes it. The services do not all start in the same minute:
# each is given a share of the margin from its place in the sorted list of
# services over their count (the first none, the last five sixths of six, as
# MERIDIAN_TLS_RESTART_SHARE, templates/_rollout.tpl) and looks at the file that
# share of a margin earlier, so the widest restart is one and five sixths of a
# margin before the end. The restarts are spread when the renewal comes before
# the earliest look: always with the default renewBefore (a third before the
# end, and the earliest look is 11/36 of the lifetime at most), and with a set
# one when it is longer than one and five sixths of the margin. A shorter
# renewBefore refuses nothing: the health rule reads the file, so a service
# whose look has passed stays healthy until the file holds the renewed
# certificate and then restarts, and the services whose look has passed restart
# together when the file changes, as all of them did before the spread. It
# costs the spread, never availability, and with less time left before the end.
# One hour with a renewBefore of 30m lets a run on kind watch a renewal, the
# 503 and the restart (infra/kind/README.md, "Who a service is").
certificate:
  duration: 2160h
  renewBefore: ""

# Where a service sends its traces and metrics (OTLP over HTTP), and the sweep
# its last pass's findings (S064). Empty: no variable, and none of them sends
# anything. The three Jobs send nothing whatever it holds.
#   otlpEndpoint  the collector's address. An https address needs caConfigMap,
#                 and the chart fails without it.
#   caConfigMap   the ConfigMap in the release's namespace that holds the
#                 collector's authority, the public certificate in its key
#                 ca.crt (`make up` makes it on kind, from the authority of
#                 infra/kind/manifests/telemetry-ca.yaml). Each service and the
#                 sweep mounts that key at /etc/meridian/telemetry-ca/ca.crt and trusts it
#                 through the SDK's OTEL_EXPORTER_OTLP_CERTIFICATE; the service's
#                 own CA (MERIDIAN_TLS_CA_FILE) is another authority and does
#                 not sign the collector's certificate. Empty with an https
#                 address fails the chart; set with an http address it fails too:
#                 a name that nothing reads would say the telemetry is encrypted.
telemetry:
  otlpEndpoint: ""
  caConfigMap: ""

database:
  # The Secrets Kubernetes reads, created out of band (infra/kind/up.sh). A
  # service's own is under `services` below, with the key `uri`. The owner's is
  # for the migration Job alone: the six services get a role that can neither
  # create nor alter anything, and the seed and the ingestion Jobs get a role of
  # their own each, which holds what their statements need and no more (T-25,
  # S063).
  ownerSecret: meridian-owner-db
  # The seed Job's role (policy_seed): the policy tables, nothing else.
  seedSecret: policy-seed-db
  # The ingestion Job's role (knowledge_ingest): the knowledge chunks, and one
  # insert-only row of the audit log.
  ingestSecret: knowledge-ingest-db
  # The upkeep Job's role (gateway_upkeep): five functions, no table
  # (close_reservation, credit_tenant, expire_ledger_batch, expire_audit_events
  # and count_audit_events_before). Only that Job holds it; the release's
  # workloads never do.
  upkeepSecret: gateway-upkeep-db
  # The CA that signed the database's certificate. The Secret also holds the
  # CA's private key, so the pods mount only ca.crt.
  caSecret: platform-db-ca

# The user and the group (one ID for both) every container runs as: the
# Dockerfile's USER. The pod's and the container's security context both take
# it from here, so the two cannot disagree. The chart refuses 0 (root).
#
# The security contexts themselves are not values: they are literals in
# templates/_helpers.tpl (meridian.podSecurityContext and
# meridian.containerSecurityContext). A value can be set from the command line
# or by another values file, and `--set securityContext.privileged=true` would
# then render a privileged container; a literal changes only with a reviewed
# change to the chart.
runAsId: 10001

# How many old ReplicaSets each Deployment keeps (S073): the services' and the
# rate store's. Kubernetes keeps ten without this value, each one a pod template
# that a rollback would start again. Two is one rollback target and the one
# before it; a whole number of at least 1, or the render fails. A ReplicaSet
# beyond the limit goes at the next rollout and does not come back, and the
# image only it named is then one nothing names (`make images` lists it).
revisionHistoryLimit: 2

# The only writable path of a pod: an emptyDir mounted at /tmp, on the node's
# disk (the default medium; a memory-backed one would count against the
# container's memory limit). A pod that fills it is evicted.
tmpSizeLimit: 16Mi

# The probes of every service: /healthz on the service's port. A service with
# `tls: true` is probed with scheme HTTPS (the template sets it): the kubelet
# presents no certificate, which the service accepts on /healthz alone.
probes:
  readiness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

# One Deployment, Service, ServiceAccount and PodDisruptionBudget of the same
# name per entry. `replicas` is the number of pods; the chart refuses more than
# one for model-gateway unless `rateStore.enabled` is true (without the store its
# rate windows live in one process, so each replica would allow the full limits:
# threat model T-45; with it they are shared). `env` is what the service
# sets besides its database URL (from `dbSecret`) and the collector's address.
# Each service's `resources` has a CPU request and a memory request and limit,
# and no CPU limit, on purpose: a request reserves what a service needs, while a
# limit throttles it even when the node has headroom. Memory has a limit, since
# a process that outgrows it must die instead of taking the node's memory.
# An item takes one of:
#   value        the string as it is
#   serviceUrl   <scheme>://<that service>.<release namespace>.svc:<port>
#   serviceHost  <that service>.<release namespace>.svc:<port>, the Host
#                header a caller sends (DNS rebinding protection)
#   serviceMap   {"<service>": <its serviceUrl>, ...}, in the order listed:
#                the registry's server IDs and where each is served (base URLs;
#                the client appends /mcp)
#   documentsDeadlineDays
#                `sweep.documentsDeadlineDays` below, as a string: one value
#                for the sweep and for the Claims API's status page (only the
#                Claims API's env uses it)
# The scheme is https for a service with `tls: true` and http for the others;
# the template reads it from the target's entry, so an address cannot disagree
# with what the service serves.
#
# `tls: true` says a service serves TLS and asks its callers for a certificate
# (S055). It is one value and nothing else: the template adds the uvicorn
# flags, the probes' scheme, the DNS name in the certificate and the prefix the
# service reads its callers' identity with. The chart fails for a service that
# another workload calls (a serviceUrl or a serviceMap names it) and does not
# set it. The Claims API has none: the edge
# calls it over plain HTTP (TLS at the edge is a backlog row), and it is a
# client only. Every service gets a certificate, a mount and the variables
# that name its files (MERIDIAN_TLS_*), the ones that call nobody too: /healthz
# watches the certificate's end through them.
services:
  # Takes a claim and has the Agent Runtime triage it. Reached from the edge
  # (the route below) and inside the cluster.
  claims-api:
    dbSecret: claims-api-db
    replicas: 1
    command:
      - uvicorn
      - --factory
      - meridian.workloads.claims_triage.app:create_app_from_env
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env:
      - name: MERIDIAN_RUNTIME_URL
        serviceUrl: agent-runtime
      - name: MERIDIAN_SWEEP_DOCUMENTS_DEADLINE_DAYS
        documentsDeadlineDays: true
    # Sized from cAdvisor on kind (2026-10-01): peak working set 66 MB after
    # two demo claims; the limit leaves about three times that.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi

  # Runs the triage graph and calls the Model Gateway. Cluster-internal: no
  # route.
  agent-runtime:
    dbSecret: agent-runtime-db
    replicas: 1
    tls: true
    command:
      - uvicorn
      - --factory
      - meridian.runtime.app:create_app_from_env
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env:
      - name: MERIDIAN_GATEWAY_URL
        serviceUrl: model-gateway
      - name: MERIDIAN_TOOL_SERVERS
        serviceMap: [policy-mcp, claims-mcp, knowledge-mcp]
    # Sized from cAdvisor on kind (2026-10-01): peak working set 87 MB after
    # two demo claims; the limit leaves about three times that.
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 256Mi

  # The one door to a model. Cluster-internal: no route. Its mode and
  # environment are the cluster's (infra/kind/values/meridian.yaml sets
  # MERIDIAN_GATEWAY_MODE and MERIDIAN_ENVIRONMENT).
  model-gateway:
    dbSecret: model-gateway-db
    replicas: 1
    tls: true
    command:
      - uvicorn
      - --factory
      - meridian.platform.gateway.app:create_app_from_env
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env: []
    # Sized from cAdvisor on kind (2026-10-01): peak working set 57 MB after
    # two demo claims; the limit leaves about three times that.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 192Mi

  # The three tool servers (MCP over HTTP at /mcp) are cluster-internal: no
  # route; the Agent Runtime calls each at the address in its
  # MERIDIAN_TOOL_SERVERS. Their numbers are the Agent Runtime's, measured from
  # cAdvisor on kind (2026-10-02) after demo claims and smoke runs.

  # policy_lookup and claim_history over the simulated policy store. Working
  # set 72 to 73 MB.
  policy-mcp:
    dbSecret: policy-mcp-db
    replicas: 1
    tls: true
    command:
      - uvicorn
      - --factory
      - meridian.platform.policy_mcp.app:create_app_from_env
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env:
      - name: MERIDIAN_ALLOWED_HOSTS
        serviceHost: policy-mcp
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 256Mi

  # add_claim_note and request_approval, the claims workload's own mutating
  # tools. Working set 72 to 86 MB.
  claims-mcp:
    dbSecret: claims-mcp-db
    replicas: 1
    tls: true
    command:
      - uvicorn
      - --factory
      - meridian.workloads.claims_triage.mcp_server.app:create_app_from_env
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env:
      - name: MERIDIAN_ALLOWED_HOSTS
        serviceHost: claims-mcp
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 256Mi

  # wording_search, hybrid search over the policy wordings. It embeds the query
  # through the Model Gateway. Working set 79 to 87 MB.
  knowledge-mcp:
    dbSecret: knowledge-mcp-db
    replicas: 1
    tls: true
    command:
      - uvicorn
      - --factory
      - meridian.platform.knowledge_mcp.app:create_app_from_env
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env:
      - name: MERIDIAN_ALLOWED_HOSTS
        serviceHost: knowledge-mcp
      - name: MERIDIAN_GATEWAY_URL
        serviceUrl: model-gateway
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 256Mi

# The edge route of the Claims API, the only one: the Agent Runtime and the
# Model Gateway have none and stay reachable only in the cluster. A request
# with another Host header (127.0.0.1:8088, a rebinding page) matches no route
# and gets 404 (threat model T-01). Off until a cluster's values turn it on and
# name the host and the Gateway it attaches to:
#   hostname    the name the route answers to
#   parentRef   the Gateway: {name, namespace}
route:
  enabled: false
  hostname: ""
  parentRef: {}
  # Envoy buffers each request in full and answers 413 above the limit, so an
  # oversized body never reaches the Claims API. 64Ki is the app's own limit
  # (SMALL_BODY_LIMIT_BYTES); the app still enforces it for chunked bodies.
  requestBufferLimit: 64Ki

# The Jobs run to completion: the migration as the database owner role, the seed
# and the ingestion each as a role of their own (database.*Secret above).
# deploy.sh renders and runs them one at a time (a Job's spec cannot change, so each image gets its
# own, named with the tag); the release never holds one, so each is off here
# and deploy.sh turns on the one it renders.
jobs:
  # Applies the SQL migrations: `meridian db migrate`. Each image runs them
  # once and the services start after it.
  migrate:
    enabled: false
    command: [meridian, db, migrate]
    backoffLimit: 1
    # A hung database connection ends the Job instead of blocking the deploy.
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 3600
    resources: &jobResources
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 192Mi

  # Loads the simulated policy store from the synthetic data the image carries:
  # `meridian db seed-policies`. deploy.sh runs it on every deploy, after the
  # migrations and before the services start: the load mirrors its source, so a
  # rerun changes nothing, and a claim that met an empty policy table would get
  # a stored proposal "policy not found", which is final. Only the seed's own
  # role (database.seedSecret) and the owner can write the store; the tool
  # servers' roles cannot.
  seed:
    enabled: false
    command:
      - meridian
      - db
      - seed-policies
      - --from
      - /opt/meridian/synthetic
    backoffLimit: 1
    # A hung database connection ends the Job instead of blocking the deploy.
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 3600
    resources: *jobResources

  # Embeds the policy wordings the image carries and replaces the knowledge
  # store with them: `meridian knowledge ingest`, with the embedding calls going
  # through the Model Gateway under the claims-triage tenant's limits. deploy.sh
  # runs it after the gateway has rolled out, at most once per image.
  #
  # No ttlSecondsAfterFinished, unlike the other two Jobs: the finished Job is
  # the record that this image's corpus is in the store. deploy.sh finds it and
  # skips the ingestion, which spends most of the tenant's tokens for a minute;
  # a Job that expired would make every deploy ingest again.
  #
  # The Job then reads the store back (`meridian knowledge verify`, S067: each
  # stored clause against the manifest-verified wording, exit 1 on a difference,
  # 2 when it cannot check), so one command line runs both and the Job fails when
  # either does: `&&` stops at the first failure and the shell's status is the
  # failing command's. The fixed string takes no input (the image has `sh`).
  # Built and tested without a cluster (tests/meridian/test_ingest_job_verify.py).
  ingest:
    enabled: false
    command:
      - sh
      - -c
      - >-
        meridian knowledge ingest --tenant claims-triage --from /opt/meridian/synthetic
        && meridian knowledge verify --from /opt/meridian/synthetic
    # No retry: a second pod straight after a failure would meet the token
    # window the first one filled. The next deploy is the retry.
    backoffLimit: 0
    # A hung database or gateway connection ends the Job instead of blocking
    # the deploy. Above ingest.MAX_TOTAL_WAIT_SECONDS (300), the longest the
    # command waits for the gateway, so it can end by itself and audit its
    # refusal.
    activeDeadlineSeconds: 360
    env:
      - name: MERIDIAN_GATEWAY_URL
        serviceUrl: model-gateway
    resources: *jobResources

  # The Model Gateway's upkeep command (S066): `meridian gateway` with `args`
  # after it, as the role gateway_upkeep (database.upkeepSecret), for one run
  # of one operator's change (close a reservation, credit a tenant, expire a
  # month, or list the open reservations). Off, and never part of the release:
  # `make gateway-upkeep ARGS="..."` (infra/kind/upkeep.sh) turns it on for one
  # `helm template`, gives the run a suffix of its own and applies the result
  # outside the release. Nothing schedules it: retention is the owner's call.
  #   args       a list of strings, the subcommand and its arguments; the chart
  #              refuses an empty list and renders each as a YAML string
  #   runSuffix  a DNS label of at most 32 characters that ends the Job's name,
  #              so a second run is a new Job (the image's tag does not change)
  upkeep:
    enabled: false
    command: [meridian, gateway]
    args: []
    runSuffix: ""
    # A failed change is read, not repeated blind.
    backoffLimit: 0
    # One connection and one transaction: a hung connection ends the Job.
    activeDeadlineSeconds: 120
    # A day: what keeps the output (and a refusal) for the morning after.
    ttlSecondsAfterFinished: 86400
    resources: *jobResources

# What the namespace may do on the network (templates/networkpolicy.yaml). The
# namespace denies all traffic; each workload is allowed what its configuration
# names: DNS, the database, the collector when it sets the collector's address
# (telemetry.otlpEndpoint; the sweep's too, S064), the rate store when the pod
# is given its address (the Model Gateway, when rateStore.enabled), and the
# services its environment calls. There is no list of calls here: the `env`
# items above are the one place a service names another, and the egress rules,
# and the other side's ingress, come from them. The rate store's own policy
# admits the gateway's pods and allows it no egress (templates/rate-store.yaml).
#   enabled   off renders no NetworkPolicy at all (the Jobs' included)
#   peers     what lies outside the chart. Each peer is
#               namespace   its namespace; omitted: the release's own
#               podLabels   the labels of its pods, all required
#               ports       [{port, protocol}] a rule allows
#             dns holds on any cluster. database, collector and edge are the
#             cluster's: the chart fails while the policy is on and one is
#             missing (the collector's only when telemetry.otlpEndpoint is
#             set, the edge's only when the route is on). The edge needs no
#             ports: it reaches the Claims API on `port`.
networkPolicy:
  enabled: true
  peers:
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# The scheduled sweep (templates/sweep.yaml explains how it runs).
sweep:
  schedule: "*/5 * * * *"
  # The role's Secret, never the owner's.
  dbSecret: claims-sweep-db
  # Whole calendar days from the claim's latest request for documents (the
  # owner's answer of 2026-10-03). The sweep acts on it and the Claims API's
  # status page names the day from it: both get it from this one value (the
  # Claims API's env item `documentsDeadlineDays`, above).
  documentsDeadlineDays: 14
  # Under half the period: a hung connection ends the pass, because the
  # CronJob's Forbid policy would otherwise skip every later run behind it.
  activeDeadlineSeconds: 120
  # The SDK's deadline for one export of the findings (S064), in SECONDS: the
  # unit of OTEL_EXPORTER_OTLP_TIMEOUT at the pinned exporter, which the pod
  # gets only when telemetry.otlpEndpoint is set. Retries run inside it. Above 0
  # and under activeDeadlineSeconds, or the chart fails.
  telemetryTimeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi

# The rate store (S066, T-45; templates/rate-store.yaml explains the objects): one
# Redis that holds the Model Gateway's two rate windows (requests in 10 seconds,
# tokens in a minute) for every gateway pod, so that two pods, in a rolling update
# or as replicas, do not each allow the full limits. Off by default; when it is
# on, the gateway is given its address and the guard on the gateway's replicas
# lets a second one through. Nothing is persisted: a restart of the store hands
# every tenant its windows again, as a restart of the gateway did. The store is
# restarted once for each renewal of its certificate (its liveness probe fails
# when the files on the volume are newer than the server, within about a minute
# of the kubelet writing them), because Redis reads its certificate only at
# start; its duration and renewal are the services' (`certificate`).
#   enabled     renders the store
#   image       the full reference, `<name>:<tag>@sha256:<64 hex digits>`: the
#               digest is required (the chart fails without one) because a tag
#               can be moved. Empty here: with `enabled` and no image the chart
#               fails and says so. It is the official image, run without its
#               entrypoint (the entrypoint would load the image's four modules)
#               and as its own user, uid 999 and gid 1000, which the chart
#               writes down as literals, as it does the rest of the hardening.
#               The image is pulled (IfNotPresent): image.pullPolicy is the
#               Meridian image's, which a cluster may load into its nodes.
#   secret      the Secret, made out of band (`make up` on kind), that holds two
#               keys. The chart never holds a password or a hash.
#                 uri        the gateway's address, which the gateway reads as
#                            MERIDIAN_GATEWAY_RATE_STORE_URL through a required
#                            reference (a missing Secret or key keeps its pod from
#                            starting). Its form is
#                              rediss://<user>:<password>@rate-store.<namespace>.svc:6379/0
#                            with the user and the password percent-encoded
#                            (`@ : / ? #` and the like). Its host is the very
#                            name of the store's Certificate, which the gateway
#                            verifies; its port is the store's
#                 users.acl  Redis's ACL file, which only the store's pod mounts
#               The chart cannot read the Secret, so it cannot check that the
#               file turns the `default` user off, that it gives the gateway's
#               user exactly the script's commands (EVALSHA, SCRIPT LOAD, TIME,
#               ZREMRANGEBYSCORE, ZRANGE, ZADD, PEXPIRE, HELLO)
#               on ~meridian:rate:* and nothing else (no CLIENT command: the
#               gateway's client no longer sends one), that the hash in it is the
#               password in `uri`, or that the password is percent-encoded there.
#               Whoever makes the Secret owns those checks. The file must also
#               hold the user `probe` (on, nopass, no key, no channel, exactly
#               PING): both of the store's probes ping as it and pass only on
#               PONG, which is how a store frozen by a script that never ends
#               is restarted; without it the store's pod is never Ready. On kind
#               `make deploy` compares the Secret's annotation
#               meridian.kind/rate-store-acl-rules with what `make up` writes,
#               and the hash of the Secret's own users.acl (password hash
#               masked) with the same, so a file edited under an annotation
#               that still matches is refused.
#               The store's NetworkPolicy is its only control before
#               authentication, so the chart fails with `enabled` and
#               `networkPolicy.enabled` false; and a values `env` item of any
#               service named MERIDIAN_GATEWAY_RATE_STORE_URL is refused.
#   resources   a CPU request and a memory request and limit, no CPU limit, as
#               for the services. The memory limit is the store's real bound:
#               `maxmemory` below does not stop this workload writing (the
#               gateway's script calls a command Redis checks memory for only
#               after it has written, so a full store still admits it), so the
#               limit is what ends a store that grows. What can grow it: at most
#               the admissions of a minute per tenant (about six times the
#               request limit, 140 entries of about 100 bytes with the
#               registry's numbers) and the connections (up to 40 per gateway
#               pod, the size of its thread pool), whose buffers together
#               `maxmemory-clients 8mb` in redis.conf bounds (the probe user has
#               no password, so any holder of a services certificate with a
#               path to the port may open a session and fill its query buffer:
#               240 of them killed the store under this limit without that
#               line; templates/rate-store.yaml gives the measurement).
#               Measured on the pinned image
#               without modules, over TLS, read-only, as uid 999: 12 MB resident
#               when idle and a peak of 17 MB after 12,000 admissions from 40
#               connections on 3 tenants (2026-10-06), so 64Mi leaves nearly
#               four times that.
#   maxmemory   Redis's own ceiling, with `noeviction` (an evicting policy would
#               silently reset a tenant's window). In Redis's units (`32mb` is
#               32 MiB) and below the memory limit, or the chart fails. Half the
#               limit: the server, its client buffers and its fragmentation are
#               outside it.
rateStore:
  enabled: false
  image: ""
  secret: rate-store-credentials
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi
  maxmemory: 32mb
