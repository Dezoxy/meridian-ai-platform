      values:
        - otel-collector.client.observability.meridian
      required: true
    commonName:
      value: otel-collector-client
      required: true
    usages:
      - digital signature
      - client auth
  constraints:
    maxDuration: 2160h
---
apiVersion: policy.cert-manager.io/v1alpha1
