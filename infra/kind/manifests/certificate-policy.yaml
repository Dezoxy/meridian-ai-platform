# Who may ask for a certificate from the Meridian issuers (S056, threat T-88;
# S063, T-90): the policies approver-policy applies to every CertificateRequest.
# cert-manager's own approver is off (values/cert-manager.yaml) and
# approver-policy runs in its place (values/approver-policy.yaml); up.sh applies
# this file after the add-on and before manifests/service-ca.yaml and
# manifests/telemetry-ca.yaml, and waits for the five policies to be Ready.
#
# How approver-policy decides: a policy is appropriate for a request when its
# selector matches and the requester may `use` the policy (RBAC, checked in the
# request's namespace). If at least one appropriate policy permits the request
# it is approved; if there are appropriate policies and none permits it, it is
# denied; with no appropriate policy it is left neither approved nor denied. In
# `allowed`, a field that is left out is "deny all" and `*` stands for any
# string.
#
# A request that names no duration is not denied by a policy that sets
# `maxDuration`: in v0.28.0 (pkg/internal/approver/constraints/evaluator.go) the
# evaluator calls `.String()` on the request's missing duration, a nil pointer.
# controller-runtime recovers the panic, so the request is tried again for ever
# and is never Approved or Denied, and nothing is issued. That is why the
# chart's Certificates and service-ca.yaml name a duration.
#
#   meridian-services       the services' certificates: issuer
#                           `meridian-services`, requested in `meridian`; a URI
#                           of the form spiffe://meridian.kind/ns/meridian/sa/*
#                           (required, the chart's identity prefix), a DNS name
#                           of the form *.meridian.svc, the usages digital
#                           signature, client auth and server auth, and at most
#                           90 days (cert-manager's default lifetime), which
#                           the request must name. No CA and no common name:
#                           neither is allowed, so a request that sets one is
#                           denied
#   meridian-services-ca    the CA's own request, which the policy above does not
#                           permit (it is a CA, with a common name, signed by the
#                           self-signed issuer, in `cert-manager`): issuer
#                           `meridian-selfsigned`, requested in `cert-manager`,
#                           common name `meridian-services-ca` and `isCA`, at
#                           most a year, which the request must name. Without
#                           this policy the CA's renewal would wait for ever
#   meridian-deny-unlisted  selects a request for the two Meridian
#                           ClusterIssuers (`meridian-*`, kind ClusterIssuer,
#                           group cert-manager.io) from any namespace, and has
#                           no `allowed`. That is not a literal deny-all: a
#                           field left out of `allowed` allows nothing, but a
#                           request with no name, subject, usage or CA flag at
#                           all would still pass it, and no Certificate makes
#                           one. So a request for either issuer that no other
#                           policy permits is denied, not left waiting. It is
#                           not a wall around the cluster: a request for any
#                           other issuer, or for an Issuer other than the two
#                           below, meets no policy and is never approved
#                           (approver-policy acts only for the signers it is
#                           given, approveSignerNames, and the built-in approver
#                           is off), and nothing denies it
#   telemetry-ca            the request of the collector's authority (S063,
#                           manifests/telemetry-ca.yaml), which no policy above
#                           permits: issuer `telemetry-selfsigned`, kind Issuer,
#                           requested in `observability`, common name
#                           `telemetry-ca` and `isCA`, at most a year, which the
#                           request must name
#   otel-collector          the collector's server certificate: issuer
#                           `telemetry-ca`, kind Issuer, requested in
#                           `observability`; the DNS names
#                           otel-collector.observability.svc and
#                           otel-collector.observability.svc.cluster.local (at
#                           least one, and no other), the usages digital
#                           signature and server auth, at most 90 days, which
#                           the request must name. No URI, no address, no common
#                           name and no CA: none is allowed, so a request that
#                           sets one is denied
#
# The two policies of S063 select one namespaced Issuer each, in `observability`
# only, and that is also what denies: a request for either Issuer that its policy
# does not permit finds that policy appropriate (it is selected and bound) and
# none that permits, so it is denied, not left waiting; no policy of the deny
# kind is needed. A request in another namespace cannot name these Issuers at
# all: cert-manager looks an Issuer up in the request's own namespace, and there
# is none of that name outside `observability`, nor does a selector here match
# another namespace. A request for `meridian-services` from `observability` is
# the deny policy's, as from any namespace.
#
# Who is bound: the requester of every Certificate is cert-manager's own
# account, `system:serviceaccount:cert-manager:cert-manager`, and it is the only
# subject below. It may `use` meridian-services through a Role and RoleBinding in
# `meridian`, meridian-services-ca the same way in `cert-manager`,
# telemetry-ca and otel-collector the same way in `observability`, and
# meridian-deny-unlisted through a ClusterRole and ClusterRoleBinding. So the
# namespace limit is held twice: by the policy's selector and by where its
# binding is, and a request from another namespace meets only the policy that
# denies.
#
# What is left: whoever may create a Certificate in `meridian` has any service's
# identity issued (the policy checks the namespace and the URI prefix, not which
# service), and whoever may change a policy or its binding undoes the limit.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: meridian-services
spec:
  selector:
    issuerRef:
      name: meridian-services
      kind: ClusterIssuer
      group: cert-manager.io
    namespace:
      matchNames:
        - meridian
  allowed:
    uris:
      values:
        - spiffe://meridian.kind/ns/meridian/sa/*
      required: true
    dnsNames:
      values:
        - "*.meridian.svc"
    usages:
      - digital signature
      - client auth
      - server auth
  constraints:
    maxDuration: 2160h
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: meridian-services-ca
spec:
  selector:
    issuerRef:
      name: meridian-selfsigned
      kind: ClusterIssuer
      group: cert-manager.io
    namespace:
      matchNames:
        - cert-manager
  allowed:
    commonName:
      value: meridian-services-ca
      required: true
    isCA: true
  constraints:
    maxDuration: 8760h
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: meridian-deny-unlisted
spec:
  selector:
    # The two Meridian ClusterIssuers and no other. `*` stands for any string in
    # an issuerRef selector (approver-policy v0.28.0, predicate.go and
    # util/wildcard.go), so `meridian-*` is `meridian-selfsigned` and
    # `meridian-services`. A selector of `{}` would select a request for every
    # issuer in the cluster, and approver-policy, which acts for these two
    # signers only, could not write its decision on one for another.
    issuerRef:
      name: meridian-*
      kind: ClusterIssuer
      group: cert-manager.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meridian-services-use-policy
  namespace: meridian
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["meridian-services"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meridian-services-use-policy
  namespace: meridian
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meridian-services-use-policy
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meridian-services-ca-use-policy
  namespace: cert-manager
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["meridian-services-ca"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meridian-services-ca-use-policy
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meridian-services-ca-use-policy
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meridian-deny-unlisted-use-policy
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["meridian-deny-unlisted"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meridian-deny-unlisted-use-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meridian-deny-unlisted-use-policy
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: telemetry-ca
spec:
  selector:
    issuerRef:
      name: telemetry-selfsigned
      kind: Issuer
      group: cert-manager.io
    namespace:
      matchNames:
        - observability
  allowed:
    commonName:
      value: telemetry-ca
      required: true
    isCA: true
  constraints:
    maxDuration: 8760h
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: otel-collector
spec:
  selector:
    issuerRef:
      name: telemetry-ca
      kind: Issuer
      group: cert-manager.io
    namespace:
      matchNames:
        - observability
  allowed:
    dnsNames:
      values:
        - otel-collector.observability.svc
        - otel-collector.observability.svc.cluster.local
      required: true
    usages:
      - digital signature
      - server auth
  constraints:
    maxDuration: 2160h
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telemetry-ca-use-policy
  namespace: observability
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["telemetry-ca"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telemetry-ca-use-policy
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telemetry-ca-use-policy
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-collector-use-policy
  namespace: observability
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: ["otel-collector"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-collector-use-policy
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-collector-use-policy
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
