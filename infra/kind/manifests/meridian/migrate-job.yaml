# Applies the SQL migrations as the database owner role: `meridian db migrate`.
# deploy.sh replaces @IMAGE@ and @TAG@ (the first 12 hex digits of the image ID),
# so each image runs the migrations once and the services start after it. Only
# this Job reads the owner's credentials (Secret meridian-owner-db); the three
# services get a role that can neither create nor alter anything (T-25).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-migrate
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian-migrate
    app.kubernetes.io/part-of: meridian
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: meridian-migrate-@TAG@
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian-migrate
    app.kubernetes.io/part-of: meridian
spec:
  backoffLimit: 1
  # A hung database connection ends the Job instead of blocking the deploy.
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meridian-migrate
        app.kubernetes.io/part-of: meridian
    spec:
      restartPolicy: Never
      serviceAccountName: meridian-migrate
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: "@IMAGE@"
          imagePullPolicy: IfNotPresent
          command: [meridian, db, migrate]
          env:
            - name: MERIDIAN_MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meridian-owner-db
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: db-ca
              mountPath: /etc/meridian/db-ca
              readOnly: true
      volumes:
        # Only the public certificate: the Secret also holds the CA's private key.
        - name: db-ca
          secret:
            secretName: platform-db-ca
            items:
              - key: ca.crt
                path: ca.crt
