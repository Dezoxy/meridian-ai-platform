# Agent Runtime: runs the triage graph and calls the Model Gateway.
# Cluster-internal: no route.
# Plain YAML, server-side applied by infra/kind/deploy.sh (`make deploy`), which
# replaces @IMAGE@ with the locally built image. S019 turns the manifests of the
# skeleton into hardened Helm charts: no NetworkPolicy, PodDisruptionBudget or
# read-only root filesystem here yet. tests/meridian/test_kind_manifests.py ties
# every name below to the code.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime
  namespace: meridian
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: meridian
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: meridian
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: meridian
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/part-of: meridian
    spec:
      serviceAccountName: agent-runtime
      automountServiceAccountToken: false
      containers:
        - name: agent-runtime
          image: "@IMAGE@"
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - --factory
            - meridian.runtime.app:create_app_from_env
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MERIDIAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-runtime-db
                  key: uri
            - name: MERIDIAN_GATEWAY_URL
              value: http://model-gateway.meridian.svc:8000
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Sized from cAdvisor on kind (2026-10-01): peak working set 87 MB
          # after two demo claims; the limit leaves about three times that.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: db-ca
              mountPath: /etc/meridian/db-ca
              readOnly: true
      volumes:
        # Only the public certificate: the Secret also holds the CA's private key.
        - name: db-ca
          secret:
            secretName: platform-db-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: meridian
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: meridian
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-runtime
  ports:
    - name: http
      port: 8000
      targetPort: http
