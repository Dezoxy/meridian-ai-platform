# Loads the simulated policy store from the synthetic data the image carries:
# `meridian db seed-policies`, as the database owner role. deploy.sh replaces
# @IMAGE@ and @TAG@ (the first 12 hex digits of the image ID) and runs it on
# every deploy, after the migrations and before the services start: the load
# mirrors its source, so a rerun changes nothing, and a claim that met an empty
# policy table would get a stored proposal "policy not found", which is final.
# Only the owner's Secret (meridian-owner-db) can write the store; the tool
# servers' roles cannot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-seed
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian-seed
    app.kubernetes.io/part-of: meridian
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: meridian-seed-@TAG@
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian-seed
    app.kubernetes.io/part-of: meridian
spec:
  backoffLimit: 1
  # A hung database connection ends the Job instead of blocking the deploy.
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meridian-seed
        app.kubernetes.io/part-of: meridian
    spec:
      restartPolicy: Never
      serviceAccountName: meridian-seed
      automountServiceAccountToken: false
      containers:
        - name: seed
          image: "@IMAGE@"
          imagePullPolicy: IfNotPresent
          command:
            - meridian
            - db
            - seed-policies
            - --from
            - /opt/meridian/synthetic
          env:
            - name: MERIDIAN_MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meridian-owner-db
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: db-ca
              mountPath: /etc/meridian/db-ca
              readOnly: true
      volumes:
        # Only the public certificate: the Secret also holds the CA's private key.
        - name: db-ca
          secret:
            secretName: platform-db-ca
            items:
              - key: ca.crt
                path: ca.crt
