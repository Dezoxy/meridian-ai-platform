# The scheduled sweep (S052): `python -m meridian.workloads.claims_triage.sweep`,
# one pass every five minutes, as the database role claims_sweep (Secret
# claims-sweep-db, never the owner's). A pass refers a claim whose documents are
# overdue to an adjuster, fails a claim stranded in submitted or triaging, ends
# a run nobody resumes and deletes the checkpoints of a finished run. It needs
# PostgreSQL and nothing else: no call to a service, no registry, no model.
# deploy.sh replaces @IMAGE@ and applies this file with the services. Unlike a
# Job's, a CronJob's spec can change in place, and the next Job it starts
# carries the change, so its name has no image tag.
#   concurrencyPolicy Forbid  a pass that is still alive is not joined by
#                             another: the sweep's moves are compare-and-set,
#                             but two passes would only fight over the same rows
#   activeDeadlineSeconds     120, under half the period: a hung connection ends
#                             the pass, because Forbid would otherwise skip
#                             every later run behind it
#   startingDeadlineSeconds   a run the controller could not start within 120 s
#                             is skipped; the next one is five minutes away
#   backoffLimit 0            the next run is the retry
#   history limits            the last success and the last three failures stay
#                             for `kubectl logs`; make smoke reads the last one
#   ttlSecondsAfterFinished   a day, so a failure in the night is still there in
#                             the morning
# The pod takes the migration Job's shape: the 'db-ca' volume holds only the
# CA's public certificate, no service-account token, no extra privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-sweep
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian-sweep
    app.kubernetes.io/part-of: meridian
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: meridian-sweep
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian-sweep
    app.kubernetes.io/part-of: meridian
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: meridian-sweep
        app.kubernetes.io/part-of: meridian
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: meridian-sweep
            app.kubernetes.io/part-of: meridian
        spec:
          restartPolicy: Never
          serviceAccountName: meridian-sweep
          automountServiceAccountToken: false
          containers:
            - name: sweep
              image: "@IMAGE@"
              imagePullPolicy: IfNotPresent
              command: [python, -m, meridian.workloads.claims_triage.sweep]
              env:
                - name: MERIDIAN_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: claims-sweep-db
                      key: uri
                # Whole calendar days from the claim's latest request for
                # documents (the owner's answer of 2026-10-03).
                - name: MERIDIAN_SWEEP_DOCUMENTS_DEADLINE_DAYS
                  value: "14"
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  memory: 192Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: db-ca
                  mountPath: /etc/meridian/db-ca
                  readOnly: true
          volumes:
            # Only the public certificate: the Secret also holds the CA's private key.
            - name: db-ca
              secret:
                secretName: platform-db-ca
                items:
                  - key: ca.crt
                    path: ca.crt
