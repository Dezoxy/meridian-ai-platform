# NetworkPolicies of the `observability` namespace (S063): Prometheus and its
# operator, kube-state-metrics, Grafana, Tempo, Loki and the OpenTelemetry
# Collector. kind's platform, not the Meridian chart's. `make up` applies this
# before the first release of the namespace is installed, as it does the
# database's policy. Pod labels and ports are those `helm template` renders with
# infra/kind/values (read 2026-10-06; the Prometheus pods are the operator's and
# carry the two labels the chart's Service selects them by); the kind cluster's
# network plugin (kindnet) enforces both directions, and a rule by pod selector
# holds for traffic sent to a Service's address. Tested without a cluster until
# `make up` and `make smoke` have run on one.
#
# Ingress: nothing, except the rules below, each a peer and a port.
#   otel-collector   4318 TCP (OTLP over HTTP) from the pods of the namespace
#                    `meridian` and from the log agent's pods in `logging`
#                    (S064), and no other port from any namespace. The agent is
#                    admitted by namespace AND pod label (its name and its
#                    release's, log-agent), not by namespace: `logging` is its
#                    own, but nothing else in it is let in. It reads the output
#                    of every pod on its node and sends only what `meridian`'s
#                    pods wrote (values/log-agent.yaml), so "only Meridian's pods
#                    push to the collector" is true of what arrives, if not of
#                    the pod that sends it. A source that is let in can push
#                    under any name (T-68): the collector asks for no client
#                    certificate, and this rule limits who can reach it, not
#                    what they say. The rule for `meridian` selects the
#                    namespace and no pod label: the chart's own egress rules
#                    are what narrow it to the six services
#                    (its default-deny leaves every pod of `meridian` without
#                    egress, and only a pod that is given the collector's
#                    address has a rule for it, tests/meridian/test_helm_
#                    network_policy.py), and smoke's telemetrygen Jobs run in `meridian`
#                    with a policy of their own (smoke-networkpolicy.yaml). A
#                    pod of any other namespace (default, kube-system,
#                    cert-manager, this one, `logging` but for the agent) cannot
#                    push a trace, a log or a metric under a name that is not
#                    its own (T-68, T-84). The
#                    collector's gRPC receiver, 4317, is closed in this branch
#                    (values/otel-collector.yaml removes the receiver and the
#                    port) and admitted from no one: 4317 is admitted from no
#                    namespace and from no pod to the collector
#   tempo            4317 (OTLP gRPC) from the collector; 3200 (query) from
#                    Grafana
#   loki             3100 from the collector (OTLP) and from Grafana (query);
#                    7946 TCP and UDP from its own pods: the single binary
#                    joins the memberlist it makes through its own Service
#                    (join_members, with abort_if_cluster_join_fails: true).
#                    Whether the plugin sees that connection as coming from
#                    the pod itself is the one thing here that was not
#                    measured; a Loki pod that does not become ready, or logs
#                    that it could not join, is how the cluster would say not
#   grafana          3000 from Prometheus (its ServiceMonitor scrapes /metrics)
#   prometheus       9090 from Grafana (queries) and from the collector (the
#                    native OTLP receiver, /api/v1/otlp)
#   kube-state-      8080 from Prometheus (its ServiceMonitor)
#   metrics
#   prometheus-      10250 TCP from Prometheus alone. The one port of the operator
#   operator         serves its admission webhook and its metrics, which the
#                    chart's ServiceMonitor has Prometheus scrape (`https`), so
#                    Prometheus is the one peer. The API server alone calls the
#                    webhook (`failurePolicy: Ignore`: a call that fails is let
#                    through, silently), and it needs no rule. It calls from
#                    the node, and a call that starts on the node passes every
#                    NetworkPolicy of this cluster's network plugin: measured
#                    on kind 2026-10-07, the API
#                    server's call to a pod arrived from 10.244.0.1 (the node's
#                    address on the pod network) and reached a pod of
#                    `meridian`, whose ingress is denied by default, with no
#                    rule that admits it (seen on kind 2026-10-07, for a call by
#                    way of the pod proxy; a webhook call through the Service's
#                    address is not seen separately, and is taken to leave from
#                    the same place). The kind cluster has one node and the API
#                    server runs on it. A rule for the API server would be
#                    needed on a cluster with more than one node, or with a
#                    plugin that polices the node: one ipBlock peer, filled in
#                    the way the database's policy is. If a cold `make up`
#                    shows the operator's webhook unreachable (an object it
#                    should have refused is let through: it fails open, so
#                    nothing says so), that peer is added with the node's
#                    pod-network address. No other pod may reach the port (it
#                    was open to every pod of the cluster until S072); the two
#                    webhooks of cert-manager, which fail closed, are the ones
#                    a flood could stall: cert-manager-networkpolicy.yaml. This
#                    change is implemented here and tested without a cluster;
#                    it is not seen on kind. If Prometheus's target for the
#                    operator is down on the Targets page, this rule is wrong
# Prometheus scrapes itself, on 9090 and on its reloader's 8080 (the chart's
# self-monitoring ServiceMonitor). The rule above admits Grafana and the
# collector only, and none is written for the pod itself: a connection from a
# pod to its own address stays inside the pod's network namespace and no
# policy filters it. The Targets page must show both endpoints up; if one is
# down, a rule from the Prometheus pods to themselves is the fix.
# Not opened: Grafana's gossip port (one replica), Tempo's other receivers, the
# Job pods of the operator's admission hook (no one calls them), and every port
# of a pod that is not named above. `kubectl port-forward` to Grafana (smoke and
# `make grafana`) is not a connection into the pod's network from another pod:
# the container runtime opens it from inside the pod's own network namespace,
# so no ingress rule is written for it; if the cluster shows it blocked, the
# rule to add is port 3000 with no peer (it would admit every pod: decide it
# then). The kubelet's probes are not blocked by a policy.
#
# Egress is open, for every pod of the namespace, and that is a stated gap, not
# an oversight. Prometheus scrapes the kubelet's port 10250 and cAdvisor on the
# node and the API server on the node's own address, kube-state-metrics, the
# operator, the sidecars of Grafana and the operator itself call the API
# server, and none of those addresses is a pod that a selector can name; a
# half-right egress policy that broke a cold `make up` would be worse. What an
# open egress costs: a compromised pod here can reach every pod that accepts it,
# and what it can reach outside this namespace is what that pod's namespace
# admits (cert-manager's and the database's policies, and the chart's).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: meridian
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: log-agent
      ports:
        - port: 4318
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - port: 4317
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: kube-prometheus-stack
      ports:
        - port: 3200
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
      app.kubernetes.io/component: single-binary
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: kube-prometheus-stack
      ports:
        - port: 3100
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: single-binary
      ports:
        - port: 7946
          protocol: TCP
        - port: 7946
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      operator.prometheus.io/name: kube-prometheus-stack-prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: kube-prometheus-stack
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - port: 9090
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-operator
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  policyTypes: [Ingress]
  ingress:
    # Prometheus scrapes this port (the chart's ServiceMonitor, `https`): the
    # webhook and the metrics share it, so this is the one peer. Nor does the
    # API server need one: the API server calls from the node (the header says
    # why). No other pod.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - port: 10250
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/instance: kube-prometheus-stack
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - port: 8080
          protocol: TCP
