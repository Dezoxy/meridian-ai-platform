# NetworkPolicies of the `cert-manager` namespace (S063): cert-manager v1.21.2,
# approver-policy v0.28.0 and the CA's private key (service-ca.yaml). kind's
# platform, not the Meridian chart's. `make up` applies this before either
# release is installed, as it does the database's policy. Pod labels and ports
# are those `helm template` renders with infra/kind/values (read 2026-10-06);
# the kind cluster's network plugin (kindnet) enforces both directions, and a
# rule by pod selector holds for traffic sent to a Service's address. Tested
# without a cluster until `make up` and `make smoke` have run on one.
#
# Ingress: nothing, except
#   9402 TCP   to the controller's metrics, from Prometheus alone (the pods of
#              the Prometheus resource in `observability`). The ServiceMonitor
#              in cert-manager-metrics.yaml scrapes the controller only, and
#              the policy selects the pods by the labels that ServiceMonitor
#              selects the Service by, so the two cannot name different pods.
#              The cainjector's and the webhook's metrics port (9402 too) and
#              the approver's are scraped by nobody and stay closed
# The kubelet's probes (6080, 6060, 9403) are not blocked by a policy.
#
# 10250 TCP, the port of cert-manager's webhook and of approver-policy's, is
# admitted from no pod: no rule names it, and the two policies named for the
# webhooks below select those pods and hold no ingress rule, which denies every
# pod (the default-deny below does the same; they say it where a reader looks).
# Both webhooks are `failurePolicy: Fail`, so a webhook the API server cannot
# reach refuses every Certificate and every policy, and a flood from a pod
# could stall the issuing of certificates until it stopped: that is why no pod
# may call the port. The caller is the API server alone, and it needs no rule.
# It calls from the node, and a call that starts on the node passes every
# NetworkPolicy of this cluster's network plugin: measured on kind 2026-10-07,
# the API server's call to a pod arrived from the node's own address on the pod
# network (the first of the pod range), not from the address the egress rule's
# placeholder stands for, and reached a pod of `meridian`, whose ingress is
# denied by default, with no rule that admits it (seen on kind 2026-10-07, for
# a call by way of the pod proxy; a
# webhook call through the Service's address is not seen separately, and is
# taken to leave from the same place). What Kubernetes says: the NetworkPolicy
# concept page (kubernetes.io/docs/concepts/services-networking/network-policies/,
# read 2026-10-07 by the main session), in its list of the entities a Pod can
# communicate with, says of IP blocks: "(exception: traffic to and from the node
# where a Pod is running is always allowed, regardless of the IP address of the
# Pod or the node)". What this cluster shows beside it: ingress from the node
# passed a default-deny policy (the measurement above), and egress to the API
# server's Service address is refused without a rule (smoke's network-policy
# check prints that line on every run: seen). So on this plugin the page's "to"
# half does not hold for that path, and the egress rules below are not
# decorative. The kind cluster has one node and the API server
# runs on it. A rule would be needed on a cluster with more than one node (the
# API server may then call from another node), or with a plugin that polices
# the node; the rule is then one ipBlock peer, filled in the way the egress
# rule's address is (below). If a cold `make up` shows a webhook unreachable
# (no Certificate is issued, and smoke fails loudly), the rule comes back on
# 10250 with the node's pod-network address as its one peer, and with the node's
# published address as well when that is not the source: after the Service's
# translation the source of a call through a Service could be either, and it is
# not seen which. The order in which a wrong premise about the webhooks would
# show, in a cold run: cert-manager's release (its startup check Job calls the
# webhook), then approver-policy's apply (retried for two minutes, then it
# stops), then the database's install (the operator's webhooks fail closed too),
# and last, silently, the Prometheus operator's target (its webhooks are
# `Ignore`). This change is
# implemented in this file and tested without a cluster; it is not seen on
# kind: a cold `make up` and the issued Certificates are that test.
#
# Egress, for every pod of the namespace: DNS and the API server, nothing else.
# Every component only watches and writes API objects (the controller, the
# cainjector, the webhooks, the startup check Job and approver-policy), and
# the CA is a Secret, so there is no other peer: no ACME, no external issuer,
# and nothing in another namespace. The API server's rule is the database's
# (platform-db-networkpolicy.yaml): TCP 6443 to the API server's address alone.
# The policy is evaluated after the Service's address is translated to the
# node's own, which changes when the cluster is re-created, so this file does
# not hold it: it holds a placeholder that is not a CIDR (the API server
# refuses the file as it stands, so a plain `kubectl apply -f` of it cannot
# install a policy with a wrong address), and `make up` reads the addresses of
# the `kubernetes` EndpointSlice in `default`, validates each as an IPv4
# address and applies this file with one ipBlock of /32 for each, on every run,
# through the function that does the same for the database's policy. Until S063
# closed it the rule named the port and no peer, so a compromised pod of this
# namespace, whose controller reads every Secret of the cluster, could have
# sent them out through port 6443 of any host (the review found it); DNS to the
# cluster's DNS pods is the other way out and stays.
# `make deploy` and `make smoke` compare the database's policy with the
# endpoint; they do not compare this one. A stale address shows itself: if the
# node's address changes under a running cluster (Docker restarted),
# cert-manager's pods lose the API server and its Certificates stop being
# issued; `make up` fills the new address in.
# If a component turns out to need another peer, `make up` shows it as a
# release that does not become ready (the webhook) or a Certificate that stays
# pending; the cluster's first run of this file is its test. Not proved: that
# kindnet enforces an ipBlock egress rule after the Service's address is
# translated to the node's, and that cert-manager's pods still reach the API
# server with it, on a cluster made cold; `make up` and the issued
# Certificates are that test, and they were not run on this change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to: [{ipBlock: {cidr: API-SERVER-ADDRESS/32}}]
      ports:
        - port: 6443
          protocol: TCP
---
# No `ingress` key: no pod reaches this webhook. Only the API server does, from
# the node, and the node needs no rule (the header says why, and what to do if
# a cold `make up` shows otherwise).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: cert-manager
  policyTypes: [Ingress]
---
# No `ingress` key: as for cert-manager's webhook above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: approver-policy-webhook
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app: cert-manager-approver-policy
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-metrics
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: cert-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - port: 9402
          protocol: TCP
