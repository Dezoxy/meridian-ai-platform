# NetworkPolicies of the `logging` namespace (S064): the log agent, one pod per
# node (values/log-agent.yaml). `make up` applies this before the agent's
# release is installed, with the other policies. The kind cluster's network
# plugin (kindnet) enforces both directions. The policies ran on the kind cluster
# on 2026-10-06 (twice): the agent resolved the collector's name, reached its
# port 4318 and smoke's line found its records in Loki. That the agent cannot
# reach the API server or Loki was not probed (the image has no shell, and a
# probe would need a pod of its own in `logging`).
#
# Two policies:
#   default-deny  selects every pod of the namespace and allows nothing, in
#                 either direction: no ingress and no egress. A pod added to
#                 `logging` later starts with no network.
#   log-agent     selects the agent's pods, by the two labels the chart gives them
#                 (its name, and the name of the release, `log-agent`), and
#                 allows egress to two peers and nothing else:
#                   DNS     the cluster's DNS pods (kube-system, k8s-app=kube-dns),
#                           UDP and TCP 53: to resolve the collector's name
#                   the collector  OTLP over HTTP, 4318/TCP, the pods of the
#                           collector in `observability` (by namespace AND pod
#                           label), the port the collector's own ingress admits the
#                           agent on (observability-networkpolicy.yaml)
# There is no ingress rule: the agent takes no call. It has no receiver and every
# port of the chart is off, but the pod does bind its health check (13133) and its
# own metrics (8888) on the pod's address; the policy denies ingress to them and
# no host port exists, so only the node's own traffic reaches them. The kubelet's
# probes of the health port are not filtered by a policy, so the readiness and
# liveness probes need no rule; the same goes for `kubectl logs`, which the
# kubelet serves. The agent cannot reach the API server,
# the database, Loki, Tempo, Prometheus, the services or any address outside the
# cluster: a compromised agent, which reads the output of every pod on its node,
# can send what it read to the collector (and so to Loki, where Grafana shows it)
# and to nothing else. The DNS pods answer any name, so a name can carry a few
# bytes out through the cluster's resolver; the policy does not stop that.
#
# What the egress rules allow is the same two peers as smoke's telemetrygen Jobs
# (smoke-networkpolicy.yaml) and the Meridian chart's collector rule
# (networkPolicy.peers in values/meridian.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: logging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: log-agent
  namespace: logging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: log-agent
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - port: 4318
          protocol: TCP
