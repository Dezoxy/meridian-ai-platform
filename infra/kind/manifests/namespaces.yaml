# Namespaces for the local platform. Helm creates none of them
# (no --create-namespace), so every release lands in one declared here.
# envoy-gateway-system: the Envoy Gateway controller, proxy and Gateway "edge".
# cnpg-system:          the CloudNativePG operator.
# cert-manager:         cert-manager and the CA's private key (service-ca.yaml),
#                       kept outside `meridian`.
# observability:        Prometheus, Grafana, Tempo, Loki, the collector.
# logging:              the log agent (S064): one pod per node that reads the
#                       node's pod-log directory and sends `meridian`'s lines to
#                       the collector. A namespace of its own, see the levels.
# meridian:             platform-db and, from S041, the Meridian applications.
#
# Pod Security Admission: warn and audit, never enforce, on every namespace
# below. These two never refuse a pod; they make the API server warn about, and
# audit, a pod that does not meet the level. A server-side dry run of enforce=restricted on `meridian` reported
# no violation among the pods of 2026-10-04, the database's included, but a
# first `make up` under enforce (CloudNativePG's init Job) was not tried, so
# enforce waits (the plan's backlog). The level is the strictest the namespace's
# pods meet as `helm template` renders them with infra/kind/values (S063, read on
# 2026-10-06, tested without a cluster; the server-side dry run is the main
# session's):
#   meridian:      restricted.
#   cert-manager:  restricted. The five pods of cert-manager v1.21.2 and
#                  approver-policy v0.28.0 (controller, cainjector, webhook,
#                  the startup check Job, approver-policy) meet it as rendered.
#   observability: restricted. The pods read as `helm template` renders them
#                  are tempo, otel-collector, loki, grafana, kube-state-metrics
#                  and the Prometheus operator. Two of them stopped
#                  `restricted` until the same step: `tempo` (its container
#                  set no allowPrivilegeEscalation: false, no
#                  capabilities.drop: [ALL] and no seccompProfile) and
#                  `otel-collector` (the same three, and no runAsNonRoot); their
#                  values files (values/tempo.yaml, values/otel-collector.yaml)
#                  now set those fields. The pods the Prometheus operator makes
#                  for the Prometheus resource are not rendered by Helm and
#                  were not read; on the running cluster the server-side dry
#                  run of enforce=restricted on this namespace (2026-10-06,
#                  after the first policies) warned about the collector and
#                  Tempo only, so the operator's Prometheus pods met
#                  `restricted`. The main
#                  session repeats that dry run after a `make up` with these
#                  values, and until it has, the level is tested without a
#                  cluster. node-exporter would have held the namespace at
#                  `privileged`: it uses the node's network and PID namespaces
#                  and mounts /proc and /sys from the host. It is turned off on
#                  kind (values/kube-prometheus-stack.yaml), because no alert
#                  rule and no dashboard of this repository reads a series of
#                  it, and a label that says `privileged` says nothing.
#   logging:       privileged. The one pod, the log agent (values/log-agent.yaml,
#                  read as `helm template` renders it on 2026-10-06), mounts
#                  /var/log/pods from the node. `baseline` forbids a hostPath
#                  volume, and the pod has one; `restricted` allows no hostPath
#                  volume either (its list of volume types has none). That is
#                  the only thing that stops `restricted`: the pod runs as the
#                  image's own user, 10001, with the group root as a
#                  supplementary group (containerd writes the files as
#                  root:root, mode 0640, which the group reads), every
#                  capability dropped and runAsNonRoot set, so the hostPath
#                  volume ALONE keeps it out of `restricted` (seen on kind on
#                  2026-10-06, third run: a server-side dry run of
#                  enforce=restricted on the namespace warned of "restricted
#                  volume types" alone; the header of the
#                  values file says what bounds it). Before G1 the pod ran as
#                  uid 0 and could not meet runAsNonRoot; the node's files were
#                  looked at on 2026-10-06 and the group was enough. Unlike
#                  node-exporter above, which a label would have misdescribed
#                  for nothing in return, this pod is the owner's decision
#                  (2026-10-06) and stays, so the label says what it is. The
#                  pod is not in `observability`: it would make that namespace's
#                  `restricted` untrue of one of its pods, or force the whole
#                  namespace down to `privileged` for it. The label
#                  `privileged` warns of nothing, here or anywhere: it is a
#                  statement, not a control, and a second pod added to `logging`
#                  is not warned about. What bounds the pod is in the values
#                  file and in logging-networkpolicy.yaml, not in this label.
#   cnpg-system:   restricted. The one pod, the CloudNativePG operator's
#                  (chart 0.29.1), meets it as rendered: non-root, seccomp
#                  RuntimeDefault, no privilege escalation, every capability
#                  dropped, no host namespace, hostPath or hostPort, and an
#                  emptyDir and a Secret as its only volumes.
#   envoy-gateway-system: restricted. The controller's pod and the certgen Job
#                  (chart v1.9.2) meet it as rendered, by the same checks. The
#                  proxy pods are not in that render: the controller makes them
#                  at run time. Its source (v1.9.2) sets a restricted-compatible
#                  container context on the proxy and the shutdown manager
#                  (user 65532, non-root, no privilege escalation, every
#                  capability dropped, seccomp RuntimeDefault) and no host
#                  namespace, hostPath or hostPort: read, not seen.
#                  These two levels rest on a render of both charts' pods on
#                  2026-10-07, by a checker written by the render's author
#                  (host namespaces, hostPath, hostPort, privileged,
#                  capabilities, seccomp, non-root, privilege escalation,
#                  volume types), and are not confirmed by the API server. The
#                  server-side dry run, and a look at the namespace's warnings
#                  after a `make up`, come with the cluster batch.
#
# What the two labels do on kind, and what has none. The label audit records
# nothing on kind: no API server audit policy is configured (cluster.yaml sets
# none), so a pod above the level leaves no trace there. The label warn reaches
# the client that creates a workload (kubectl, helm); a pod made by a
# controller (a Deployment's ReplicaSet, the operators) is warned about in a
# response no one reads, and the controller drops it. Nothing stops a
# privileged pod or one on
# the node's network. cnpg-system and envoy-gateway-system carry Pod Security
# labels and no NetworkPolicy: the CloudNativePG operator, which holds the widest
# rights on the cluster, and Envoy Gateway's controller and proxy are outside it.
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: meridian
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
