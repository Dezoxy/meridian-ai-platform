# Namespaces for the local platform. Helm creates none of them
# (no --create-namespace), so every release lands in one declared here.
# envoy-gateway-system: the Envoy Gateway controller, proxy and Gateway "edge".
# cnpg-system:          the CloudNativePG operator.
# observability:        Prometheus, Grafana, Tempo, Loki, the collector.
# meridian:             platform-db and, from S041, the Meridian applications.
#
# Pod Security Admission on `meridian`: warn and audit at `restricted`, never
# enforce. These two never refuse a pod; they make the API server warn about,
# and audit, a pod that does not meet `restricted`. A server-side dry run of
# enforce=restricted reported no violation among the pods of 2026-10-04, the
# database's included, but a first `make up` under enforce (CloudNativePG's init
# Job) was not tried, so enforce waits (the plan's backlog).
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: Namespace
metadata:
  name: meridian
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
