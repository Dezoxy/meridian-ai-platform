  # ── Gaps, restarts and clearing (the baseline is the series' last value
  # before the window, however long ago) ────────────────────────────────────────
  # A series at 5 from 0 to 29m, no samples for 8 minutes (a laptop that slept),
  # then 5 again. Nothing was gained, so nothing may fire at 51m. A baseline that
  # looks back only 5 minutes finds none at 36m and counts the 5 as new.
  - name: a gap in the data does not make an old failure new
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth", meridian_tenant="t", meridian_agent="a"}'
        values: "5x29 _x8 5x25"
    alert_rule_test:
      - eval_time: 51m
        alertname: MeridianModelCredentialRefused
        exp_alerts: []

  - name: a gap in the data does not make an old budget refusal new
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="refused", meridian_reason="tenant-token-budget", meridian_tenant="tenant-a", meridian_agent="a"}'
        values: "5x29 _x8 5x25"
    alert_rule_test:
      - eval_time: 51m
        alertname: MeridianTenantBudgetUsedUp
        exp_alerts: []

  - name: after a gap only what the series gained counts
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth", meridian_tenant="t", meridian_agent="a"}'
        values: "5x29 _x8 8x25"
    alert_rule_test:
      - eval_time: 51m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "3 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"

  # Instance a stops at 10m, instance b (the restarted process) starts at 12m
  # with 2. a gained 3-1 and b gained 4, so 6, and nothing is counted twice.
  - name: a restart adds the two processes' gains and counts nothing twice
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth"}'
        values: "_ 1 1 1 1 1 3 3 3 3 3"
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-b", meridian_outcome="failed", meridian_reason="auth"}'
        values: "_x12 2 2 3 3 4 4 4 4"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "6 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"

  # One failure at 11m. It is in the window until 26m, where the start of the
  # window (11m) already holds it.
  - name: an alert clears once its failures are older than the window
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth"}'
        values: "0x10 1x50"
    alert_rule_test:
      - eval_time: 12m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "1 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"
      - eval_time: 25m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "1 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"
      - eval_time: 26m
        alertname: MeridianModelCredentialRefused
        exp_alerts: []

  # ── MeridianSweepStale ──────────────────────────────────────────────────────
  # The last success at 600 s: time() - 600 is 900 at 25 minutes (not over it)
  # and 960 at 26: the alert fires with no extra wait.
  - name: a last success over 900 seconds old fires at once
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "600x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: MeridianSweepStale
        exp_alerts: []
      - eval_time: 26m
        alertname: MeridianSweepStale
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: sweep-freshness
              namespace: meridian
              cronjob: meridian-sweep
            exp_annotations:
              summary: "The scheduled sweep has not succeeded for a quarter of an hour."
              description: "The sweep has not succeeded for 16m 0s, counted from its last success or, if it never succeeded, from its creation (proposed threshold: 15 minutes, three missed runs)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/database-failure.md"

  - name: a sweep that keeps succeeding stays quiet, whatever its age
    interval: 1m
    input_series:
      # One success per minute: the value is the sample's own time in seconds.
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x60"
      - series: 'kube_cronjob_created{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: MeridianSweepStale
        exp_alerts: []

  # A CronJob that never succeeded has no last-success series: its age counts.
  - name: a cronjob created over 900 seconds ago that never succeeded fires
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianSweepStale
        exp_alerts: []
      - eval_time: 16m
        alertname: MeridianSweepStale
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: sweep-freshness
              namespace: meridian
              cronjob: meridian-sweep
            exp_annotations:
              summary: "The scheduled sweep has not succeeded for a quarter of an hour."
              description: "The sweep has not succeeded for 16m 0s, counted from its last success or, if it never succeeded, from its creation (proposed threshold: 15 minutes, three missed runs)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/database-failure.md"

  - name: a cronjob created 5 minutes ago does not fire
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="meridian", cronjob="meridian-sweep"}'
        values: "1800x60"
    alert_rule_test:
      - eval_time: 35m
        alertname: MeridianSweepStale
        exp_alerts: []

  # ── MeridianRateStoreRestartLoop (S072) ─────────────────────────────────────
  # kube-state-metrics' restart counter, one sample a minute. A loop of about
  # every 2 minutes (the 256 held slots restart it every 70 to 90 seconds): the
  # counter gains 1 at minutes 3, 5 and 7. Two restarts are under the count, the
  # third fires it with no wait, and it ends once the restarts have left the
  # 15-minute window (the samples at the window's edge do not count).
  - name: a rate store that restarts three times in 15 minutes fires on the third and ends when they have left the window
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="rate-store-7d9c5b6f4-abcde", container="rate-store"}'
        values: "0 0 0 1 1 2 2 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3"
    alert_rule_test:
      - eval_time: 6m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []
      - eval_time: 7m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              namespace: meridian
              pod: rate-store-7d9c5b6f4-abcde
              container: rate-store
            exp_annotations:
              summary: "The rate store keeps restarting."
              description: "The rate store's container rate-store of pod rate-store-7d9c5b6f4-abcde in meridian restarted 3 times in the last 15 minutes (proposed threshold: 3). One restart is by design, a renewed certificate's or a start's liveness check; a loop resets every tenant's windows each time, while few calls come and the refusal alert stays quiet."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/rate-store.md"
      - eval_time: 15m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              namespace: meridian
              pod: rate-store-7d9c5b6f4-abcde
              container: rate-store
            exp_annotations:
              summary: "The rate store keeps restarting."
              description: "The rate store's container rate-store of pod rate-store-7d9c5b6f4-abcde in meridian restarted 3 times in the last 15 minutes (proposed threshold: 3). One restart is by design, a renewed certificate's or a start's liveness check; a loop resets every tenant's windows each time, while few calls come and the refusal alert stays quiet."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/rate-store.md"
      - eval_time: 20m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []

  # A certificate's renewal restarts the store once, and a start's liveness
  # check may add one: the two designed restarts, together, are under 3.
  - name: one restart does not fire the rate store restart alert
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="rate-store-7d9c5b6f4-abcde", container="rate-store"}'
        values: "0x5 1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []

  - name: a renewal's restart and a liveness restart after a start, two in all, do not fire the rate store restart alert
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="rate-store-7d9c5b6f4-abcde", container="rate-store"}'
        values: "0x3 1x5 2x30"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []
      # Both restarts (minutes 4 and 10) are inside this window: a threshold of
      # 2 would fire here; the evaluations at 8m and 25m see one each.
      - eval_time: 12m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []
      - eval_time: 25m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []

  # The window's far side: a restart at minutes 6, 18 and 30 has two of them in
  # any 15 minutes. The kubelet's back-off is at most 5 minutes, so a loop is
  # never this slow; the slowest restarts of one (every 5 minutes) fire it.
  - name: three restarts spread over more than 15 minutes do not fire the rate store restart alert
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="rate-store-7d9c5b6f4-abcde", container="rate-store"}'
        values: "0x5 1x11 2x11 3x10"
    alert_rule_test:
      # Two restarts (minutes 6 and 18) are inside this window: a threshold of 2
      # would fire here; the evaluations after it see one each.
      - eval_time: 18m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []
      - eval_time: 27m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []
      - eval_time: 35m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []

  # Per pod, not summed: a rollout replaces the pod, and the old pod's two
  # restarts (minutes 2 and 4, the designed two) and the new pod's one (minute
  # 10) are three in one window, but never three of one pod. A sum over the pods
  # would count them as a loop.
  - name: two restarts of an old pod and one of its replacement inside one window do not fire the rate store restart alert
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="rate-store-7d9c5b6f4-abcde", container="rate-store"}'
        values: "0 0 1 1 2 2 2"
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="rate-store-6c8d4f7b5-fghij", container="rate-store"}'
        values: "_x7 0 0 1x10"
    alert_rule_test:
      - eval_time: 12m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []

  - name: a loop at the kubelet's slowest back-off, every 5 minutes, fires the rate store restart alert
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="rate-store-7d9c5b6f4-abcde", container="rate-store"}'
        values: "0x4 1x4 2x4 3x25"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              namespace: meridian
              pod: rate-store-7d9c5b6f4-abcde
              container: rate-store
            exp_annotations:
              summary: "The rate store keeps restarting."
              description: "The rate store's container rate-store of pod rate-store-7d9c5b6f4-abcde in meridian restarted 3 times in the last 15 minutes (proposed threshold: 3). One restart is by design, a renewed certificate's or a start's liveness check; a loop resets every tenant's windows each time, while few calls come and the refusal alert stays quiet."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/rate-store.md"

  # Silence is not a loop: a cluster with no restart series (kube-state-metrics
  # down, or the store not deployed after `make up`) leaves nothing to fire.
  - name: no restart series at all does not fire the rate store restart alert
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []

  - name: another container's loop, or the store's name in another namespace, is not this alert's
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="meridian", pod="claims-api-5f6d7c8b9-xyzab", container="claims-api"}'
        values: "0 0 0 1 1 2 2 3 3 4 4 5x20"
      - series: 'kube_pod_container_status_restarts_total{namespace="observability", pod="rate-store-7d9c5b6f4-abcde", container="rate-store"}'
        values: "0 0 0 1 1 2 2 3 3 4 4 5x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianRateStoreRestartLoop
        exp_alerts: []

  # ── MeridianCertificateNotRenewed ───────────────────────────────────────────
  # The expiry series' value is a Unix time, and promtool's clock starts at 0, so
  # a value of 1814400 + 600 is a certificate 21 days (1814400 s) plus 10 minutes
  # from its end at t=0: it crosses below 21 days at t=600 s, strictly after
  # that second, so the first evaluation that sees it is the one at 11m. With a
  # `for` of 1h the alert fires at 71m.
  - name: a certificate under 21 days from its end for an hour fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      # Under 21 days since the 11th minute, but not yet for an hour.
      - eval_time: 70m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate claims-api in meridian ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # 1818600 is 21 days plus 70 minutes: at t=70m the certificate is exactly 21
  # days from its end, which is not under 21 days. It is under from 71m, so the
  # hour is over at 131m, and at 130m a `<=` would already have fired.
  - name: a certificate exactly 21 days from its end does not count
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1818600x140"
    alert_rule_test:
      - eval_time: 130m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 131m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate claims-api in meridian ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # A certificate 30 days from its end is where cert-manager renews it: due, not
  # yet late, so the alert stays quiet.
  - name: a certificate 30 days from its end stays quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "2592000x100"
    alert_rule_test:
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # Renewed after 30 minutes under the line: the value jumps to a new 90 days.
  - name: a certificate renewed before the hour is over does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x40 7776000x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 80m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # The CA's certificate is in cert-manager's namespace and counts.
  - name: the CA's certificate under 21 days from its end fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
              issuer_name: meridian-selfsigned
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate meridian-services-ca in cert-manager ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # The collector's certificate and its authority are in observability (S063),
  # and the issuers that signed them are namespaced Issuers.
  - name: the collector's certificate under 21 days from its end fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="otel-collector", namespace="observability", issuer_name="telemetry-ca", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: otel-collector
              namespace: observability
              issuer_name: telemetry-ca
              issuer_kind: Issuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate otel-collector in observability ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: the collector's authority under 21 days from its end fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="telemetry-ca", namespace="observability", issuer_name="telemetry-selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: telemetry-ca
              namespace: observability
              issuer_name: telemetry-selfsigned
              issuer_kind: Issuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate telemetry-ca in observability ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: a certificate in another namespace does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="someone-elses", namespace="default", issuer_name="other", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # cert-manager reports the expiry 0 for a Certificate that was never issued,
  # and 0 - time() is below any threshold: without the `> 0` this fires an hour
  # after the Certificate is created. MeridianCertificateNotReady is that
  # Certificate's alert.
  - name: a certificate that was never issued (expiry 0) does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "0x100"
    alert_rule_test:
      - eval_time: 61m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # Not issued for 30 minutes, then issued with an end 21 days and 10 minutes
  # (600 s) away from t=0, which is under 21 days from the first minute on: the
  # 0 does not count toward the hour, the issued certificate's time does. The
  # value becomes 1815000 at 30m, so the hour ends at 90m.
  - name: a certificate issued late is counted from its issue, not from before
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "0x29 1815000x100"
    alert_rule_test:
      - eval_time: 89m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate claims-api in meridian ends in 20d 22h 40m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # ── MeridianCertificateNotReady ─────────────────────────────────────────────
  # cert-manager reports one series per condition, 1 for the one that holds.
  # The first evaluation is at t=0, so a `for` of 15m ends at 15m.
  - name: a certificate that is not Ready for 15 minutes fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x40"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="Unknown"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateNotReady
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
              condition: "False"
            exp_annotations:
              summary: "A certificate is not Ready."
              description: "Certificate claims-api in meridian has reported Ready=False for 15 minutes (proposed threshold). A request that was denied, or one waiting for an approval, is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # A request nobody approves leaves the condition Unknown, and the CA's
  # certificate is in cert-manager's namespace.
  - name: the CA's certificate with an Unknown condition fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="Unknown"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianCertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
              issuer_name: meridian-selfsigned
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
              condition: Unknown
            exp_annotations:
              summary: "A certificate is not Ready."
              description: "Certificate meridian-services-ca in cert-manager has reported Ready=Unknown for 15 minutes (proposed threshold). A request that was denied, or one waiting for an approval, is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # The collector's certificate is in observability (S063): a request that no
  # policy permits, or that waits, leaves it not Ready.
  - name: the collector's certificate with an Unknown condition fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="otel-collector", namespace="observability", issuer_name="telemetry-ca", issuer_kind="Issuer", issuer_group="cert-manager.io", condition="Unknown"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="otel-collector", namespace="observability", issuer_name="telemetry-ca", issuer_kind="Issuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianCertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: otel-collector
              namespace: observability
              issuer_name: telemetry-ca
              issuer_kind: Issuer
              issuer_group: cert-manager.io
              condition: Unknown
            exp_annotations:
              summary: "A certificate is not Ready."
              description: "Certificate otel-collector in observability has reported Ready=Unknown for 15 minutes (proposed threshold). A request that was denied, or one waiting for an approval, is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: a Ready certificate stays quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateNotReady
        exp_alerts: []

  # Not Ready for 10 minutes, then Ready again: under the `for`.
  - name: a certificate that is Ready again within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "1x10 0x30"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x10 1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateNotReady
        exp_alerts: []

  - name: a certificate in another namespace that is not Ready does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="someone-elses", namespace="default", issuer_name="other", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateNotReady
        exp_alerts: []

  # ── MeridianCertificateMetricsMissing ───────────────────────────────────────
  # A cluster after `make up` and before `make deploy`: the CA's certificate is
  # there and the scrape is up, no Certificate is in `meridian`. Quiet.
  - name: the CA's series and a working scrape with no certificate in meridian stay quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "1x100"
    alert_rule_test:
      - eval_time: 0m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 90m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # The services' series are there and the CA's is not (a Service label change
  # would take all of them; this is the case that the CA's series, not a
  # service's, is the one watched). absent() has no samples from t=0, so the
  # `for` of 15m ends at 15m.
  - name: no series for the CA fires after 15 minutes even when a service's is there
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "1x100"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # No ServiceMonitor, or one that selects nothing: no series at all, and no
  # `up` for the job either. That is the case a guard on `up == 1` would hide.
  - name: no series at all, no target either, fires after 15 minutes
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", namespace="observability", instance="10.244.0.9:8080"}'
        values: "1x100"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # The controller stops: its series go stale. The last sample is at 10m;
  # Prometheus looks back 5 minutes (a sample exactly that old is out), so the
  # series is absent from 15m on and the `for` ends at 30m.
  - name: a CA series that goes stale fires 15 minutes after it is gone
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x10 _x90"
    alert_rule_test:
      - eval_time: 29m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # Missing for 10 minutes, then back: under the `for`.
  - name: a CA series that returns within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "_x10 7776000x90"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # The series is there and the scrape is down (up is 0).
  - name: a scrape of cert-manager that is down for 15 minutes fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "0x100"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              job: cert-manager
              namespace: cert-manager
              instance: "10.244.0.5:9402"
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # Down for 10 minutes (samples 0 to 10), up again from the 11th.
  - name: a scrape that is back within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "0x10 1x90"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # Another job that is down is not cert-manager's scrape.
  - name: another job's scrape that is down does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="kube-state-metrics", namespace="observability", instance="10.244.0.9:8080"}'
        values: "0x100"
    alert_rule_test:
      - eval_time: 60m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # ── MeridianCertificateApproverDown ─────────────────────────────────────────
  # The first evaluation is at t=0, so a `for` of 15m ends at 15m.
  - name: approver-policy with no available replica for 15 minutes fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-approver-policy"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateApproverDown
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              namespace: cert-manager
              deployment: cert-manager-approver-policy
            exp_annotations:
              summary: "A Deployment that issues certificates has no available replica."
              description: "Deployment cert-manager-approver-policy in cert-manager has had no available replica for 15 minutes (proposed threshold). Without cert-manager nothing is requested and without approver-policy nothing is approved, so no certificate is renewed."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: cert-manager's controller with no available replica fires too
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianCertificateApproverDown
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              namespace: cert-manager
              deployment: cert-manager
            exp_annotations:
              summary: "A Deployment that issues certificates has no available replica."
              description: "Deployment cert-manager in cert-manager has had no available replica for 15 minutes (proposed threshold). Without cert-manager nothing is requested and without approver-policy nothing is approved, so no certificate is renewed."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: both Deployments with a replica stay quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-approver-policy"}'
        values: "1x40"
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []

  # Down for 10 minutes (samples 0 to 10), a replica from the 11th: under the
  # `for`.
  - name: an approver that is back within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-approver-policy"}'
        values: "0x10 1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []

  # The two Deployments without which nothing is requested or approved, and no
  # other: cert-manager's webhook and cainjector are not this alert's.
  - name: another Deployment in cert-manager, or another namespace, does not fire
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-webhook"}'
        values: "0x40"
      - series: 'kube_deployment_status_replicas_available{namespace="meridian", deployment="cert-manager"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []

  # ── MeridianCertificateRenewalOverdue (S073) ────────────────────────────────
  # The renewal series' value is a Unix time, and promtool's clock starts at 0,
  # so a value of 600 is a renewal due at 10 minutes: it is past from t=600 s,
  # strictly after that second, so the first evaluation that sees it overdue is
  # the one at 11m. With a `for` of 1h the alert fires at 71m, and its value is
  # the seconds overdue: 71 * 60 - 600 = 3660, an hour and a minute.
  - name: a renewal overdue for more than an hour fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "600x100"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []
      # Overdue since the 11th minute, but not yet for an hour.
      - eval_time: 70m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []
      - eval_time: 71m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate's renewal is overdue."
              description: "Certificate claims-api in meridian was due for renewal 1h 1m 0s ago and has not been renewed; it has waited for an hour (proposed threshold). A request that waits for an approval or was denied, an approver-policy that hangs, or an issuer that is down is the usual cause; the Certificate stays Ready until its end."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # Overdue from 11m, renewed at 61m (the value jumps to a new 90 days): the
  # renewal waited 50 minutes, ten short of the hour, and the alert never fired.
  - name: a renewal overdue for 50 minutes does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "600x60 7776000x100"
    alert_rule_test:
      - eval_time: 60m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []
      - eval_time: 61m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []
      - eval_time: 120m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []

  # Firing at 71m and for as long as the renewal waits; the renewal completes at
  # 80m, when cert-manager sets the next renewal time months ahead, and the
  # alert clears at the next evaluation.
  - name: a renewal that completes clears the alert
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "600x79 7776000x100"
    alert_rule_test:
      - eval_time: 79m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate's renewal is overdue."
              description: "Certificate claims-api in meridian was due for renewal 1h 9m 0s ago and has not been renewed; it has waited for an hour (proposed threshold). A request that waits for an approval or was denied, an approver-policy that hangs, or an issuer that is down is the usual cause; the Certificate stays Ready until its end."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"
      - eval_time: 80m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []
      - eval_time: 120m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []

  # The three namespaces of the group: the chart's certificates, the CA's and the
  # collector's two (S063).
  - name: an overdue renewal fires in each of the three certificate namespaces
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "600x100"
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "600x100"
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="otel-collector", namespace="observability", issuer_name="telemetry-ca", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "600x100"
    alert_rule_test:
      - eval_time: 71m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate's renewal is overdue."
              description: "Certificate claims-api in meridian was due for renewal 1h 1m 0s ago and has not been renewed; it has waited for an hour (proposed threshold). A request that waits for an approval or was denied, an approver-policy that hangs, or an issuer that is down is the usual cause; the Certificate stays Ready until its end."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
              issuer_name: meridian-selfsigned
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate's renewal is overdue."
              description: "Certificate meridian-services-ca in cert-manager was due for renewal 1h 1m 0s ago and has not been renewed; it has waited for an hour (proposed threshold). A request that waits for an approval or was denied, an approver-policy that hangs, or an issuer that is down is the usual cause; the Certificate stays Ready until its end."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: otel-collector
              namespace: observability
              issuer_name: telemetry-ca
              issuer_kind: Issuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate's renewal is overdue."
              description: "Certificate otel-collector in observability was due for renewal 1h 1m 0s ago and has not been renewed; it has waited for an hour (proposed threshold). A request that waits for an approval or was denied, an approver-policy that hangs, or an issuer that is down is the usual cause; the Certificate stays Ready until its end."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: an overdue renewal of a certificate in another namespace does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="someone-elses", namespace="default", issuer_name="other", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "600x200"
    alert_rule_test:
      - eval_time: 90m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []
      - eval_time: 130m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []

  # A renewal that is not yet due: the time is months ahead, as a fresh
  # certificate's is.
  - name: a renewal that is not yet due stays quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x200"
    alert_rule_test:
      - eval_time: 130m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []

  # A Certificate with no renewal time is expected to have the value 0 (the
  # expiry series does so for one never issued; not seen for this series), and
  # time() - 0 is above 0: without the `> 0` this fires an hour after the
  # Certificate is created.
  # MeridianCertificateNotReady is that Certificate's alert.
  - name: a certificate with no renewal time (value 0) does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_renewal_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "0x200"
    alert_rule_test:
      - eval_time: 61m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []
      - eval_time: 130m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []

  # No series at all (cert-manager's controller is down, the scrape is gone, a
  # label changed): nothing is overdue that this rule can see, and it fires
  # nothing. That case is MeridianCertificateMetricsMissing's, which watches the
  # CA's expiry series and the scrape's `up`.
  - name: no renewal series at all fires nothing
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", namespace="observability", instance="10.244.0.9:8080"}'
        values: "1x200"
    alert_rule_test:
      - eval_time: 130m
        alertname: MeridianCertificateRenewalOverdue
        exp_alerts: []

  # ── MeridianGatewayMetricsMissing (S064) ────────────────────────────────────
  # `_x4` is four minutes with no sample: the counter's first sample is at 4m,
  # as a process's first export is (it already holds what it counted, which an
  # increase() would lose). The recorded delta counts it, so the condition holds
  # from 4m and the `for` of 5m ends at 9m.
  - name: a completed call the runtime counted and no gateway series fires after 5 minutes
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x4 3x50"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 9m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
            exp_annotations:
              summary: "The Model Gateway's metrics are missing while the Agent Runtime counts its calls."
              description: "The Agent Runtime counted 3 model call(s) that completed in the last 15 minutes, and Prometheus has no sample of the Model Gateway's call counter in those 15 minutes. A completed call is one the gateway answered, so it counted it: its metrics are not arriving (proposed threshold: 15 minutes, for 5)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  - name: the gateway's series beside the runtime's keeps the alert quiet
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x4 3x50"
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gw-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x4 3x50"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []

  # The runtime's sample can land before the gateway's: the gateway's arrives at
  # 8m, the minute before the alert that was pending since 4m would fire, and it
  # never does.
  - name: a gateway series that arrives within the for does not fire
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x4 3x50"
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gw-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x8 3x50"
    alert_rule_test:
      - eval_time: 9m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []

  # The gateway's samples stop at 2m and start again at 17m, a gap of 14
  # minutes: shorter than the window of 15, so there is no minute at which the
  # gateway has no sample in the last 15. A window shorter than the gap fires.
  - name: a gap in the gateway's samples shorter than the window does not fire
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x4 3x50"
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gw-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "3x2 _x14 3x50"
    alert_rule_test:
      - eval_time: 13m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []

  # The gateway exported until 2m and then nothing; the runtime counts a call at
  # 20m (1 to 2). The window (5m, 20m] holds no gateway sample.
  - name: a gateway that went silent before a call completed fires 5 minutes after it
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "1x19 2x50"
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gw-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "3x2"
    alert_rule_test:
      - eval_time: 19m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 24m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 25m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
            exp_annotations:
              summary: "The Model Gateway's metrics are missing while the Agent Runtime counts its calls."
              description: "The Agent Runtime counted 1 model call(s) that completed in the last 15 minutes, and Prometheus has no sample of the Model Gateway's call counter in those 15 minutes. A completed call is one the gateway answered, so it counted it: its metrics are not arriving (proposed threshold: 15 minutes, for 5)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  # A call that failed is not one the gateway answered: only `completed` counts.
  - name: a failed call the runtime counted does not fire
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="failed", meridian_reason="unreachable", meridian_tenant="t", meridian_agent="a"}'
        values: "_x4 3x50"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []

  # An idle runtime: the counter has not moved for 15 minutes, so it gained
  # nothing, whatever the gateway reports. (The first 15 minutes hold the
  # series' own first sample, which counts; the check is after them.)
  - name: a runtime whose counter has not moved for 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "5x70"
    alert_rule_test:
      - eval_time: 45m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []

  - name: no runtime series at all does not fire, with or without the gateway
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", namespace="observability", instance="10.244.0.9:8080"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []

  # The runtime that counted 4 calls stops at 10m; its replacement (a new
  # instance) counts one at 29m. The new series' first sample counts as its
  # whole value, so the alert fires 5 minutes after it, at 34m, with 1, and not
  # with the old process's 4 (that one stopped counting at 10m, and was gone by
  # 25m).
  - name: a restarted runtime's first call counts, and the old process's does not again
    interval: 1m
    input_series:
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "4x10 _x70"
      - series: 'meridian_runtime_model_calls_total{job="agent-runtime", instance="rt-b", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x29 1x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 33m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts: []
      - eval_time: 34m
        alertname: MeridianGatewayMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
            exp_annotations:
              summary: "The Model Gateway's metrics are missing while the Agent Runtime counts its calls."
              description: "The Agent Runtime counted 1 model call(s) that completed in the last 15 minutes, and Prometheus has no sample of the Model Gateway's call counter in those 15 minutes. A completed call is one the gateway answered, so it counted it: its metrics are not arriving (proposed threshold: 15 minutes, for 5)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  # ── MeridianRuntimeMetricsMissing (S064) ────────────────────────────────────
  - name: a stored triage the Claims API counted and no runtime series fires after 5 minutes
    interval: 1m
    input_series:
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="stored", meridian_tenant="t"}'
        values: "_x4 2x50"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 9m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
            exp_annotations:
              summary: "The Agent Runtime's metrics are missing while the Claims API stores triages."
              description: "The Claims Triage App stored 2 triage(s) in the last 15 minutes, and Prometheus has no sample of the Agent Runtime's run counter in those 15 minutes. A stored triage came from a run the runtime counted: its metrics are not arriving (proposed threshold: 15 minutes, for 5)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  # Any outcome of the runtime's counter is a sample: a leg that failed was
  # counted too, and the counter is there.
  - name: a run counter of any outcome beside the triages keeps the alert quiet
    interval: 1m
    input_series:
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="stored", meridian_tenant="t"}'
        values: "_x4 2x50"
      - series: 'meridian_runtime_runs_total{job="agent-runtime", instance="rt-a", meridian_outcome="failed", meridian_reason="model-error", meridian_tenant="t", meridian_agent="a"}'
        values: "_x4 2x50"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []

  - name: a run series that arrives within the for does not fire
    interval: 1m
    input_series:
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="stored", meridian_tenant="t"}'
        values: "_x4 2x50"
      - series: 'meridian_runtime_runs_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x8 2x50"
    alert_rule_test:
      - eval_time: 9m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []

  - name: a gap in the runtime's samples shorter than the window does not fire
    interval: 1m
    input_series:
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="stored", meridian_tenant="t"}'
        values: "_x4 2x50"
      - series: 'meridian_runtime_runs_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "3x2 _x14 3x50"
    alert_rule_test:
      - eval_time: 13m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []

  - name: a runtime that went silent before a triage was stored fires 5 minutes after it
    interval: 1m
    input_series:
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="stored", meridian_tenant="t"}'
        values: "1x19 2x50"
      - series: 'meridian_runtime_runs_total{job="agent-runtime", instance="rt-a", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "3x2"
    alert_rule_test:
      - eval_time: 19m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 24m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 25m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
            exp_annotations:
              summary: "The Agent Runtime's metrics are missing while the Claims API stores triages."
              description: "The Claims Triage App stored 1 triage(s) in the last 15 minutes, and Prometheus has no sample of the Agent Runtime's run counter in those 15 minutes. A stored triage came from a run the runtime counted: its metrics are not arriving (proposed threshold: 15 minutes, for 5)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  # A triage that failed or that another request took over stored nothing.
  - name: a triage that failed or was taken over does not fire
    interval: 1m
    input_series:
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="failed", meridian_reason="runtime-unreachable", meridian_tenant="t"}'
        values: "_x4 2x50"
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="taken-over", meridian_tenant="t"}'
        values: "_x4 2x50"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []

  - name: a claims counter that has not moved for 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'meridian_claims_triages_total{job="claims-api", instance="ca-a", meridian_outcome="stored", meridian_tenant="t"}'
        values: "5x70"
    alert_rule_test:
      - eval_time: 45m
        alertname: MeridianRuntimeMetricsMissing
        exp_alerts: []

  # ── MeridianSweepNotReporting (S064) ────────────────────────────────────────
  # The CronJob's last success is a series whose value is its own time in
  # seconds, so it is always less than 900 s old. No gauge from the sweep: the
  # condition holds from 0 and the `for` of 5m ends at 5m.
  - name: a sweep that keeps succeeding with no findings in Prometheus fires after 5 minutes
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 4m
        alertname: MeridianSweepNotReporting
        exp_alerts: []
      - eval_time: 5m
        alertname: MeridianSweepNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              namespace: meridian
              cronjob: meridian-sweep
            exp_annotations:
              summary: "The sweep runs, and what its pass found does not arrive."
              description: "Cronjob meridian-sweep succeeded in the last 15 minutes, and Prometheus has no sample of what a pass found (meridian_sweep_last_pass) in those 15 minutes. The sweep sends its findings to the collector before it exits: the send is failing, or the CronJob was given no collector address (proposed threshold: 15 minutes, for 5)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  # A pass every five minutes (samples at 1m, 6m, 11m, ...), sent under one
  # instance ID: the series is the same from pass to pass.
  - name: a sweep that reports every five minutes stays quiet
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x60"
      - series: 'meridian_sweep_last_pass{job="claims-sweep", instance="claims-sweep", meridian_finding="failures"}'
        values: "_ 0 _x4 0 _x4 0 _x4 0 _x4 0 _x4 0 _x4 0 _x4 0 _x4 0"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianSweepNotReporting
        exp_alerts: []
      - eval_time: 40m
        alertname: MeridianSweepNotReporting
        exp_alerts: []

  # Passes at 1m, 6m and 11m, none at 16m and 21m (a collector that was down
  # for two passes), then 25m, 30m and 35m: a gap of 14 minutes, shorter than the
  # window of 15 (three passes), so the sweep is never without a sample in the
  # last 15. A window shorter than the gap fires.
  - name: a sweep that misses two passes and comes back stays quiet
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x60"
      - series: 'meridian_sweep_last_pass{job="claims-sweep", instance="claims-sweep", meridian_finding="failures"}'
        values: "_ 0 _x4 0 _x4 0 _x13 0 _x4 0 _x4 0"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianSweepNotReporting
        exp_alerts: []
      - eval_time: 24m
        alertname: MeridianSweepNotReporting
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianSweepNotReporting
        exp_alerts: []

  # One sample at 3m and none after: a new series' first sample counts, so the
  # condition does not hold from 3m on, and not until the window (t-15m, t] has
  # left 3m, at t=18m. It holds again from 18m and the `for` ends at 23m.
  - name: a single sample counts, and a pass that stops fires 20 minutes after it
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x60"
      - series: 'meridian_sweep_last_pass{job="claims-sweep", instance="claims-sweep", meridian_finding="failures"}'
        values: "_x3 0"
    alert_rule_test:
      - eval_time: 12m
        alertname: MeridianSweepNotReporting
        exp_alerts: []
      - eval_time: 22m
        alertname: MeridianSweepNotReporting
        exp_alerts: []
      - eval_time: 23m
        alertname: MeridianSweepNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              namespace: meridian
              cronjob: meridian-sweep
            exp_annotations:
              summary: "The sweep runs, and what its pass found does not arrive."
              description: "Cronjob meridian-sweep succeeded in the last 15 minutes, and Prometheus has no sample of what a pass found (meridian_sweep_last_pass) in those 15 minutes. The sweep sends its findings to the collector before it exits: the send is failing, or the CronJob was given no collector address (proposed threshold: 15 minutes, for 5)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  # A sweep that does not succeed is MeridianSweepStale's: 900 s from the
  # other side. The success at 0 is over 900 s old from 16m.
  - name: a sweep whose last success is over 900 seconds old is not this alert's
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianSweepNotReporting
        exp_alerts: []
      - eval_time: 40m
        alertname: MeridianSweepNotReporting
        exp_alerts: []

  - name: a cronjob that never succeeded is not this alert's
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianSweepNotReporting
        exp_alerts: []

  - name: another cronjob that succeeds does not fire
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="other"}'
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianSweepNotReporting
        exp_alerts: []

  # ── MeridianLogAgentNotReady (S064, G1) ─────────────────────────────────────
  # kube-state-metrics' two series of a DaemonSet: the pods scheduled (one a
  # node) and the pods ready. The labels of the left side stay on the alert.
  # Condition from 0, `for: 10m`: it fires at 10m and not before.
  - name: a log agent with no ready pod on its one node fires after 10 minutes
    interval: 1m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="logging", daemonset="log-agent-agent"}'
        values: "1x30"
      - series: 'kube_daemonset_status_number_ready{namespace="logging", daemonset="log-agent-agent"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: MeridianLogAgentNotReady
        exp_alerts: []
      - eval_time: 10m
        alertname: MeridianLogAgentNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              namespace: logging
              daemonset: log-agent-agent
            exp_annotations:
              summary: "The log agent has fewer ready pods than nodes to run on."
              description: "DaemonSet log-agent-agent in logging has had 0 ready pod(s), fewer than the nodes it is scheduled on, for 10 minutes (proposed threshold). The agent ships the services' output to Loki: lines written on a node with no ready agent are not sent, and a pod that is replaced starts each file at its end."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  - name: two ready pods of three scheduled fire, and say how many are ready
    interval: 1m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="logging", daemonset="log-agent-agent"}'
        values: "3x30"
      - series: 'kube_daemonset_status_number_ready{namespace="logging", daemonset="log-agent-agent"}'
        values: "2x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: MeridianLogAgentNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              namespace: logging
              daemonset: log-agent-agent
            exp_annotations:
              summary: "The log agent has fewer ready pods than nodes to run on."
              description: "DaemonSet log-agent-agent in logging has had 2 ready pod(s), fewer than the nodes it is scheduled on, for 10 minutes (proposed threshold). The agent ships the services' output to Loki: lines written on a node with no ready agent are not sent, and a pod that is replaced starts each file at its end."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/telemetry-missing.md"

  - name: a log agent that is ready on every node stays quiet
    interval: 1m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="logging", daemonset="log-agent-agent"}'
        values: "1x40"
      - series: 'kube_daemonset_status_number_ready{namespace="logging", daemonset="log-agent-agent"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianLogAgentNotReady
        exp_alerts: []

  # Not ready for 8 minutes (a rollout, a node that took a while to pull the
  # image), ready again at 8m: the `for` of 10 minutes never ends.
  - name: a log agent that is back within 10 minutes stays quiet
    interval: 1m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="logging", daemonset="log-agent-agent"}'
        values: "1x40"
      - series: 'kube_daemonset_status_number_ready{namespace="logging", daemonset="log-agent-agent"}'
        values: "0x7 1x33"
    alert_rule_test:
      - eval_time: 9m
        alertname: MeridianLogAgentNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: MeridianLogAgentNotReady
        exp_alerts: []

  # A DaemonSet scheduled on no node has nothing to run: 0 of 0.
  - name: a log agent scheduled on no node is not this alert's
    interval: 1m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="logging", daemonset="log-agent-agent"}'
        values: "0x40"
      - series: 'kube_daemonset_status_number_ready{namespace="logging", daemonset="log-agent-agent"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianLogAgentNotReady
        exp_alerts: []

  # Silence reads as health (T-86): a DaemonSet that does not exist, or whose
  # series kube-state-metrics stopped serving, leaves nothing to compare.
  - name: no daemonset series at all does not fire
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianLogAgentNotReady
        exp_alerts: []

  - name: another namespace's daemonset that is not ready is not this alert's
    interval: 1m
    input_series:
      - series: 'kube_daemonset_status_desired_number_scheduled{namespace="kube-system", daemonset="kindnet"}'
        values: "1x40"
      - series: 'kube_daemonset_status_number_ready{namespace="kube-system", daemonset="kindnet"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianLogAgentNotReady
        exp_alerts: []
