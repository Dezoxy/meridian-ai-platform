# promtool unit tests for meridian.yaml; `make alerts` extracts the rules to
# meridian.rules.yaml beside this file and runs them (S024).
#
# A series' samples are one per minute from t=0: `_` is no sample, `10x3` is 10
# four times. The gateway series appear mid-run (`_x5` first) because that is
# what a process does: its first export already holds what it counted, which an
# increase() would lose. Evaluation steps are one minute, as in the file's
# default.
rule_files:
  - meridian.rules.yaml

evaluation_interval: 1m

# promtool evaluates the groups it is given no order for in a random one. The
# alerts read the recorded series, so the recording group goes first: otherwise
# an alert sees the value of the minute before, and a test on the minute an
# alert ends passes or fails by chance. (Prometheus itself runs the groups
# independently, so there an alert may lag the recording by one interval.)
group_eval_order:
  - meridian.gateway.recording
  - meridian.gateway
  - meridian.workloads
  - meridian.certificates

tests:
  # ── MeridianModelCallsFailing ───────────────────────────────────────────────
  - name: provider failures above 5 percent of 100 calls fire
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="timeout", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 10x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="completed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 90x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianModelCallsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway's calls are failing on the provider's side."
              description: "10% of the model calls that ended in the last 15 minutes failed with a timeout, an unavailable provider, a rate limit or a bad response (proposed threshold: more than 5 percent and at least 3 calls)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/provider-outage.md"

  - name: steady counters of a process that started at t=0 fire on what they gained
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="unavailable"}'
        values: "0+1x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="completed"}'
        values: "0+9x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: MeridianModelCallsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway's calls are failing on the provider's side."
              description: "10% of the model calls that ended in the last 15 minutes failed with a timeout, an unavailable provider, a rate limit or a bad response (proposed threshold: more than 5 percent and at least 3 calls)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/provider-outage.md"

  - name: 2 failed of 10 is under the count guard
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="timeout"}'
        values: "_x5 2x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="completed"}'
        values: "_x5 8x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianModelCallsFailing
        exp_alerts: []

  - name: 3 failed of 100 is under 5 percent
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="timeout"}'
        values: "_x5 3x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="completed"}'
        values: "_x5 97x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianModelCallsFailing
        exp_alerts: []

  - name: 3 failed of 40 is over both guards
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="timeout"}'
        values: "_x5 3x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="completed"}'
        values: "_x5 37x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianModelCallsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway's calls are failing on the provider's side."
              description: "7.5% of the model calls that ended in the last 15 minutes failed with a timeout, an unavailable provider, a rate limit or a bad response (proposed threshold: more than 5 percent and at least 3 calls)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/provider-outage.md"

  - name: a failed series that first appears mid-run with 7 fires it (increase() would lose it)
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="bad-response"}'
        values: "_x5 7x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="completed"}'
        values: "_x5 93x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianModelCallsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway's calls are failing on the provider's side."
              description: "7% of the model calls that ended in the last 15 minutes failed with a timeout, an unavailable provider, a rate limit or a bad response (proposed threshold: more than 5 percent and at least 3 calls)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/provider-outage.md"

  - name: a process that stopped exporting stops counting once the window has passed
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="timeout"}'
        values: "_x5 10x3"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="completed"}'
        values: "_x5 90x3"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianModelCallsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway's calls are failing on the provider's side."
              description: "10% of the model calls that ended in the last 15 minutes failed with a timeout, an unavailable provider, a rate limit or a bad response (proposed threshold: more than 5 percent and at least 3 calls)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/provider-outage.md"
      # The first export was at 5m: at 20m the start of the window (5m) holds it,
      # so what the series gained in the window is 0.
      - eval_time: 19m
        alertname: MeridianModelCallsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway's calls are failing on the provider's side."
              description: "10% of the model calls that ended in the last 15 minutes failed with a timeout, an unavailable provider, a rate limit or a bad response (proposed threshold: more than 5 percent and at least 3 calls)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/provider-outage.md"
      - eval_time: 20m
        alertname: MeridianModelCallsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianModelCallsFailing
        exp_alerts: []

  # ── MeridianModelCredentialRefused ──────────────────────────────────────────
  - name: a refused credential fires at once, other failures do not
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="auth", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 1x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "1 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"

  - name: a rejected call is not a refused credential
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="rejected"}'
        values: "_x5 4x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianModelCredentialRefused
        exp_alerts: []

  # ── MeridianGatewayInternalErrors ───────────────────────────────────────────
  - name: an internal failure fires, and so does a failure with no reason
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="internal"}'
        values: "_x5 1x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianGatewayInternalErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway failed a call for a reason of its own."
              description: "1 model call(s) in the last 15 minutes failed inside the gateway, not at a provider. A code or configuration fault is the usual cause; a recent release is the first suspect."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/rollback.md"

  - name: a failure with no reason label is an internal one
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed"}'
        values: "_x5 2x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianGatewayInternalErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "The Model Gateway failed a call for a reason of its own."
              description: "2 model call(s) in the last 15 minutes failed inside the gateway, not at a provider. A code or configuration fault is the usual cause; a recent release is the first suspect."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/rollback.md"

  - name: a provider timeout is not an internal failure
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="failed", meridian_reason="timeout"}'
        values: "_x5 9x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianGatewayInternalErrors
        exp_alerts: []

  # ── MeridianTenantBudgetUsedUp ──────────────────────────────────────────────
  - name: a tenant whose budget is used up fires with its tenant and reason
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="tenant-token-budget", meridian_tenant="tenant-a", meridian_agent="a"}'
        values: "_x5 2x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="tenant-cost-budget", meridian_tenant="tenant-b", meridian_agent="a"}'
        values: "_x5 1x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="tenant-request-rate", meridian_tenant="tenant-c", meridian_agent="a"}'
        values: "_x5 50x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="tenant-token-rate", meridian_tenant="tenant-d", meridian_agent="a"}'
        values: "_x5 50x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="special-data", meridian_tenant="tenant-e", meridian_agent="a"}'
        values: "_x5 50x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianTenantBudgetUsedUp
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              meridian_tenant: tenant-a
              meridian_reason: tenant-token-budget
            exp_annotations:
              summary: "A tenant's budget is used up and the gateway refuses its calls."
              description: "Tenant tenant-a had 2 call(s) refused in the last 15 minutes with tenant-token-budget. The refusal is the budget working; the question is whether the budget is right."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/budget-exhaustion.md"
          - exp_labels:
              severity: warning
              platform: meridian
              meridian_tenant: tenant-b
              meridian_reason: tenant-cost-budget
            exp_annotations:
              summary: "A tenant's budget is used up and the gateway refuses its calls."
              description: "Tenant tenant-b had 1 call(s) refused in the last 15 minutes with tenant-cost-budget. The refusal is the budget working; the question is whether the budget is right."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/budget-exhaustion.md"

  # ── MeridianGatewayRefusingByPolicy ─────────────────────────────────────────
  - name: five policy refusals of one reason fire, four or the rate and special-data reasons do not
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="no-route", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 5x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="agent-not-allowed", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 4x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="special-data", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 9x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="tenant-request-rate", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 9x40"
      - series: 'meridian_gateway_calls_total{job="model-gateway", meridian_outcome="refused", meridian_reason="tenant-token-rate", meridian_tenant="t", meridian_agent="a"}'
        values: "_x5 9x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: MeridianGatewayRefusingByPolicy
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              meridian_reason: no-route
            exp_annotations:
              summary: "The Model Gateway keeps refusing calls by policy."
              description: "5 call(s) in the last 15 minutes were refused with no-route (proposed threshold: 5). A caller the registry does not know, or a registry change that left a route without a deployment, would look like this."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/rollback.md"

  # ── MeridianServiceUnavailable ──────────────────────────────────────────────
  - name: a deployment at 0 replicas fires after 5 minutes, at 1 it does not
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="meridian", deployment="claims-api"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_available{namespace="meridian", deployment="agent-runtime"}'
        values: "1x20"
      - series: 'kube_deployment_status_replicas_available{namespace="observability", deployment="grafana"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: MeridianServiceUnavailable
        exp_alerts: []
      - eval_time: 6m
        alertname: MeridianServiceUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: service-availability
              namespace: meridian
              deployment: claims-api
            exp_annotations:
              summary: "A Meridian service has no available replica."
              description: "Deployment claims-api in meridian has had no available replica for 5 minutes (proposed threshold)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/rollback.md"

  # ── MeridianDatabaseNotReady ────────────────────────────────────────────────
  - name: a platform-db pod that is not ready fires, a ready one does not
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: "1x20"
      - series: 'kube_pod_status_ready{namespace="meridian", pod="platform-db-1", condition="true"}'
        values: "0x20"
      - series: 'kube_pod_status_ready{namespace="meridian", pod="platform-db-2", condition="true"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: MeridianDatabaseNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: database-availability
            exp_annotations:
              summary: "No platform-db pod is ready."
              description: "None of the platform-db pods has been ready for 2 minutes (proposed threshold), or kube-state-metrics reports none. Every service that needs the database fails with it."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/database-failure.md"

  - name: one ready platform-db pod among the unready is enough
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: "1x20"
      - series: 'kube_pod_status_ready{namespace="meridian", pod="platform-db-1", condition="true"}'
        values: "0x20"
      - series: 'kube_pod_status_ready{namespace="meridian", pod="platform-db-2", condition="true"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianDatabaseNotReady
        exp_alerts: []

  - name: no ready series at all fires while kube-state-metrics is up
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: MeridianDatabaseNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: database-availability
            exp_annotations:
              summary: "No platform-db pod is ready."
              description: "None of the platform-db pods has been ready for 2 minutes (proposed threshold), or kube-state-metrics reports none. Every service that needs the database fails with it."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/database-failure.md"

  - name: the alert is quiet while kube-state-metrics is down
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianDatabaseNotReady
        exp_alerts: []

  # ── Gaps, restarts and clearing (the baseline is the series' last value
  # before the window, however long ago) ────────────────────────────────────────
  # A series at 5 from 0 to 29m, no samples for 8 minutes (a laptop that slept),
  # then 5 again. Nothing was gained, so nothing may fire at 51m. A baseline that
  # looks back only 5 minutes finds none at 36m and counts the 5 as new.
  - name: a gap in the data does not make an old failure new
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth", meridian_tenant="t", meridian_agent="a"}'
        values: "5x29 _x8 5x25"
    alert_rule_test:
      - eval_time: 51m
        alertname: MeridianModelCredentialRefused
        exp_alerts: []

  - name: a gap in the data does not make an old budget refusal new
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="refused", meridian_reason="tenant-token-budget", meridian_tenant="tenant-a", meridian_agent="a"}'
        values: "5x29 _x8 5x25"
    alert_rule_test:
      - eval_time: 51m
        alertname: MeridianTenantBudgetUsedUp
        exp_alerts: []

  - name: after a gap only what the series gained counts
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth", meridian_tenant="t", meridian_agent="a"}'
        values: "5x29 _x8 8x25"
    alert_rule_test:
      - eval_time: 51m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "3 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"

  # Instance a stops at 10m, instance b (the restarted process) starts at 12m
  # with 2. a gained 3-1 and b gained 4, so 6, and nothing is counted twice.
  - name: a restart adds the two processes' gains and counts nothing twice
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth"}'
        values: "_ 1 1 1 1 1 3 3 3 3 3"
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-b", meridian_outcome="failed", meridian_reason="auth"}'
        values: "_x12 2 2 3 3 4 4 4 4"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "6 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"

  # One failure at 11m. It is in the window until 26m, where the start of the
  # window (11m) already holds it.
  - name: an alert clears once its failures are older than the window
    interval: 1m
    input_series:
      - series: 'meridian_gateway_calls_total{job="model-gateway", instance="gateway-a", meridian_outcome="failed", meridian_reason="auth"}'
        values: "0x10 1x50"
    alert_rule_test:
      - eval_time: 12m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "1 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"
      - eval_time: 25m
        alertname: MeridianModelCredentialRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: meridian
              slo: model-calls
            exp_annotations:
              summary: "A provider refused the gateway's credential."
              description: "1 model call(s) in the last 15 minutes failed because a provider refused the credential. The gateway holds no key: an expired login or a removed role assignment is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/secret-rotation.md"
      - eval_time: 26m
        alertname: MeridianModelCredentialRefused
        exp_alerts: []

  # ── MeridianSweepStale ──────────────────────────────────────────────────────
  # The last success at 600 s: time() - 600 is 900 at 25 minutes (not over it)
  # and 960 at 26: the alert fires with no extra wait.
  - name: a last success over 900 seconds old fires at once
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "600x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: MeridianSweepStale
        exp_alerts: []
      - eval_time: 26m
        alertname: MeridianSweepStale
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: sweep-freshness
              namespace: meridian
              cronjob: meridian-sweep
            exp_annotations:
              summary: "The scheduled sweep has not succeeded for a quarter of an hour."
              description: "The sweep has not succeeded for 16m 0s, counted from its last success or, if it never succeeded, from its creation (proposed threshold: 15 minutes, three missed runs)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/database-failure.md"

  - name: a sweep that keeps succeeding stays quiet, whatever its age
    interval: 1m
    input_series:
      # One success per minute: the value is the sample's own time in seconds.
      - series: 'kube_cronjob_status_last_successful_time{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0+60x60"
      - series: 'kube_cronjob_created{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: MeridianSweepStale
        exp_alerts: []

  # A CronJob that never succeeded has no last-success series: its age counts.
  - name: a cronjob created over 900 seconds ago that never succeeded fires
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="meridian", cronjob="meridian-sweep"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianSweepStale
        exp_alerts: []
      - eval_time: 16m
        alertname: MeridianSweepStale
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: sweep-freshness
              namespace: meridian
              cronjob: meridian-sweep
            exp_annotations:
              summary: "The scheduled sweep has not succeeded for a quarter of an hour."
              description: "The sweep has not succeeded for 16m 0s, counted from its last success or, if it never succeeded, from its creation (proposed threshold: 15 minutes, three missed runs)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/database-failure.md"

  - name: a cronjob created 5 minutes ago does not fire
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="meridian", cronjob="meridian-sweep"}'
        values: "1800x60"
    alert_rule_test:
      - eval_time: 35m
        alertname: MeridianSweepStale
        exp_alerts: []

  # ── MeridianCertificateNotRenewed ───────────────────────────────────────────
  # The expiry series' value is a Unix time, and promtool's clock starts at 0, so
  # a value of 1814400 + 600 is a certificate 21 days (1814400 s) plus 10 minutes
  # from its end at t=0: it crosses below 21 days at t=600 s, strictly after
  # that second, so the first evaluation that sees it is the one at 11m. With a
  # `for` of 1h the alert fires at 71m.
  - name: a certificate under 21 days from its end for an hour fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 10m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      # Under 21 days since the 11th minute, but not yet for an hour.
      - eval_time: 70m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate claims-api in meridian ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # 1818600 is 21 days plus 70 minutes: at t=70m the certificate is exactly 21
  # days from its end, which is not under 21 days. It is under from 71m, so the
  # hour is over at 131m, and at 130m a `<=` would already have fired.
  - name: a certificate exactly 21 days from its end does not count
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1818600x140"
    alert_rule_test:
      - eval_time: 130m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 131m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate claims-api in meridian ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # A certificate 30 days from its end is where cert-manager renews it: due, not
  # yet late, so the alert stays quiet.
  - name: a certificate 30 days from its end stays quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "2592000x100"
    alert_rule_test:
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # Renewed after 30 minutes under the line: the value jumps to a new 90 days.
  - name: a certificate renewed before the hour is over does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x40 7776000x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 80m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # The CA's certificate is in cert-manager's namespace and counts.
  - name: the CA's certificate under 21 days from its end fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
              issuer_name: meridian-selfsigned
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate meridian-services-ca in cert-manager ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # The collector's certificate and its authority are in observability (S063),
  # and the issuers that signed them are namespaced Issuers.
  - name: the collector's certificate under 21 days from its end fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="otel-collector", namespace="observability", issuer_name="telemetry-ca", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: otel-collector
              namespace: observability
              issuer_name: telemetry-ca
              issuer_kind: Issuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate otel-collector in observability ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: the collector's authority under 21 days from its end fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="telemetry-ca", namespace="observability", issuer_name="telemetry-selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 71m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: telemetry-ca
              namespace: observability
              issuer_name: telemetry-selfsigned
              issuer_kind: Issuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate telemetry-ca in observability ends in 20d 22h 59m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: a certificate in another namespace does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="someone-elses", namespace="default", issuer_name="other", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "1815000x100"
    alert_rule_test:
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # cert-manager reports the expiry 0 for a Certificate that was never issued,
  # and 0 - time() is below any threshold: without the `> 0` this fires an hour
  # after the Certificate is created. MeridianCertificateNotReady is that
  # Certificate's alert.
  - name: a certificate that was never issued (expiry 0) does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "0x100"
    alert_rule_test:
      - eval_time: 61m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []

  # Not issued for 30 minutes, then issued with an end 21 days and 10 minutes
  # (600 s) away from t=0, which is under 21 days from the first minute on: the
  # 0 does not count toward the hour, the issued certificate's time does. The
  # value becomes 1815000 at 30m, so the hour ends at 90m.
  - name: a certificate issued late is counted from its issue, not from before
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "0x29 1815000x100"
    alert_rule_test:
      - eval_time: 89m
        alertname: MeridianCertificateNotRenewed
        exp_alerts: []
      - eval_time: 90m
        alertname: MeridianCertificateNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
            exp_annotations:
              summary: "A certificate is close to its end and has not been renewed."
              description: "Certificate claims-api in meridian ends in 20d 22h 40m 0s; cert-manager should have renewed it 30 days before its end (proposed threshold: 21 days left, for an hour)."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # ── MeridianCertificateNotReady ─────────────────────────────────────────────
  # cert-manager reports one series per condition, 1 for the one that holds.
  # The first evaluation is at t=0, so a `for` of 15m ends at 15m.
  - name: a certificate that is not Ready for 15 minutes fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x40"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="Unknown"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateNotReady
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: claims-api
              namespace: meridian
              issuer_name: meridian-services
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
              condition: "False"
            exp_annotations:
              summary: "A certificate is not Ready."
              description: "Certificate claims-api in meridian has reported Ready=False for 15 minutes (proposed threshold). A request that was denied, or one waiting for an approval, is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # A request nobody approves leaves the condition Unknown, and the CA's
  # certificate is in cert-manager's namespace.
  - name: the CA's certificate with an Unknown condition fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="Unknown"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianCertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
              issuer_name: meridian-selfsigned
              issuer_kind: ClusterIssuer
              issuer_group: cert-manager.io
              condition: Unknown
            exp_annotations:
              summary: "A certificate is not Ready."
              description: "Certificate meridian-services-ca in cert-manager has reported Ready=Unknown for 15 minutes (proposed threshold). A request that was denied, or one waiting for an approval, is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # The collector's certificate is in observability (S063): a request that no
  # policy permits, or that waits, leaves it not Ready.
  - name: the collector's certificate with an Unknown condition fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="otel-collector", namespace="observability", issuer_name="telemetry-ca", issuer_kind="Issuer", issuer_group="cert-manager.io", condition="Unknown"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="otel-collector", namespace="observability", issuer_name="telemetry-ca", issuer_kind="Issuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianCertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: otel-collector
              namespace: observability
              issuer_name: telemetry-ca
              issuer_kind: Issuer
              issuer_group: cert-manager.io
              condition: Unknown
            exp_annotations:
              summary: "A certificate is not Ready."
              description: "Certificate otel-collector in observability has reported Ready=Unknown for 15 minutes (proposed threshold). A request that was denied, or one waiting for an approval, is the usual cause."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: a Ready certificate stays quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "1x40"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateNotReady
        exp_alerts: []

  # Not Ready for 10 minutes, then Ready again: under the `for`.
  - name: a certificate that is Ready again within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "1x10 0x30"
      - series: 'certmanager_certificate_ready_status{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="True"}'
        values: "0x10 1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateNotReady
        exp_alerts: []

  - name: a certificate in another namespace that is not Ready does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{name="someone-elses", namespace="default", issuer_name="other", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io", condition="False"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateNotReady
        exp_alerts: []

  # ── MeridianCertificateMetricsMissing ───────────────────────────────────────
  # A cluster after `make up` and before `make deploy`: the CA's certificate is
  # there and the scrape is up, no Certificate is in `meridian`. Quiet.
  - name: the CA's series and a working scrape with no certificate in meridian stay quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "1x100"
    alert_rule_test:
      - eval_time: 0m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 90m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # The services' series are there and the CA's is not (a Service label change
  # would take all of them; this is the case that the CA's series, not a
  # service's, is the one watched). absent() has no samples from t=0, so the
  # `for` of 15m ends at 15m.
  - name: no series for the CA fires after 15 minutes even when a service's is there
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="claims-api", namespace="meridian", issuer_name="meridian-services", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "1x100"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # No ServiceMonitor, or one that selects nothing: no series at all, and no
  # `up` for the job either. That is the case a guard on `up == 1` would hide.
  - name: no series at all, no target either, fires after 15 minutes
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", namespace="observability", instance="10.244.0.9:8080"}'
        values: "1x100"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # The controller stops: its series go stale. The last sample is at 10m;
  # Prometheus looks back 5 minutes (a sample exactly that old is out), so the
  # series is absent from 15m on and the `for` ends at 30m.
  - name: a CA series that goes stale fires 15 minutes after it is gone
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x10 _x90"
    alert_rule_test:
      - eval_time: 29m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              name: meridian-services-ca
              namespace: cert-manager
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # Missing for 10 minutes, then back: under the `for`.
  - name: a CA series that returns within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "_x10 7776000x90"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # The series is there and the scrape is down (up is 0).
  - name: a scrape of cert-manager that is down for 15 minutes fires
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "0x100"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              job: cert-manager
              namespace: cert-manager
              instance: "10.244.0.5:9402"
            exp_annotations:
              summary: "Prometheus has no metrics for the CA's certificate."
              description: "For 15 minutes (proposed threshold) there has been no expiry series for the Certificate meridian-services-ca in cert-manager, or Prometheus could not scrape cert-manager's controller. The alerts on a certificate that is not renewed or not Ready cannot fire without them."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  # Down for 10 minutes (samples 0 to 10), up again from the 11th.
  - name: a scrape that is back within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="cert-manager", namespace="cert-manager", instance="10.244.0.5:9402"}'
        values: "0x10 1x90"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # Another job that is down is not cert-manager's scrape.
  - name: another job's scrape that is down does not fire
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="meridian-services-ca", namespace="cert-manager", issuer_name="meridian-selfsigned", issuer_kind="ClusterIssuer", issuer_group="cert-manager.io"}'
        values: "7776000x100"
      - series: 'up{job="kube-state-metrics", namespace="observability", instance="10.244.0.9:8080"}'
        values: "0x100"
    alert_rule_test:
      - eval_time: 60m
        alertname: MeridianCertificateMetricsMissing
        exp_alerts: []

  # ── MeridianCertificateApproverDown ─────────────────────────────────────────
  # The first evaluation is at t=0, so a `for` of 15m ends at 15m.
  - name: approver-policy with no available replica for 15 minutes fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-approver-policy"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []
      - eval_time: 15m
        alertname: MeridianCertificateApproverDown
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              namespace: cert-manager
              deployment: cert-manager-approver-policy
            exp_annotations:
              summary: "A Deployment that issues certificates has no available replica."
              description: "Deployment cert-manager-approver-policy in cert-manager has had no available replica for 15 minutes (proposed threshold). Without cert-manager nothing is requested and without approver-policy nothing is approved, so no certificate is renewed."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: cert-manager's controller with no available replica fires too
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: MeridianCertificateApproverDown
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: meridian
              slo: certificate-validity
              namespace: cert-manager
              deployment: cert-manager
            exp_annotations:
              summary: "A Deployment that issues certificates has no available replica."
              description: "Deployment cert-manager in cert-manager has had no available replica for 15 minutes (proposed threshold). Without cert-manager nothing is requested and without approver-policy nothing is approved, so no certificate is renewed."
              runbook_url: "https://github.com/Dezoxy/meridian-ai-platform/blob/main/docs/operations/runbooks/certificate-expiry.md"

  - name: both Deployments with a replica stay quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-approver-policy"}'
        values: "1x40"
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []

  # Down for 10 minutes (samples 0 to 10), a replica from the 11th: under the
  # `for`.
  - name: an approver that is back within 15 minutes does not fire
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-approver-policy"}'
        values: "0x10 1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []
      - eval_time: 30m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []

  # The two Deployments without which nothing is requested or approved, and no
  # other: cert-manager's webhook and cainjector are not this alert's.
  - name: another Deployment in cert-manager, or another namespace, does not fire
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager-webhook"}'
        values: "0x40"
      - series: 'kube_deployment_status_replicas_available{namespace="meridian", deployment="cert-manager"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: MeridianCertificateApproverDown
        exp_alerts: []
