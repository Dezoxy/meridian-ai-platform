# Tempo 3.x in monolithic mode: one process, local storage, no Kafka (the chart
# README: "Monolithic mode still runs every component in one process and needs
# no Kafka"). Traces arrive over OTLP; the collector is the only sender.
tempo:
  retention: 24h
  # No usage reporting to Grafana Labs.
  reportingEnabled: false
  # The container meets the Pod Security level `restricted` (S063), which the
  # namespace warns and audits at. The chart's pod-level context already runs
  # it as user 10001, non-root (the image's own: `USER 10001:10001`); this adds
  # the container's fields, which the chart leaves empty. The root filesystem
  # is read-only: the traces and the WAL are under /var/tempo (the volume
  # below) and the image makes no other directory writable. The chart's own
  # example for this key enables it; the one place its values say it fails is
  # the query UI's container (`tempoQuery`), which is not deployed.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 448Mi
  # The one receiver (S072, contract M2): OTLP over gRPC on 4317, the collector's
  # hop, with TLS that asks the sender for a client certificate. The server
  # certificate and key are the Secret tempo-receiver-tls below (the Certificate
  # is in manifests/telemetry-ca.yaml; up.sh waits for it before this release).
  # The client CA is the same Secret's ca.crt: the telemetry authority, so the
  # collector's client certificate (otel-collector-client-tls) verifies and no
  # other chain does. A CA Issuer of cert-manager writes ca.crt into the Secret of
  # a certificate it signs; that is expected and seen only on the cluster.
  # TLS 1.3 is the floor, as the collector's own receiver has it. Reads and both
  # probes are on 3200 and are not touched: the chart's server block stays.
  #
  # The chart's other receivers were on by default and nothing uses them: OTLP
  # over HTTP (4318) and the four Jaeger ones. Each protocol is set to null here,
  # which Helm reads as removing the key. The `jaeger` key itself stays, with
  # `protocols: {}`: the chart's port templates (templates/_ports.tpl) read
  # `.Values.tempo.receivers.jaeger.protocols.*` unguarded, so `jaeger: null`
  # fails the render. So the rendered config holds NO Jaeger protocol and no OTLP
  # HTTP, but it does hold an empty `jaeger` receiver; whether Tempo 3.1.0 starts
  # with it is NOT established from files and is seen only on the cluster. The
  # Service still lists 9411, 55680 and 55681: the chart hardcodes those ports,
  # and no receiver listens behind them.
  receivers:
    jaeger:
      protocols:
        grpc: null
        thrift_binary: null
        thrift_compact: null
        thrift_http: null
    otlp:
      protocols:
        http: null
        grpc:
          endpoint: 0.0.0.0:4317
          tls:
            cert_file: /etc/tempo/receiver-tls/tls.crt
            key_file: /etc/tempo/receiver-tls/tls.key
            client_ca_file: /etc/tempo/receiver-tls/ca.crt
            min_version: "1.3"
  # Read-only, a directory and not a subPath (a subPath never sees a renewed
  # Secret). The pod's fsGroup (10001, the chart's) reads the 0440 files.
  extraVolumeMounts:
    - name: receiver-tls
      mountPath: /etc/tempo/receiver-tls
      readOnly: true
# The chart renders no Role, ClusterRole or binding for Tempo, and its
# configuration discovers nothing through the API server: memberlist carries a
# cluster label and no join list, and there is no Kubernetes discovery. So the
# service account's token is not mounted. One key turns it off in the
# ServiceAccount and in the pod. Whether the binary itself calls the API server
# is not something a render shows; the cluster run is what sees the pod start
# without the token.
serviceAccount:
  automountServiceAccountToken: false
# A small volume backs /var/tempo (the chart mounts nothing there otherwise).
persistence:
  enabled: true
  size: 2Gi
# The receiver's server certificate and the authority (see tempo.receivers). The
# mounts are under `tempo:`; the volumes are a root key of this chart.
extraVolumes:
  - name: receiver-tls
    secret:
      secretName: tempo-receiver-tls
      defaultMode: 288 # 0440
