# cert-manager approver-policy: decides which certificate requests the
# Meridian issuers sign (S056). cert-manager's own approver is switched off
# (values/cert-manager.yaml); the policies it applies are in
# manifests/certificate-policy.yaml. Everything not set here is the chart's
# default: one replica, the CRD installed (and kept when the release is
# uninstalled), a metrics Service and no ServiceMonitor.

app:
  # The signers approver-policy may approve and deny for: the two issuers in
  # manifests/service-ca.yaml and the two in manifests/telemetry-ca.yaml (S063),
  # and no other. The chart's default, an empty list, is every signer, and the
  # add-on's ClusterRole would then reach every issuer in the cluster. A
  # ClusterIssuer's signer is clusterissuers.cert-manager.io/<name>; a
  # namespaced Issuer's is issuers.cert-manager.io/<namespace>.<name>.
  approveSignerNames:
    - clusterissuers.cert-manager.io/meridian-services
    - clusterissuers.cert-manager.io/meridian-selfsigned
    - issuers.cert-manager.io/observability.telemetry-ca
    - issuers.cert-manager.io/observability.telemetry-selfsigned

# One small pod on a one-node cluster. The limit was measured on kind alone
# (about 30 MiB used); nobody has measured it on a larger cluster, with more
# CertificateRequests to decide.
# The chart (v0.28.0) has a readiness probe (app.readinessProbe.port) and no
# value for a liveness probe, and its schema refuses a key it does not know, so
# none is set here. The liveness probe comes from
# manifests/approver-policy-liveness.yaml, which up.sh applies server-side after
# this release is installed (S073). The image is pinned by digest in pins.env
# and passed by up.sh.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi
