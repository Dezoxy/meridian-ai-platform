# Values of the Meridian chart (infra/helm/meridian) on the kind cluster: only
# what is kind's. deploy.sh passes the image. No secret belongs here: Helm keeps
# a release's values in a Secret and this repository is public.

# `make deploy` loads the image into the node and tags it with the first 12 hex
# digits of its image ID, so the tag is the content's own name. Never: a missing
# image fails the pod instead of being looked up on Docker Hub under the same
# name.
image:
  pullPolicy: Never

# Traces and metrics go to the collector's HTTP port over TLS (4317 is gRPC and
# is closed on the collector; the exporter speaks HTTP). The collector's
# certificate comes from an authority of its own (manifests/telemetry-ca.yaml),
# whose public certificate `make up` publishes as the ConfigMap below in this
# namespace; the services mount it and trust it for the collector alone.
telemetry:
  otlpEndpoint: https://otel-collector.observability.svc.cluster.local:4318
  caConfigMap: telemetry-ca

# Who a service is, to the one it calls: the trust domain of the certificates'
# URIs and the issuer `make up` installs with cert-manager (manifests/service-
# ca.yaml). The chart fails without either.
identity:
  trustDomain: meridian.kind
  issuer:
    name: meridian-services
    kind: ClusterIssuer

# Who the policies name outside the chart (the chart's networkPolicy.peers).
# The labels are the ones the cluster's own pods carry.
networkPolicy:
  peers:
    # The CloudNativePG cluster `make up` installs, in the release's namespace.
    database:
      namespace: meridian
      podLabels:
        cnpg.io/cluster: platform-db
      ports:
        - port: 5432
          protocol: TCP
    # The collector's OTLP HTTP port, the one telemetry.otlpEndpoint names.
    collector:
      namespace: observability
      podLabels:
        app.kubernetes.io/name: opentelemetry-collector
      ports:
        - port: 4318
          protocol: TCP
    # The Envoy proxy pods of the Gateway `edge`.
    edge:
      namespace: envoy-gateway-system
      podLabels:
        gateway.envoyproxy.io/owning-gateway-name: edge

services:
  # Replay mode only: no provider is wired on kind yet.
  model-gateway:
    # One replica, the chart's default, and no `replicas` here: the laptop's
    # memory is the reason. The chart allows a second one now (it refuses it
    # only while the rate store below is off, T-45), because the store holds the
    # rate windows for every gateway pod; kind does not use that, and no load
    # test has run two.
    env:
      - name: MERIDIAN_GATEWAY_MODE
        value: replay
      - name: MERIDIAN_ENVIRONMENT
        value: kind

# The rate store (S066, T-45): one Redis, in this namespace, that holds the Model
# Gateway's two rate windows. `make up` makes the Secret below (the gateway's
# address, and Redis's ACL file with a user for the gateway, named by hash, and
# the probes' user, which has no password and can only PING: never a value here,
# and the file is mounted by the store alone). `make deploy`
# passes the image from infra/kind/pins.env (RATE_STORE_IMAGE, with --set-string,
# so the pin has one place and one Renovate reader), not a literal here. With the
# store on the gateway refuses every call it cannot count (a 503), so the store
# must be running for any model call.
rateStore:
  enabled: true
  secret: rate-store-credentials

# The Claims API on a *.localhost name, through the edge Gateway `make up`
# installs.
route:
  enabled: true
  hostname: claims.meridian.localhost
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  # Uploads (S070) stay off on kind: this is not set. To try them for one run,
  # add the next two lines (a second route for the file paths, with a 1,126,400
  # byte buffer and six requests a minute for the whole route, and the switch of
  # the app's route). Not before sign-in (S021) on a machine others reach.
  #   uploads:
  #     enabled: true
  # The adjuster's download of a stored file (S070 F4b) is off here too, and it is
  # its own switch: to try it as well, add `downloads:` with `enabled: true` beside
  # `uploads:` (a rule of that route for GET and HEAD of a file, 30 requests a
  # minute, and the app's route). The chart refuses either switch unless the host
  # name above ends in .localhost, as it does; the pages have no sign-in before S021.
