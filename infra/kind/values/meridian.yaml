# Values of the Meridian chart (infra/helm/meridian) on the kind cluster: only
# what is kind's. deploy.sh passes the image. No secret belongs here: Helm keeps
# a release's values in a Secret and this repository is public.

# `make deploy` loads the image into the node and tags it with the first 12 hex
# digits of its image ID, so the tag is the content's own name. Never: a missing
# image fails the pod instead of being looked up on Docker Hub under the same
# name.
image:
  pullPolicy: Never

# Traces go to the collector's HTTP port (4317 is gRPC; the exporter speaks
# HTTP).
telemetry:
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318

# Who a service is, to the one it calls: the trust domain of the certificates'
# URIs and the issuer `make up` installs with cert-manager (manifests/service-
# ca.yaml). The chart fails without either.
identity:
  trustDomain: meridian.kind
  issuer:
    name: meridian-services
    kind: ClusterIssuer

# Who the policies name outside the chart (the chart's networkPolicy.peers).
# The labels are the ones the cluster's own pods carry.
networkPolicy:
  peers:
    # The CloudNativePG cluster `make up` installs, in the release's namespace.
    database:
      namespace: meridian
      podLabels:
        cnpg.io/cluster: platform-db
      ports:
        - port: 5432
          protocol: TCP
    # The collector's OTLP HTTP port, the one telemetry.otlpEndpoint names.
    collector:
      namespace: observability
      podLabels:
        app.kubernetes.io/name: opentelemetry-collector
      ports:
        - port: 4318
          protocol: TCP
    # The Envoy proxy pods of the Gateway `edge`.
    edge:
      namespace: envoy-gateway-system
      podLabels:
        gateway.envoyproxy.io/owning-gateway-name: edge

services:
  # Replay mode only: no provider is wired on kind yet.
  model-gateway:
    env:
      - name: MERIDIAN_GATEWAY_MODE
        value: replay
      - name: MERIDIAN_ENVIRONMENT
        value: kind

# The Claims API on a *.localhost name, through the edge Gateway `make up`
# installs.
route:
  enabled: true
  hostname: claims.meridian.localhost
  parentRef:
    name: edge
    namespace: envoy-gateway-system
