# Loki as a single process on the filesystem, 24 h retention. Logs arrive
# through the OTLP endpoint (/otlp). Everything the chart enables for larger
# installs (caches, canary, gateway, self-monitoring, MinIO) is off; the
# chunks and results caches alone would ask for several GiB.
deploymentMode: Monolithic

loki:
  # One tenant, so no X-Scope-OrgID header is needed.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 24h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 640Mi
  persistence:
    enabled: true
    size: 2Gi
  # Rules sidecar: not needed until alerting (S024).
  sidecar: false

# The chart still defaults these to 3 replicas; only the single binary runs.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
minio:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: false
sidecar:
  rules:
    enabled: false
