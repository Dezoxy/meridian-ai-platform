# OpenTelemetry Collector: the single OTLP entry point for apps in the cluster.
# Applications send OTLP to otel-collector.observability:4317 (gRPC) or :4318
# (HTTP); the collector fans out to Tempo (traces), Prometheus (metrics) and
# Loki (logs), all over OTLP. The image (core distribution, pinned by digest)
# is set by up.sh from pins.env.
mode: deployment
replicaCount: 1

# Keep the service name short and stable for the apps that will use it.
fullnameOverride: otel-collector

# The chart's defaults also open Jaeger and Zipkin receivers and scrape the
# collector itself; the core distribution does not contain those components,
# and only OTLP is used here.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  # Since collector 0.1xx the exporters are named otlp_grpc and otlp_http
  # ("otlp" and "otlphttp" are deprecated aliases).
  exporters:
    debug: null
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # otlp_http appends /v1/metrics and /v1/logs to the endpoint.
    otlp_http/prometheus:
      endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
    otlp_http/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]
