# OpenTelemetry Collector: the single OTLP entry point for apps in the cluster.
# Applications send OTLP over HTTP with TLS to otel-collector.observability:4318
# (S063, T-90); the collector fans out to Tempo (traces), Prometheus (metrics)
# and Loki (logs), all over OTLP. The image (core distribution, pinned by
# digest) is set by up.sh from pins.env.
#
# The gRPC receiver (4317) is closed: nothing but smoke's telemetrygen used it,
# and that now sends over HTTP too. The collector's own hops to Tempo, Prometheus
# and Loki stay clear text: they are inside `observability`, and T-90 names the
# hop from the services to the collector.
#
# The server certificate is the Secret otel-collector-tls, which cert-manager
# makes from the Certificate in manifests/telemetry-ca.yaml (up.sh waits for it
# before this release). The collector re-reads the pair by itself: configtls
# reloads the files at a handshake once `reload_interval` has passed since the
# last read, so a renewal needs no restart. The kubelet refreshes the mounted
# files some time after the Secret changes, so a renewal reaches a handshake
# within about the interval plus that time.
mode: deployment
replicaCount: 1

# Keep the service name short and stable for the apps that will use it.
fullnameOverride: otel-collector

# The chart's defaults also open Jaeger and Zipkin receivers and scrape the
# collector itself; the core distribution does not contain those components,
# and only OTLP is used here. `otlp` is the gRPC port: switched off here, the
# chart leaves no Service port and no container port for it (the receiver
# below is removed too).
ports:
  otlp:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# The image runs as user 10001 (its Dockerfile at this pin: `USER 10001:10001`,
# `FROM scratch`; the chart's values name the same user), so the files of the
# Secret below are read through the pod's group: fsGroup with mode 0440 (288),
# as the services' Secrets (infra/helm/meridian, meridian.tlsVolume).
podSecurityContext:
  fsGroup: 10001

# The container meets the Pod Security level `restricted` (S063), which the
# namespace warns and audits at: the chart's own default is `{}`. The root
# filesystem is read-only because the image holds only the binary and the
# certificate bundle and the pod writes to no volume: the two mounts below are
# read-only, and no component of the configuration keeps files (no
# file_storage, no file exporter).
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true

# The collector calls no API server: its receivers, processors and exporters
# are OTLP, batch and memory_limiter, with no k8sattributes processor, no
# k8s_cluster or k8sobjects receiver and no resource detector (the chart's
# presets, which would add them and a ClusterRole, are all off). So the service
# account's token is not mounted.
serviceAccount:
  automountServiceAccountToken: false

# A directory mount, not a subPath: a subPath never sees the renewed Secret.
extraVolumes:
  - name: tls
    secret:
      secretName: otel-collector-tls
      defaultMode: 288 # 0440
extraVolumeMounts:
  - name: tls
    mountPath: /etc/otel-collector/tls
    readOnly: true

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        # Closed (see the top); a null removes the chart's default receiver.
        grpc: null
        http:
          endpoint: ${env:MY_POD_IP}:4318
          tls:
            cert_file: /etc/otel-collector/tls/tls.crt
            key_file: /etc/otel-collector/tls/tls.key
            reload_interval: 5m
            # TLS 1.3 only: configtls's default floor is 1.2 (its README at the
            # pinned release). The services' exporters are Python 3.13 and
            # telemetrygen is Go; both speak 1.3.
            min_version: "1.3"
  # Since collector 0.1xx the exporters are named otlp_grpc and otlp_http
  # ("otlp" and "otlphttp" are deprecated aliases).
  exporters:
    debug: null
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # otlp_http appends /v1/metrics and /v1/logs to the endpoint.
    otlp_http/prometheus:
      endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
    otlp_http/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]
