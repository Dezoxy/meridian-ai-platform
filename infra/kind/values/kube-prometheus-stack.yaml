# kube-prometheus-stack: Prometheus (with its operator and kube-state-metrics;
# node-exporter is off, see below) and Grafana (bundled subchart). Sized for a
# laptop.
# Release name is kube-prometheus-stack; services are named after it.

# No Alertmanager on kind (S024): Prometheus evaluates Meridian's rules
# (infra/kind/alerts) and shows what fires, and nobody is on call for a
# laptop. Routing and notification are designed, for the game day (S028).
alertmanager:
  enabled: false
windowsMonitoring:
  enabled: false

# kind runs the control plane as static pods that listen on the node's
# loopback; these four endpoints are not reachable and would show as down.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    # The four groups that read node-exporter's series (node_cpu_seconds_total,
    # node_network_up and the like) go with node-exporter, which is off below:
    # they would evaluate to nothing, and an alert that can never fire is worse
    # than none. `node` (node.rules) stays on: its first rule records
    # node_namespace_pod:kube_pod_info: from kube-state-metrics, which the
    # chart's other rules and dashboards use; its other four records read
    # node-exporter and record nothing here (a recording rule cannot fire).
    nodeExporterAlerting: false
    nodeExporterRecording: false
    kubePrometheusNodeRecording: false
    network: false

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  # Not the `secrets` collector (S063, threat model T-68): it is the chart's only
  # reason to give kube-state-metrics' ClusterRole a list and watch of Secrets in
  # every namespace, and it exists to report kube_secret_* series, which no rule
  # or dashboard here or in the chart reads (a test and the README say how that
  # was checked). The chart derives the rule from the collectors, so the rule
  # goes with the collector; every other collector stays as the chart has it.
  collectorsExclude:
    - secrets
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# node-exporter is off on kind (S063). It is the one pod of `observability` that
# needs the node's own network and PID namespaces and /proc and /sys from the
# host, which would hold the whole namespace's Pod Security level at
# `privileged` (manifests/namespaces.yaml), and nothing here reads a series of
# it: no alert rule and no dashboard of this repository uses a `node_*` series
# (a test keeps it so). The chart's own node-exporter dashboards (Node Exporter
# / Nodes, USE Method, and the AIX and Darwin ones) are not installed with it
# (forceDeployDashboards is false), so they show no data on kind because there
# are none; its four rule groups that read node-exporter are off above. The
# "Compute Resources / Node" dashboards read kube-state-metrics and cAdvisor,
# and stay. The block that configured it here
# (hostRootFsMount off, because Docker Desktop cannot propagate the host root
# mount, and its resources) went with it. Turn it back on when a rule needs a
# node's CPU, memory or disk, and then label `observability` `privileged`, or
# run it in a namespace of its own.
nodeExporter:
  enabled: false

prometheus:
  prometheusSpec:
    # Native OTLP receiver: the collector pushes metrics to
    # /api/v1/otlp/v1/metrics on the Prometheus service.
    enableOTLPReceiver: true
    retention: 24h
    retentionSize: 1GB
    # Without this, only ServiceMonitors that carry the Helm release label
    # are picked up.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 640Mi

grafana:
  # Admin user "admin", password from Secret grafana-admin (created by up.sh,
  # printed only by `make grafana-password`).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
  testFramework:
    enabled: false
  # Grafana 13 peaks at start while it migrates its database and provisions
  # the chart's dashboards; 320Mi was OOM-killed once on a clean `make up`.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  # The chart's defaults give Grafana's service account a ClusterRole that reads
  # every ConfigMap and Secret in the cluster, because the sidecars watch all
  # namespaces (measured: it could read the database roles' Secrets in namespace
  # meridian). Every dashboard and datasource, the chart's and ours (up.sh), is
  # in observability, so the sidecars read that namespace only. The chart's own
  # Role (rbac.namespaced) still grants Secrets there, whenever a sidecar is on:
  # the Prometheus account's token and the Helm release Secrets. So the chart
  # makes no Role at all and manifests/grafana-rbac.yaml grants ConfigMaps only.
  # rbac.create: false, not rbac.useExistingRole: a RoleBinding's roleRef cannot
  # change, so an existing cluster could not upgrade to a binding to another Role.
  rbac:
    create: false
  sidecar:
    # Both sidecars (dashboards, datasources) list every labelled ConfigMap at
    # start; 64Mi was OOM-killed in a loop on the first run.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 160Mi
    dashboards:
      searchNamespace: observability
      resource: configmap
    datasources:
      searchNamespace: observability
      resource: configmap
      # Prometheus keeps the chart's default datasource, uid "prometheus".
      # Alertmanager is off, so its datasource would point nowhere.
      alertmanager:
        enabled: false
  # Provisioned datasources with fixed uids; smoke.sh and future dashboards
  # refer to them by uid. In Grafana provisioning "$$" writes a literal "$".
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: false
          filterBySpanID: false
          customQuery: true
          query: '{service_name=~".+"} | trace_id="$${__span.traceId}"'
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            url: '$${__value.raw}'
            datasourceUid: tempo
            urlDisplayLabel: View trace
