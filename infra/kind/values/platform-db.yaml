# CloudNativePG Cluster "platform-db" in namespace meridian. One instance,
# PostgreSQL 17 with pgvector. The image (pinned by digest in pins.env) is set
# by up.sh with --set cluster.imageName. CloudNativePG generates the "app" role
# and its Secret platform-db-app; no credential is set here.
#
# The walking skeleton (S041) adds the database "meridian" and four roles; the
# three tool servers (S013, S046) add three more, the scheduled sweep (S052)
# one, the gateway's ledger upkeep (S066) one, and the seed and ingestion Jobs
# (S063) one each. Their passwords are in Secrets that up.sh creates before this
# release installs (CloudNativePG cannot reconcile a role whose Secret is
# missing); nothing secret is written here.
# The "app" database, role and Secret are untouched: changing initdb would not
# converge on an existing cluster.
# Without this the chart names the Cluster "platform-db-cluster".
fullnameOverride: platform-db

type: postgresql
mode: standalone
version:
  postgresql: "17"

cluster:
  instances: 1
  # A PodDisruptionBudget on a single instance would block node drains.
  enablePDB: false
  # No superuser Secret; the operator reaches PostgreSQL over the local socket.
  enableSuperuserAccess: false
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  initdb:
    database: app
    owner: app
  postgresql:
    # CloudNativePG puts these before its default catch-all
    # ("host all all all scram-sha-256"), in this order; its own local,
    # replication and pooler rules stay first. The server enforces TLS and the
    # database boundary, whatever a client's connection string says.
    pg_hba:
      # Plain-text connections are refused outright, not only by client sslmode.
      - hostnossl all all all reject
      # The eleven Meridian roles log in to the meridian database over TLS.
      - hostssl meridian meridian_owner,claims_api,agent_runtime,model_gateway,policy_mcp,claims_mcp,knowledge_mcp,claims_sweep,gateway_upkeep,policy_seed,knowledge_ingest all scram-sha-256
      # ... and reach no other database.
      - hostssl all meridian_owner,claims_api,agent_runtime,model_gateway,policy_mcp,claims_mcp,knowledge_mcp,claims_sweep,gateway_upkeep,policy_seed,knowledge_ingest all reject
      # No other role (the app role, for one) reaches meridian.
      - hostssl meridian all all reject
  # login is off by default in the operator; no role gets superuser, createdb,
  # createrole or replication. meridian_owner runs the migrations and owns the
  # database; the other ten are the roles the migrations grant to: six
  # services, the scheduled sweep, the gateway's ledger upkeep and the roles of
  # the seed and ingestion Jobs.
  roles:
    - name: meridian_owner
      ensure: present
      login: true
      passwordSecret:
        name: meridian-owner-db
    - name: claims_api
      ensure: present
      login: true
      passwordSecret:
        name: claims-api-db
    - name: agent_runtime
      ensure: present
      login: true
      passwordSecret:
        name: agent-runtime-db
    - name: model_gateway
      ensure: present
      login: true
      passwordSecret:
        name: model-gateway-db
    # A tool server runs at most MAX_CONCURRENT_CALLS (8) calls in worker
    # threads, one connection each, and writes a failure's audit row on one
    # more. During a rollout two pods of a server run side by side, so 2 * (8 +
    # 1) = 18 is the most it can need; 20 is a bound it never reaches and a
    # runaway cannot pass. The other roles have no such bound until they get a
    # pool (S027).
    - name: policy_mcp
      ensure: present
      login: true
      connectionLimit: 20
      passwordSecret:
        name: policy-mcp-db
    - name: claims_mcp
      ensure: present
      login: true
      connectionLimit: 20
      passwordSecret:
        name: claims-mcp-db
    - name: knowledge_mcp
      ensure: present
      login: true
      connectionLimit: 20
      passwordSecret:
        name: knowledge-mcp-db
    # The scheduled sweep (S052) runs one pod at a time (the CronJob's
    # concurrencyPolicy is Forbid) and holds one connection at a time. A pass
    # started by hand beside the scheduled one makes two pods, and each may
    # open a second connection while it replaces a broken one: 2 * 2 = 4. A
    # runaway job cannot take more of PostgreSQL's 100.
    - name: claims_sweep
      ensure: present
      login: true
      connectionLimit: 4
      passwordSecret:
        name: claims-sweep-db
    # The gateway's ledger upkeep (S066, migration 0020): an operator runs
    # `meridian gateway ...` with this role, and no workload holds its Secret.
    # The command opens one connection for milliseconds, so 2 is one in use and
    # one spare. The limit bounds how many sessions a holder of the credential
    # can hold open; it does not stop one session from sitting in an open
    # transaction, so it is a bound and not a defence. The role is a plain
    # login role, a member of no role: the migration refuses it otherwise, so
    # none of the fields that would change that (superuser, createdb,
    # createrole, bypassrls, replication, inRoles) is ever set here.
    - name: gateway_upkeep
      ensure: present
      login: true
      connectionLimit: 2
      passwordSecret:
        name: gateway-upkeep-db
    # The chart's seed Job (S063, migration 0022): the policy tables and nothing
    # else, in place of the owner's rights over every schema. Its Secret is read
    # by that Job alone. Plain login role, a member of no role, as the migration
    # checks, and no connection limit (a Job holds one connection at a time; a
    # bound is left out until a reason for one is shown).
    - name: policy_seed
      ensure: present
      login: true
      passwordSecret:
        name: policy-seed-db
    # The chart's ingestion Job (S063, migration 0022): the knowledge chunks and
    # one insert-only row of the audit log. Its Secret is read by that Job alone.
    # The same shape as policy_seed, for the same reason.
    - name: knowledge_ingest
      ensure: present
      login: true
      passwordSecret:
        name: knowledge-ingest-db

# Enable pgvector declaratively (CloudNativePG Database resource). The
# extension ships in the "standard" image.
databases:
  - name: app
    owner: app
    extensions:
      - name: vector
  # The Meridian applications' database (migration 0001 creates the schemas in
  # it). It carries pgvector too: the knowledge store (migration 0005, S012)
  # needs it, and meridian_owner cannot create a non-trusted extension, so the
  # operator does it here and the migration only checks that it is there.
  - name: meridian
    owner: meridian_owner
    extensions:
      - name: vector
