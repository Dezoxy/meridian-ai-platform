# yaml-language-server: $schema=schemas/providers.schema.json
# Where model calls can go. Endpoints and account names stay out: the gateway
# reads them from its environment in live mode (S010).
providers:
  - id: azure-openai
    kind: azure-openai
    description: Azure OpenAI; Entra ID only, keys off (S007).
  - id: replay
    kind: replay
    description: Deterministic replay inside the platform; sends nothing out.
  - id: recorded
    kind: recorded
    description: Answers recorded from a real model, replayed inside the platform; sends nothing out (S050).
