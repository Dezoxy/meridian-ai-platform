# yaml-language-server: $schema=schemas/agents.schema.json
# Agents and the tools each may call; anything not listed is refused.
agents:
  - id: claims-triage
    description: Triages a new claim and prepares it for an adjuster.
    tools:
      - policy_lookup
      - claim_history
      - wording_search
      - add_claim_note
      - request_approval
      - approval_outcome
  - id: knowledge-ingestion
    description: Embeds policy wordings for the knowledge store; it calls no tool.
    kind: job
    tools: []
  - id: evaluation-judge
    description: Grades whether a rationale is grounded in the text it was drawn from; it calls no tool.
    kind: job
    tools: []
