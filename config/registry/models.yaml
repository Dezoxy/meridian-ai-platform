# yaml-language-server: $schema=schemas/models.schema.json
# Model deployments: residency label, allowed data classes, retirement and price.
# Prices are USD retail list prices per million tokens.
deployments:
  - id: aoai-sdc-gpt-4o
    provider: azure-openai
    purpose: chat
    model: gpt-4o
    version: "2024-11-20"
    deployment_name: gpt-4o
    sku: Standard
    region: swedencentral
    residency: eu-region
    data_classes: [synthetic, internal, personal]
    retires: 2027-04-14
    price:
      currency: USD
      input_per_million_tokens: 3.025
      output_per_million_tokens: 12.10
      source: "Azure Retail Prices API, meters 'gpt 4o 1120 Inp regnl Tokens' and 'gpt 4o 1120 Outp regnl Tokens'"
      checked: 2026-09-30
    terraform_key: sdc/gpt-4o

  # The same model once more in the same account: the chat route's second
  # candidate until a second region has quota (S042). Its own rate limit, the
  # same region, so it is no answer to a regional outage.
  - id: aoai-sdc-gpt-4o-b
    provider: azure-openai
    purpose: chat
    model: gpt-4o
    version: "2024-11-20"
    deployment_name: gpt-4o-b
    sku: Standard
    region: swedencentral
    residency: eu-region
    data_classes: [synthetic, internal, personal]
    retires: 2027-04-14
    price:
      currency: USD
      input_per_million_tokens: 3.025
      output_per_million_tokens: 12.10
      source: "Azure Retail Prices API, meters 'gpt 4o 1120 Inp regnl Tokens' and 'gpt 4o 1120 Outp regnl Tokens'"
      checked: 2026-09-30
    terraform_key: sdc/gpt-4o-b

  - id: aoai-sdc-text-embedding-3-large
    provider: azure-openai
    purpose: embedding
    model: text-embedding-3-large
    version: "1"
    deployment_name: text-embedding-3-large
    sku: Standard
    region: swedencentral
    residency: eu-region
    data_classes: [synthetic, internal, personal]
    retires: 2028-02-09
    price:
      currency: USD
      input_per_million_tokens: 0.158
      source: "Azure Retail Prices API, meter 'text-embedding-3-large-regional Tokens'"
      checked: 2026-09-30
    terraform_key: sdc/text-embedding-3-large

  - id: replay-chat
    provider: replay
    purpose: chat
    model: replay-chat
    version: "1"
    residency: eu-region
    data_classes: [synthetic, internal, personal]
    price:
      currency: USD
      input_per_million_tokens: 0
      output_per_million_tokens: 0
      source: Runs inside the platform; no provider call
      checked: 2026-09-30

  - id: replay-embedding
    provider: replay
    purpose: embedding
    model: replay-embedding
    version: "1"
    residency: eu-region
    data_classes: [synthetic, internal, personal]
    price:
      currency: USD
      input_per_million_tokens: 0
      source: Runs inside the platform; no provider call
      checked: 2026-09-30
