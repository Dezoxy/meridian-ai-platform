# yaml-language-server: $schema=schemas/policies.schema.json
# Which residency labels each data class may reach, and the ordered candidates per purpose.
# Keep data_classes equal to the table in docs/architecture/security/data-classification.md.
data_classes:
  - id: synthetic
    residency: [eu-region, eu-zone, global]
  - id: internal
    residency: [eu-region, eu-zone]
  - id: personal
    residency: [eu-region, eu-zone]
  - id: special
    residency: []

routes:
  - purpose: chat
    candidates: [aoai-sdc-gpt-4o]
  - purpose: embedding
    candidates: [aoai-sdc-text-embedding-3-large]

# In replay mode the gateway sends every request of a purpose to this
# deployment instead of walking the route (S009). Replay is never a route
# candidate, so a real outage can never be answered with canned text.
replay:
  - purpose: chat
    deployment: replay-chat
  - purpose: embedding
    deployment: replay-embedding
