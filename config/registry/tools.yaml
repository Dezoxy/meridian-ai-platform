# yaml-language-server: $schema=schemas/tools.schema.json
# MCP servers and their tools: effect, scope, the model-facing input schema and
# the output schema of a tool whose server exists.
# The runtime injects the idempotency key, so it is not an input argument.
servers:
  - id: policy-mcp
    description: Policy and claim-history lookups.
  - id: knowledge-mcp
    description: Search over policy wordings.
  - id: claims-mcp
    description: Claim notes and approval requests.

tools:
  - id: policy_lookup
    server: policy-mcp
    description: Look up a policy by its number.
    effect: read
    scope: policy:read
    input_schema:
      type: object
      properties:
        policy_number: {type: string, pattern: "^POL-[0-9]{4}$", maxLength: 8}
      required: [policy_number]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        found: {type: boolean}
        policy:
          type: object
          properties:
            policy_number: {type: string, pattern: "^POL-[0-9]{4}$", maxLength: 8}
            product: {type: string, maxLength: 32}
            wording_version: {type: string, maxLength: 16}
            start_date: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", maxLength: 10}
            end_date: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", maxLength: 10}
            status: {type: string, enum: [active, lapsed]}
            lapsed_on: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", maxLength: 10}
            deductible: {type: integer, minimum: 0, maximum: 1000000000}
            sum_insured: {type: integer, minimum: 0, maximum: 1000000000}
            limit: {type: integer, minimum: 0, maximum: 1000000000}
          required:
            [
              policy_number,
              product,
              wording_version,
              start_date,
              end_date,
              status,
              deductible,
              limit,
            ]
          additionalProperties: false
      required: [found]
      additionalProperties: false

  - id: claim_history
    server: policy-mcp
    description: List earlier claims on a policy.
    effect: read
    scope: claims:history:read
    input_schema:
      type: object
      properties:
        policy_number: {type: string, pattern: "^POL-[0-9]{4}$", maxLength: 8}
      required: [policy_number]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        entries:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              history_id: {type: string, pattern: "^(HIST|CLM)-[0-9]{4}$", maxLength: 9}
              loss_date: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", maxLength: 10}
              peril: {type: string, maxLength: 64}
              paid_amount: {type: integer, minimum: 0, maximum: 1000000000}
              status: {type: string, maxLength: 32}
            required: [history_id, loss_date, peril, paid_amount, status]
            additionalProperties: false
        truncated: {type: boolean}
      required: [entries, truncated]
      additionalProperties: false

  - id: wording_search
    server: knowledge-mcp
    description: >-
      Search the wording of the claim's own policy. Returns the clauses nearest
      to the query, best first; it always returns clauses, also when none is
      relevant.
    effect: read
    scope: knowledge:search
    input_schema:
      type: object
      properties:
        query: {type: string, minLength: 1, maxLength: 500}
        product:
          type: string
          enum: [HOME-STD, HOME-PLUS, MOTOR-COMP, MOTOR-TPL]
          description: >-
            The product of the claim's policy, as policy_lookup returns it;
            another product is refused.
        top_k: {type: integer, minimum: 1, maximum: 10}
      required: [query, product]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        product: {type: string, enum: [HOME-STD, HOME-PLUS, MOTOR-COMP, MOTOR-TPL]}
        wording_version: {type: string, pattern: "^[A-Za-z0-9-]+$", minLength: 1, maxLength: 16}
        chunks:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            properties:
              clause: {type: string, pattern: "^[1-9][0-9]?\\.[1-9][0-9]?$", maxLength: 5}
              section: {type: string, minLength: 1, maxLength: 200}
              title: {type: string, minLength: 1, maxLength: 200}
              body: {type: string, minLength: 1, maxLength: 4000}
              keyword_match:
                type: boolean
                description: >-
                  Whether the clause shares at least one word stem with the
                  query. False for every clause means the query shares no term
                  with the wording.
            required: [clause, section, title, body, keyword_match]
            additionalProperties: false
      required: [product, wording_version, chunks]
      additionalProperties: false

  - id: add_claim_note
    server: claims-mcp
    description: Add a note to a claim.
    effect: write
    scope: claims:note:write
    idempotency_key_required: true
    input_schema:
      type: object
      properties:
        claim_id: {type: string, pattern: "^CLM-[0-9]{4}$", maxLength: 8}
        note: {type: string, minLength: 1, maxLength: 2000}
      required: [claim_id, note]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        note_id: {type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", maxLength: 36}
        replayed: {type: boolean}
      required: [note_id, replayed]
      additionalProperties: false

  - id: request_approval
    server: claims-mcp
    description: Ask an adjuster to approve or decline a claim.
    effect: write
    scope: claims:approval:request
    idempotency_key_required: true
    input_schema:
      type: object
      properties:
        claim_id: {type: string, pattern: "^CLM-[0-9]{4}$", maxLength: 8}
        reason: {type: string, minLength: 1, maxLength: 1000}
      required: [claim_id, reason]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        request_id: {type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", maxLength: 36}
        replayed: {type: boolean}
      required: [request_id, replayed]
      additionalProperties: false

  - id: approval_outcome
    server: claims-mcp
    description: >-
      The outcome recorded for this run's approval request: a decision, or that
      the claim was sent back or withdrawn. The answer has no outcome while
      none is recorded.
    effect: read
    scope: claims:approval:read
    input_schema:
      type: object
      properties:
        claim_id: {type: string, pattern: "^CLM-[0-9]{4}$", maxLength: 8}
      required: [claim_id]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        outcome:
          type: string
          enum: [approve, reject, request_documents, send_back, withdrawn]
      required: []
      additionalProperties: false
